<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>GACP Photo-AI Compliance Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- design tokens ---- */
  --forest-950:#0d1f18;
  --forest-900:#12291f;
  --forest-800:#183a2b;
  --forest-700:#1f4d3a;
  --forest-600:#2a6349;
  --forest-500:#387a5c;
  --sage-400:#6fa583;
  --sage-300:#9cc4ab;
  --sage-200:#c9e2d3;
  --sage-100:#e6f2ea;
  --cream-50:#faf8f3;
  --cream-100:#f3efe4;
  --paper:#fffdf9;
  --gold-500:#c99a3c;
  --gold-400:#dcb45f;
  --gold-100:#f7ecd2;
  --clay-500:#b6522f;
  --clay-100:#f6e1d7;
  --ok-600:#2f7d4f;
  --ok-100:#dcf1e3;
  --warn-600:#b6822f;
  --warn-100:#faedd2;
  --bad-600:#b6412f;
  --bad-100:#f8ddd6;
  --ink-900:#1c231f;
  --ink-700:#3f4a43;
  --ink-500:#6b766e;
  --ink-300:#a3ada5;
  --line:#dfe6de;
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:24px;
  --shadow-sm:0 1px 2px rgba(13,31,24,.06), 0 1px 1px rgba(13,31,24,.04);
  --shadow-md:0 8px 24px -8px rgba(13,31,24,.18);
  --shadow-lg:0 20px 48px -16px rgba(13,31,24,.28);
  --font-ui:'IBM Plex Sans Thai','IBM Plex Sans Thai Looped',-apple-system,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);
  background:
    radial-gradient(1200px 600px at 100% -10%, var(--sage-100) 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 10%, var(--gold-100) 0%, transparent 55%),
    var(--cream-50);
  color:var(--ink-900);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
.app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  background:transparent;
  position:relative;
  padding-bottom:96px;
}
/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg, var(--forest-800), var(--forest-700));
  color:#fff;
  padding:14px 18px 16px;
  border-bottom-left-radius:22px;
  border-bottom-right-radius:22px;
  box-shadow:var(--shadow-md);
}
.topbar-row{display:flex; align-items:center; gap:10px;}
.topbar-back{
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  color:#fff; display:flex;align-items:center;justify-content:center;
  cursor:pointer; flex-shrink:0;
  font-size:16px;
}
.topbar-back:active{background:rgba(255,255,255,.22);}
.brand{
  display:flex; align-items:center; gap:10px; flex:1; min-width:0;
}
.brand-mark{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(145deg, var(--gold-400), var(--gold-500));
  display:flex;align-items:center;justify-content:center;
  font-size:18px; flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
}
.brand-text{min-width:0;}
.brand-title{font-weight:700; font-size:15.5px; line-height:1.15; letter-spacing:.1px;}
.brand-sub{font-size:11.5px; color:var(--sage-200); font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.topbar-action{
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer; font-size:15px; flex-shrink:0;
}
.site-chip{
  margin-top:12px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  border-radius:14px;
  padding:9px 12px;
  display:flex; align-items:center; gap:10px;
}
.site-chip-icon{font-size:16px;}
.site-chip-text{flex:1; min-width:0;}
.site-chip-name{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.site-chip-meta{font-size:10.5px; color:var(--sage-200);}
.progress-ring-mini{position:relative; width:38px;height:38px; flex-shrink:0;}
.progress-ring-mini svg{transform:rotate(-90deg);}
.progress-ring-mini .val{
  position:absolute; inset:0; display:flex;align-items:center;justify-content:center;
  font-size:10px; font-weight:700; color:#fff;
}

/* ---------- content ---------- */
.content{padding:18px 16px 8px;}
.section-title{
  font-size:12.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
  color:var(--forest-600); margin:22px 2px 10px;
  display:flex; align-items:center; gap:8px;
}
.section-title .line{flex:1; height:1px; background:var(--line);}

/* Home hero */
.hero-card{
  background:linear-gradient(155deg, var(--forest-700), var(--forest-900));
  border-radius:var(--radius-lg);
  padding:22px 20px 20px;
  color:#fff;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow-lg);
}
.hero-card::after{
  content:'';
  position:absolute; right:-40px; top:-40px; width:160px;height:160px;
  background:radial-gradient(circle, rgba(220,180,95,.25), transparent 70%);
}
.hero-eyebrow{font-size:11.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--gold-400); font-weight:700;}
.hero-title{font-size:22px; font-weight:700; line-height:1.3; margin:6px 0 8px; position:relative;}
.hero-desc{font-size:13px; color:var(--sage-200); line-height:1.55; position:relative; max-width:340px;}
.hero-stats{display:flex; gap:10px; margin-top:16px; position:relative;}
.hero-stat{
  flex:1; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
  border-radius:14px; padding:10px 8px; text-align:center;
}
.hero-stat b{display:block; font-size:19px; font-weight:700;}
.hero-stat span{font-size:10px; color:var(--sage-200);}

/* Cards grid */
.cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.cat-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:14px 13px 13px;
  cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease;
  position:relative;
  overflow:hidden;
}
.cat-card:active{transform:scale(.97);}
.cat-card-top{display:flex; align-items:flex-start; justify-content:space-between;}
.cat-icon{
  width:38px;height:38px;border-radius:11px;
  display:flex;align-items:center;justify-content:center; font-size:18px;
  background:var(--sage-100);
  flex-shrink:0;
}
.cat-num{font-size:10px; font-weight:700; color:var(--ink-300); letter-spacing:.5px;}
.cat-name{font-size:12.5px; font-weight:600; line-height:1.32; margin-top:9px; color:var(--ink-900); min-height:32px;}
.cat-progress-row{display:flex; align-items:center; gap:7px; margin-top:10px;}
.cat-bar{flex:1; height:5px; background:var(--sage-100); border-radius:3px; overflow:hidden;}
.cat-bar-fill{height:100%; background:linear-gradient(90deg, var(--sage-400), var(--forest-600)); border-radius:3px; transition:width .4s ease;}
.cat-bar-fill.has-fail{background:linear-gradient(90deg, var(--warn-600), var(--bad-600));}
.cat-count{font-size:10px; font-weight:700; color:var(--ink-500); white-space:nowrap;}
.cat-card.done .cat-icon{background:var(--gold-100);}
.cat-badge-dot{
  position:absolute; top:10px; right:10px; width:8px;height:8px;border-radius:50%;
}
.dot-fail{background:var(--bad-600);}
.dot-ok{background:var(--ok-600);}

/* Buttons */
.btn{
  border:none; border-radius:14px; padding:13px 18px; font-weight:600; font-size:14px;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .1s ease, opacity .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(155deg, var(--forest-600), var(--forest-800)); color:#fff; box-shadow:var(--shadow-sm);}
.btn-gold{background:linear-gradient(155deg, var(--gold-400), var(--gold-500)); color:var(--forest-900); box-shadow:var(--shadow-sm);}
.btn-ghost{background:var(--sage-100); color:var(--forest-700);}
.btn-outline{background:transparent; border:1.5px solid var(--line); color:var(--ink-700);}
.btn-danger{background:var(--clay-100); color:var(--clay-500);}
.btn-block{width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-sm{padding:9px 14px; font-size:12.5px; border-radius:11px;}

/* Forms */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink-700); margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; padding:12px 13px; border-radius:12px; border:1.5px solid var(--line);
  font-family:inherit; font-size:14px; background:var(--paper); color:var(--ink-900);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--forest-500);}
.seg{display:flex; gap:8px;}
.seg-btn{
  flex:1; padding:11px 8px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--paper); font-size:12.5px; font-weight:600; color:var(--ink-500); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
.seg-btn .ic{font-size:18px;}
.seg-btn.active{border-color:var(--forest-600); background:var(--sage-100); color:var(--forest-700);}

/* Cards (generic) */
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px; box-shadow:var(--shadow-sm);}

/* Category detail list */
.item-row{
  background:var(--paper); border:1px solid var(--line); border-radius:16px;
  padding:12px; margin-bottom:10px; display:flex; gap:12px; cursor:pointer;
  align-items:flex-start;
}
.item-row:active{background:var(--sage-100);}
.item-thumb{
  width:56px;height:56px;border-radius:12px; flex-shrink:0; overflow:hidden;
  background:var(--sage-100); display:flex;align-items:center;justify-content:center; font-size:20px;
  border:1px solid var(--line);
}
.item-thumb img{width:100%;height:100%;object-fit:cover;}
.item-mid{flex:1; min-width:0;}
.item-code{font-size:10px; font-weight:700; color:var(--forest-600); letter-spacing:.3px;}
.item-title{font-size:13px; font-weight:600; color:var(--ink-900); line-height:1.4; margin-top:2px;}
.item-status{margin-top:6px; display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px;}
.st-pending{background:var(--sage-100); color:var(--ink-500);}
.st-pass{background:var(--ok-100); color:var(--ok-600);}
.st-fail{background:var(--bad-100); color:var(--bad-600);}
.st-review{background:var(--warn-100); color:var(--warn-600);}
.item-chevron{color:var(--ink-300); font-size:16px; align-self:center;}

/* Empty state */
.empty{text-align:center; padding:40px 20px; color:var(--ink-500);}
.empty .ic{font-size:40px; margin-bottom:10px;}
.empty h3{font-size:15px; color:var(--ink-900); margin:0 0 6px;}
.empty p{font-size:12.5px; line-height:1.6; margin:0;}

/* Bottom nav */
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  max-width:520px; margin:0 auto;
  background:rgba(255,253,249,.92); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 20px rgba(13,31,24,.06);
}
.nav-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 4px; border-radius:12px; cursor:pointer; color:var(--ink-500);
  border:none; background:transparent; font-family:inherit;
}
.nav-btn .ic{font-size:19px;}
.nav-btn span{font-size:10px; font-weight:600;}
.nav-btn.active{color:var(--forest-700);}
.nav-btn.active .ic{transform:translateY(-1px);}

/* Modal / sheet */
.overlay{
  position:fixed; inset:0; background:rgba(13,31,24,.55); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.sheet{
  width:100%; max-width:520px; background:var(--cream-50);
  border-top-left-radius:26px; border-top-right-radius:26px;
  max-height:92vh; overflow-y:auto;
  animation:slideUp .22s cubic-bezier(.2,.9,.3,1.1);
  padding-bottom:24px;
}
@keyframes slideUp{from{transform:translateY(30px); opacity:.5;}to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--line); border-radius:3px; margin:10px auto 4px;}
.sheet-head{padding:10px 18px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;}
.sheet-title{flex:1; font-size:15px; font-weight:700;}
.sheet-close{
  width:30px;height:30px;border-radius:50%; background:var(--sage-100); border:none;
  display:flex;align-items:center;justify-content:center; cursor:pointer; color:var(--ink-700); font-size:14px;
}
.sheet-body{padding:16px 18px 4px;}

/* Capture */
.capture-zone{
  border:2px dashed var(--sage-300); border-radius:20px; padding:26px 16px; text-align:center;
  background:var(--sage-100); cursor:pointer; position:relative;
}
.capture-zone .ic{font-size:34px;}
.capture-zone h4{margin:10px 0 4px; font-size:13.5px; color:var(--forest-700);}
.capture-zone p{margin:0; font-size:11px; color:var(--ink-500);}
.preview-wrap{position:relative; border-radius:18px; overflow:hidden; background:#000;}
.preview-wrap img{width:100%; display:block; max-height:340px; object-fit:contain; background:#111;}
.preview-actions{position:absolute; top:10px; right:10px; display:flex; gap:8px;}
.icon-btn{
  width:34px;height:34px;border-radius:50%; background:rgba(0,0,0,.55); color:#fff; border:none;
  display:flex;align-items:center;justify-content:center; cursor:pointer; font-size:14px;
}
.criteria-box{
  background:var(--sage-100); border-radius:14px; padding:12px 13px; margin-top:14px; font-size:12.5px; line-height:1.6; color:var(--ink-700);
}
.criteria-box b{color:var(--forest-700);}

/* Analyzing */
.analyzing{display:flex; flex-direction:column; align-items:center; gap:12px; padding:26px 10px;}
.spinner{
  width:44px;height:44px; border-radius:50%; border:4px solid var(--sage-200); border-top-color:var(--forest-600);
  animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.analyzing p{font-size:12.5px; color:var(--ink-500); margin:0; text-align:center;}

/* Verdict card */
.verdict-card{border-radius:18px; padding:16px; margin-top:14px;}
.verdict-pass{background:var(--ok-100); border:1px solid #b7e0c4;}
.verdict-fail{background:var(--bad-100); border:1px solid #f0c2b6;}
.verdict-review{background:var(--warn-100); border:1px solid #f0dcae;}
.verdict-head{display:flex; align-items:center; gap:10px;}
.verdict-icon{width:38px;height:38px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:18px; flex-shrink:0;}
.verdict-pass .verdict-icon{background:#bfe8cd;}
.verdict-fail .verdict-icon{background:#f2c6b9;}
.verdict-review .verdict-icon{background:#f2ddaa;}
.verdict-label{font-weight:700; font-size:14.5px;}
.verdict-conf{font-size:10.5px; color:var(--ink-500); margin-top:1px;}
.verdict-text{font-size:12.5px; line-height:1.65; margin-top:10px; color:var(--ink-700);}
.verdict-text b{color:var(--ink-900);}
.verdict-rec{margin-top:8px; padding-top:10px; border-top:1px dashed rgba(0,0,0,.12); font-size:12px; line-height:1.6;}

/* Badges */
.badge-hero{
  background:linear-gradient(155deg, var(--gold-400), var(--gold-500));
  border-radius:var(--radius-lg); padding:20px; color:var(--forest-900); text-align:center;
  box-shadow:var(--shadow-md);
}
.badge-hero .big{font-size:34px; font-weight:800;}
.badge-hero .lbl{font-size:11.5px; font-weight:700; letter-spacing:.3px; opacity:.85;}
.badge-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px;}
.badge-item{
  background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:12px 8px; text-align:center;
}
.badge-item.locked{opacity:.4;}
.badge-item .medal{
  width:48px;height:48px;border-radius:50%; margin:0 auto 8px; display:flex;align-items:center;justify-content:center; font-size:22px;
  background:linear-gradient(155deg, var(--gold-400), var(--gold-500)); box-shadow:var(--shadow-sm);
}
.badge-item.locked .medal{background:var(--sage-100); filter:grayscale(1);}
.badge-item .name{font-size:10.5px; font-weight:700; line-height:1.35; color:var(--ink-900);}
.badge-item .desc{font-size:9px; color:var(--ink-500); margin-top:3px; line-height:1.4;}

/* Toast / celebration */
.toast{
  position:fixed; left:50%; top:22px; transform:translateX(-50%); z-index:200;
  background:var(--forest-900); color:#fff; padding:12px 18px; border-radius:16px; font-size:12.5px; font-weight:600;
  box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; max-width:88%;
  animation:toastIn .35s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,-16px);}to{opacity:1; transform:translate(-50%,0);}}
.celebrate-overlay{
  position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center;
  background:rgba(13,31,24,.72); animation:fadeIn .2s ease;
}
.celebrate-card{
  background:var(--paper); border-radius:26px; padding:32px 26px; text-align:center; max-width:300px;
  animation:popIn .35s cubic-bezier(.2,.9,.3,1.2); box-shadow:var(--shadow-lg);
}
@keyframes popIn{from{transform:scale(.7); opacity:0;}to{transform:scale(1); opacity:1;}}
.celebrate-medal{
  width:84px;height:84px;border-radius:50%; margin:0 auto 16px;
  background:linear-gradient(155deg, var(--gold-400), var(--gold-500));
  display:flex;align-items:center;justify-content:center; font-size:38px;
  box-shadow:0 10px 30px -8px rgba(201,154,60,.6);
}
.celebrate-card h3{margin:0 0 6px; font-size:17px; color:var(--forest-800);}
.celebrate-card p{margin:0 0 18px; font-size:12.5px; color:var(--ink-500); line-height:1.6;}

/* Summary */
.summary-score{
  text-align:center; padding:8px 0 4px;
}
.summary-score .num{font-size:48px; font-weight:800; color:var(--forest-800); line-height:1;}
.summary-score .lbl{font-size:12px; color:var(--ink-500); margin-top:4px;}
.summary-bar-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.summary-bar-row:last-child{border-bottom:none;}
.summary-bar-row .name{width:120px; font-size:11.5px; font-weight:600; color:var(--ink-700); flex-shrink:0;}
.summary-bar-row .bar{flex:1; height:8px; background:var(--sage-100); border-radius:5px; overflow:hidden;}
.summary-bar-row .bar-fill{height:100%; border-radius:5px;}
.summary-bar-row .pct{width:38px; text-align:right; font-size:11px; font-weight:700; color:var(--ink-700);}
.fail-list-item{
  display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); align-items:flex-start;
}
.fail-list-item:last-child{border-bottom:none;}
.fail-list-item .dot{width:7px;height:7px;border-radius:50%; background:var(--bad-600); margin-top:5px; flex-shrink:0;}
.fail-list-item .t{font-size:12px; line-height:1.5; color:var(--ink-700);}
.fail-list-item .t b{color:var(--ink-900);}

/* sessions list */
.session-row{
  display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line);
  border-radius:16px; padding:12px; margin-bottom:10px; cursor:pointer;
}
.session-row:active{background:var(--sage-100);}
.session-ic{
  width:42px;height:42px;border-radius:12px; background:var(--sage-100); display:flex;align-items:center;justify-content:center; font-size:18px; flex-shrink:0;
}
.session-mid{flex:1; min-width:0;}
.session-name{font-size:13px; font-weight:700; color:var(--ink-900); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.session-meta{font-size:10.5px; color:var(--ink-500); margin-top:2px;}

/* misc */
.hidden{display:none !important;}
.text-center{text-align:center;}
.mt-8{margin-top:8px;}

const Store = {
  async listSessions(){
    try{
      const r = await window.storage.get('gacp-session-index');
      return r ? JSON.parse(r.value) : [];
    }catch(e){ return []; }
  },
  async saveSessionIndex(idx){
    try{ await window.storage.set('gacp-session-index', JSON.stringify(idx)); }catch(e){}
  },
  async loadSession(id){
    try{
      const r = await window.storage.get('gacp-inspection:'+id);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  },
  async saveSession(session){
    session.updatedAt = Date.now();
    try{ await window.storage.set('gacp-inspection:'+session.id, JSON.stringify(session)); }catch(e){
      console.error('save session failed', e);
    }
    // update index
    let idx = await this.listSessions();
    const meta = {id:session.id, name:session.siteName, type:session.siteType, updatedAt:session.updatedAt, date:session.date};
    const pos = idx.findIndex(x=>x.id===session.id);
    if(pos>=0) idx[pos]=meta; else idx.unshift(meta);
    await this.saveSessionIndex(idx);
  },
  async deleteSession(id){
    try{ await window.storage.delete('gacp-inspection:'+id); }catch(e){}
    let idx = await this.listSessions();
    idx = idx.filter(x=>x.id!==id);
    await this.saveSessionIndex(idx);
  },

    try{
      const r = await window.storage.get('gacp-badges');

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h>=w && h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function dataUrlToBase64(dataUrl){
  return dataUrl.split(',')[1];
}

/* =========================================================================
   AI VISION CALL
   ========================================================================= */
async function analyzePhoto(item, imageDataUrl){
  const base64 = dataUrlToBase64(imageDataUrl);
  const system = `คุณคือผู้ตรวจประเมินมาตรฐาน GACP (Good Agricultural and Collection Practices) สำหรับพืชกัญชาทางการแพทย์ ตามคู่มือแนวทางการประเมินและรับรองมาตรฐานฯ ของกองกัญชาทางการแพทย์ กรมการแพทย์แผนไทยและการแพทย์ทางเลือก ประเทศไทย
หน้าที่ของคุณคือตรวจสอบภาพถ่ายที่เจ้าหน้าที่ภาคสนามส่งมา เทียบกับข้อกำหนด/เกณฑ์การตรวจของข้อนั้น ๆ แล้วให้ผลการประเมินอย่างเที่ยงตรง เป็นกลาง และอิงหลักฐานที่เห็นในภาพเท่านั้น ห้ามสันนิษฐานสิ่งที่มองไม่เห็นในภาพ
ตอบกลับเป็น JSON เท่านั้น ห้ามมีข้อความอื่นนอก JSON ตามรูปแบบนี้:
{"verdict":"pass|fail|review","confidence":"high|medium|low","observation":"สิ่งที่สังเกตเห็นในภาพ อธิบาย 1-2 ประโยค","reasoning":"เหตุผลที่ให้ผลนี้ โดยอ้างอิงกับเกณฑ์ที่กำหนด 1-2 ประโยค","recommendation":"ข้อเสนอแนะสำหรับผู้ปฏิบัติงานหากพบข้อบกพร่องหรือควรปรับปรุง หรือคำชมสั้นๆหากผ่าน"}
เกณฑ์การให้ผล:
- "pass" = ภาพแสดงให้เห็นชัดเจนว่าสอดคล้องกับเกณฑ์
- "fail" = ภาพแสดงให้เห็นชัดเจนว่าไม่สอดคล้องกับเกณฑ์ หรือพบข้อบกพร่อง
- "review" = ภาพไม่ชัดเจนพอ มองไม่เห็นส่วนสำคัญ หรือจำเป็นต้องมีการตรวจสอบเพิ่มเติมโดยผู้ตรวจประเมินจริง`;

  const userText = `หมวดที่ตรวจ: ${CATEGORIES.find(c=>c.id===item.cat).name}
ข้อกำหนดอ้างอิง: ${item.ref}
หัวข้อตรวจ: ${item.title}
สิ่งที่ต้องการให้ถ่ายภาพ: ${item.desc}
เกณฑ์ที่ถือว่าผ่าน: ${item.pass}

โปรดวิเคราะห์ภาพที่แนบมาและให้ผลการประเมินตามรูปแบบ JSON ที่กำหนด`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:1000,
      system: system,
      messages:[{
        role:"user",
        content:[
          {type:"image", source:{type:"base64", media_type:"image/jpeg", data: base64}},
          {type:"text", text: userText}
        ]
      }]
    })
  });
  const data = await response.json();
  const textBlock = (data.content||[]).find(b=>b.type==="text");
  if(!textBlock) throw new Error("no response");
  let clean = textBlock.text.replace(/```json|```/g,"").trim();
  const firstBrace = clean.indexOf('{');
  const lastBrace = clean.lastIndexOf('}');
  if(firstBrace>=0 && lastBrace>=0) clean = clean.slice(firstBrace, lastBrace+1);
  const parsed = JSON.parse(clean);
  return parsed;
}

   ========================================================================= */
function computeSessionStats(session){
  const byCat = {};
  CATEGORIES.forEach(c=> byCat[c.id] = {total:0, captured:0, pass:0, fail:0, review:0});
  let totalCaptured=0, totalPass=0, totalFail=0, totalReview=0;
  ITEMS.forEach(it=>{
    const r = session.results[it.id] || {status:"pending"};
    byCat[it.cat].total++;
    if(r.status && r.status!=="pending"){
      byCat[it.cat].captured++;
      totalCaptured++;
      if(r.status==="pass"){ byCat[it.cat].pass++; totalPass++; }
      else if(r.status==="fail"){ byCat[it.cat].fail++; totalFail++; }
      else if(r.status==="review"){ byCat[it.cat].review++; totalReview++; }
    }
  });
  let categoriesCompleted=0, perfectCategories=0;
  CATEGORIES.forEach(c=>{
    const b = byCat[c.id];
    if(b.captured>=b.total && b.total>0) categoriesCompleted++;
    if(b.captured>=b.total && b.total>0 && b.pass===b.total) perfectCategories++;
  });
  const complianceScore = totalCaptured>0 ? Math.round((totalPass/totalCaptured)*100) : 0;
  return {byCat, totalCaptured, totalPass, totalFail, totalReview, categoriesCompleted, perfectCategories, complianceScore, totalItems:ITEMS.length};
}

async function checkAndAwardBadges(stats){
  const newly = [];
  for(const b of BADGES){
    if(!State.earnedBadges.includes(b.id) && b.check(stats)){
      State.earnedBadges.push(b.id);
      newly.push(b);
    }
  }
  if(newly.length>0){
    await Store.saveBadges(State.earnedBadges);
  }
  return newly;
}

/* =========================================================================
   RENDER HELPERS
   ========================================================================= */
function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}) + ' ' + d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}
function ringSvg(pct, size, stroke, colorVar){
  const r = (size-stroke)/2, c = 2*Math.PI*r, off = c*(1-pct/100);
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(${colorVar})" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/></svg>`;
}

function statusLabel(status){
  if(status==="pass") return {cls:"st-pass", text:"✓ ผ่าน"};
  if(status==="fail") return {cls:"st-fail", text:"✕ ไม่ผ่าน"};
  if(status==="review") return {cls:"st-review", text:"⚠ ต้องตรวจเพิ่ม"};
  return {cls:"st-pending", text:"ยังไม่ถ่ายภาพ"};
}

        <button class="sheet-close" onclick="closeModal()">✕</button>
      </div>
      <div class="sheet-body">
        <button class="btn btn-primary btn-block" style="padding:14px;" onclick="closeModal(); openNewSessionModal();">＋ เริ่มรอบตรวจใหม่</button>
        <div style="height:14px"></div>
        ${State.sessionsIndex.slice().sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,8).map(m=>`
          <div class="session-row" onclick="closeModal(); switchSession('${m.id}')">
            <div class="session-ic">${m.type==='grow'?'🌱':'💊'}</div>
            <div class="session-mid">
              <div class="session-name">${esc(m.name)}${State.session && State.session.id===m.id?' (กำลังใช้งาน)':''}</div>
              <div class="session-meta">${fmtDate(m.updatedAt)}</div>
            </div>
          </div>
        `).join('')}
        ${State.sessionsIndex.length>0 ? `<button class="btn btn-ghost btn-block mt-8" onclick="closeModal(); setView('sessions')">ดูทั้งหมด</button>` : ''}
      </div>
    </div>
  </div>`;
}

/* =========================================================================
   MODAL: BADGE UNLOCK CELEBRATION
   ========================================================================= */
function renderBadgeCelebration(){
  const b = State.modal.badge;
  return `
  <div class="celebrate-overlay" onclick="if(event.target===this) closeModal()">
    <div class="celebrate-card">
      <div class="celebrate-medal">${b.icon}</div>
      <h3>ปลดล็อกเหรียญตราใหม่!</h3>
      <p><b>${esc(b.name)}</b><br>${esc(b.desc)}</p>
      <button class="btn btn-gold btn-block" onclick="closeModal()">เยี่ยมมาก! 🎉</button>
    </div>
  </div>`;
}

function renderConfirmDelete(){
  const {id,name} = State.modal;
  return `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-body text-center" style="padding-top:10px;">
        <div style="font-size:34px;">🗑️</div>
        <h3 style="margin:10px 0 6px; font-size:15px;">ลบรอบตรวจนี้?</h3>
        <p style="font-size:12.5px; color:var(--ink-500); margin:0 0 20px;">"${esc(name)}" จะถูกลบถาวร รวมถึงภาพและผลวิเคราะห์ทั้งหมด</p>
        <div class="row-gap">
          <button class="btn btn-outline" style="flex:1" onclick="closeModal()">ยกเลิก</button>
          <button class="btn btn-danger" style="flex:1" onclick="doDeleteSession('${id}')">ลบเลย</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* =========================================================================
   BOTTOM NAV
   ========================================================================= */
function renderBottomNav(){
  const items = [
    {v:'home', ic:'🏠', label:'หน้าหลัก'},
    {v:'badges', ic:'🏅', label:'เหรียญตรา'},
    {v:'summary', ic:'📊', label:'สรุปผล'},
    {v:'sessions', ic:'🗂', label:'รอบตรวจ'},
  ];
  return `
  <div class="bottomnav">
    ${items.map(it=>`
      <button class="nav-btn ${State.view===it.v?'active':''}" onclick="setView('${it.v}')">
        <span class="ic">${it.ic}</span><span>${it.label}</span>
      </button>
    `).join('')}
  </div>`;
}

/* =========================================================================
   MAIN RENDER
   ========================================================================= */
function render(){
  const root = document.getElementById('root');
  if(State.loading){
    root.innerHTML = `<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;">
      <div class="spinner"></div>
      <div style="font-size:12.5px; color:var(--ink-500);">กำลังโหลดข้อมูล...</div>
    </div>`;
    return;
  }
  let viewHtml = '';
  if(State.view==='home') viewHtml = renderHome();
  else if(State.view==='category') viewHtml = renderCategory();
  else if(State.view==='badges') viewHtml = renderBadges();
  else if(State.view==='summary') viewHtml = renderSummary();
  else if(State.view==='sessions') viewHtml = renderSessions();

  let modalHtml = '';
  if(State.modal){
    if(State.modal.type==='newSession') modalHtml = renderNewSessionModal();
    else if(State.modal.type==='capture') modalHtml = renderCaptureModal();
    else if(State.modal.type==='sessionSwitcher') modalHtml = renderSessionSwitcher();
    else if(State.modal.type==='badgeUnlock') modalHtml = renderBadgeCelebration();
    else if(State.modal.type==='confirmDelete') modalHtml = renderConfirmDelete();
  }

  let toastHtml = '';
  if(State.toast){
    toastHtml = `<div class="toast">${State.toast}</div>`;
  }

  root.innerHTML = `
    <div class="app">
      ${renderTopbar()}
      ${viewHtml}
      ${renderBottomNav()}
    </div>
    ${modalHtml}
    ${toastHtml}
  `;
}

/* =========================================================================
   EVENT HANDLERS
   ========================================================================= */
function setView(v){
  if(v!=='home' && v!=='sessions' && !State.session){
    showToast('กรุณาเริ่มรอบตรวจก่อน');
    openNewSessionModal();
    return;
  }
  State.view = v;
  render();
  window.scrollTo(0,0);
}
function goHome(){ State.view='home'; render(); window.scrollTo(0,0); }
function openCategory(id){ State.activeCategory=id; State.view='category'; render(); window.scrollTo(0,0); }

function openNewSessionModal(){
  State.modal = {type:'newSession'};
  render();
}
function openSessionSwitcher(){
  State.modal = {type:'sessionSwitcher'};
  render();
}
function closeModal(){
  State.modal = null;
  render();
}
function selectSiteType(btn, type){
  document.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  btn.dataset.selected = type;
  window.__nsSiteType = type;
}
window.__nsSiteType = 'grow';

async function createSession(){
  const name = document.getElementById('ns-name').value.trim();
  const inspector = document.getElementById('ns-inspector').value.trim();
  const date = document.getElementById('ns-date').value;
  if(!name){ showToast('กรุณากรอกชื่อสถานที่'); return; }
  const session = emptySession({siteName:name, siteType: window.__nsSiteType||'grow', inspector, date});
  State.session = session;
  await Store.saveSession(session);
  await Store.saveLastSessionId(session.id);
  State.sessionsIndex = await Store.listSessions();
  State.modal = null;
  State.view = 'home';
  render();
  window.scrollTo(0,0);
}

async function switchSession(id){
  const s = await Store.loadSession(id);
  if(s){
    State.session = s;
    await Store.saveLastSessionId(id);
    State.view = 'home';
    State.modal = null;
    render();
    window.scrollTo(0,0);
  }
}

function confirmDeleteSession(id, name){
  State.modal = {type:'confirmDelete', id, name};
  render();
}
async function doDeleteSession(id){
  await Store.deleteSession(id);
  State.sessionsIndex = await Store.listSessions();
  if(State.session && State.session.id===id){
    State.session = null;
    await Store.saveLastSessionId('');
  }
  State.modal = null;
  render();
}

function openCapture(itemId){
  State.modal = {type:'capture', itemId, phase: (State.session.results[itemId]||{}).image ? 'result':'capture', tempImage:null};
  render();
}
async function handleFileSelect(ev){
  const file = ev.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await compressImage(file, 1000, 0.75);
    State.modal.tempImage = dataUrl;
    render();
  }catch(e){
    showToast('ไม่สามารถอ่านไฟล์ภาพได้');
  }
}
function retakePhoto(){
  State.modal.tempImage = null;
  State.modal.phase = 'capture';
  // clear stored result image display but keep until new analysis completes
  render();
}

async function runAnalysis(){
  const itemId = State.modal.itemId;
  const item = ITEMS.find(i=>i.id===itemId);
  const imageForApi = State.modal.tempImage;
  State.modal.phase = 'analyzing';
  render();
  try{
    const result = await analyzePhoto(item, imageForApi);
    // build small thumbnail for storage-efficient persistence
    const thumb = await shrinkForStorage(imageForApi);
    State.session.results[itemId] = {
      status: result.verdict === 'pass' ? 'pass' : result.verdict === 'fail' ? 'fail' : 'review',
      confidence: result.confidence,
      observation: result.observation,
      reasoning: result.reasoning,
      recommendation: result.recommendation,
      image: imageForApi,
      thumb: thumb,
      analyzedAt: Date.now()
    };
    await Store.saveSession(State.session);
    State.modal.phase = 'result';
    render();

    // badge check
    const stats = computeSessionStats(State.session);
    const newBadges = await checkAndAwardBadges(stats);
    if(newBadges.length>0){
      setTimeout(()=>{
        State.modal = {type:'badgeUnlock', badge:newBadges[0]};
        render();
      }, 550);
    }
  }catch(e){
    console.error(e);
    State.modal.phase = 'capture';
    render();
    showToast('วิเคราะห์ไม่สำเร็จ ลองใหม่อีกครั้ง');
  }
}

function shrinkForStorage(dataUrl){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 260;
      let w=img.width, h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', 0.5));
    };
    img.onerror = ()=>resolve(null);
    img.src = dataUrl;
  });
}

function showToast(msg){
  State.toast = esc(msg);
  render();
  setTimeout(()=>{ State.toast=null; render(); }, 2600);
}

function copySummaryText(){
  const s = State.session;
  const stats = computeSessionStats(s);
  let txt = `สรุปผลตรวจ GACP Photo-AI Compliance Check\n`;
  txt += `สถานที่: ${s.siteName} (${s.siteType==='grow'?'พื้นที่ปลูก':'สถานที่แปรรูป/จ่ายยา'})\n`;
  txt += `ผู้ตรวจ: ${s.inspector||'-'}  วันที่: ${s.date||'-'}\n`;
  txt += `ความคืบหน้า: ${stats.totalCaptured}/${stats.totalItems} ข้อ | อัตราผ่านเกณฑ์: ${stats.complianceScore}%\n\n`;
  CATEGORIES.forEach(c=>{
    const b = stats.byCat[c.id];
    if(b.captured>0){
      txt += `หมวด ${c.id}. ${c.name}: ผ่าน ${b.pass} / ไม่ผ่าน ${b.fail} / ต้องตรวจเพิ่ม ${b.review} (จาก ${b.captured}/${b.total})\n`;
    }
  });
  const fails = ITEMS.filter(it=>(s.results[it.id]||{}).status==='fail');
  if(fails.length){
    txt += `\nจุดที่ต้องแก้ไข:\n`;
    fails.forEach(it=>{ txt += `- ข้อ ${it.ref} ${it.title}: ${s.results[it.id].observation||''}\n`; });
  }
  navigator.clipboard.writeText(txt).then(()=>{
    showToast('คัดลอกสรุปผลแล้ว 📋');
  }).catch(()=>{
    showToast('ไม่สามารถคัดลอกได้');
  });
}

/* =========================================================================
   INIT
   ========================================================================= */
async function init(){
  State.loading = true;
  render();
  State.earnedBadges = await Store.loadBadges();
  State.sessionsIndex = await Store.listSessions();
  const lastId = await Store.loadLastSessionId();
  if(lastId){
    const s = await Store.loadSession(lastId);
    if(s) State.session = s;
  }
  State.loading = false;
  render();
}
init();
</script>
