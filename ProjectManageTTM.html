function uploadExpensePlanToProject(){
  const ep = UI.expensePlan;
  if(!ep.items.length){ showToast('ยังไม่มีรายการค่าใช้จ่าย'); return; }
  const total = expensePlanTotal();
  if(ep.targetProjectId){
    const p = getProject(ep.targetProjectId); if(!p){ showToast('ไม่พบโครงการปลายทาง'); return; }
    p.expenseItems = ep.items.map(it=>({...it}));
    p.budgetAmount = total;
    logAction('อัพโหลดรายละเอียดค่าใช้จ่าย', `เข้าโครงการ "${p.name}" รวม ${money(total)} บาท (${ep.items.length} รายการ)`);
    saveDB();
    showToast('อัพโหลดรายละเอียดค่าใช้จ่ายเข้าโครงการเรียบร้อย');
    DB.currentYear = p.year; saveDB();
    UI.route='projects'; render();
    openProjectDetail(p.id);
  }else{
    const name = document.getElementById('ep_newname').value.trim();
    if(!name){ showToast('กรุณากรอกชื่อโครงการใหม่'); return; }
    const maxSort = Math.max(0,...DB.projects.filter(p=>p.priority==='mid' && p.year===ep.year).map(p=>p.sortOrder||0));
    const newProj = {
      id:uid('proj'), year:ep.year, name, categoryId:DB.categories[0]?.id||'', ownerPersonIds:DB.personnel[0]?[DB.personnel[0].id]:[], ownerPersonId:DB.personnel[0]?.id||'',
      priority:'mid', status:'notstarted', startDate:'', endDate:'', budgetAmount:total, budgetType:DB.budgetTypes[0]||'',
      budgetSource:DB.budgetSources[0]||'', target:'', indicator:'', description:'จัดทำรายละเอียดค่าใช้จ่ายจากหน้า "รายละเอียดค่าใช้จ่าย" อ้างอิงระเบียบ สสจ.สป.',
      attachments:[], disbRequestDate:'', disbCompleteDate:'', disbAmount:0, disbNote:'',
      expenseItems: ep.items.map(it=>({...it})), sortOrder:maxSort+1, createdAt:new Date().toISOString()
    };
    DB.projects.push(newProj);
    logAction('สร้างโครงการจากรายละเอียดค่าใช้จ่าย', `"${name}" รวม ${money(total)} บาท`);
    saveDB();
    showToast('สร้างโครงการใหม่พร้อมรายละเอียดค่าใช้จ่ายเรียบร้อย');
    DB.currentYear = ep.year; saveDB();
    UI.route='projects'; render();
    openProjectDetail(newProj.id);
  }
  UI.expensePlan = { year: DB.currentYear, targetProjectId:'', newProjectName:'', items:[] };
}

/* =========================================================================
   VIEW: Risk Register (ทะเบียนความเสี่ยงโครงการ)

function viewRiskRegister(){
  const all = allRisksInYear();
  const high = all.filter(x=>riskScore(x.risk)>=15).length;
  const mid = all.filter(x=>{const s=riskScore(x.risk); return s>=8 && s<15;}).length;
  const low = all.filter(x=>riskScore(x.risk)<8).length;
  const openCount = all.filter(x=>x.risk.status!=='closed').length;
  return `
  <div class="grid grid-4">
    ${kpiCard('⚠️','ความเสี่ยงทั้งหมด', all.length, `${openCount} ยังไม่ปิด`)}
    ${kpiCard('🔴','ระดับสูงมาก', high, 'คะแนน 15 ขึ้นไป')}
    ${kpiCard('🟡','ระดับปานกลาง', mid, 'คะแนน 8-14')}
    ${kpiCard('🟢','ระดับต่ำ', low, 'คะแนนต่ำกว่า 8')}
  </div>
  <div class="card" style="margin-top:16px;">
    <div class="card-head"><div class="card-title">ทะเบียนความเสี่ยง ปีงบ ${DB.currentYear} — เรียงตามระดับความรุนแรง</div></div>
    <div class="tbl-wrap card-pad" style="padding-top:12px;">
    <table><thead><tr><th>โครงการ</th><th>ความเสี่ยง</th><th style="text-align:center;">โอกาส</th><th style="text-align:center;">ผลกระทบ</th><th style="text-align:center;">คะแนน</th><th>ระดับ</th><th>สถานะ</th><th>มาตรการรองรับ</th></tr></thead>
      <tbody>
        ${all.length? all.map(({project,risk})=>{
          const score=riskScore(risk); const lvl=riskLevel(score);
          const st = RISK_STATUS.find(s=>s.id===risk.status)||RISK_STATUS[0];
          return `<tr class="tbl-row" onclick="openProjectDetail('${project.id}')">
            <td style="max-width:200px;">${escapeHtml(project.name)}</td>
            <td style="font-weight:600;max-width:200px;">${escapeHtml(risk.name)}</td>
            <td style="text-align:center;">${risk.probability}/5</td>
            <td style="text-align:center;">${risk.impact}/5</td>
            <td style="text-align:center;font-weight:700;">${score}</td>
            <td><span class="badge ${lvl.cls}">${lvl.label}</span></td>
            <td class="small-muted">${st.label}</td>
            <td class="small-muted" style="max-width:220px;">${escapeHtml(risk.mitigation)||'-'}</td>
          </tr>`;
        }).join('') : `<tr><td colspan="8"><div class="empty-state"><div class="ic">✅</div>ยังไม่มีการบันทึกความเสี่ยงในปีงบนี้<br><span class="small-muted">เพิ่มได้จากหน้ารายละเอียดโครงการแต่ละโครงการ</span></div></td></tr>`}
      </tbody>
    </table>
    </div>
  </div>
  <p class="small-muted" style="margin-top:10px;">* คะแนนความเสี่ยง = โอกาสเกิด × ผลกระทบ (1-5 คูณกัน ได้ 1-25) · 15 ขึ้นไป = สูงมาก, 8-14 = ปานกลาง, ต่ำกว่า 8 = ต่ำ</p>
  `;
}

/* =========================================================================
   VIEW: Resource Heatmap (แผนที่ความหนาแน่นภาระงานบุคลากร)
   ========================================================================= */
function computeHeatmapData(role){
  const y = DB.currentYear;
  const fyStartCE = y-543-1, fyEndCE=y-543;
  const projs = yearProjects();
  const pids = new Set(projs.map(p=>p.id));
  const tasksInYear = DB.tasks.filter(t=>pids.has(t.projectId));
  const data = {};
  DB.personnel.forEach(p=>{ data[p.id] = Array(12).fill(0); });
  function monthCellRange(i){
    const cellCE = fyStartCE + Math.floor((9+i)/12);
    const cellMonth = (9+i)%12;
    return {start:new Date(cellCE,cellMonth,1), end:new Date(cellCE,cellMonth+1,0)};
  }
  projs.forEach(p=>{
    if(!p.startDate || !p.endDate) return;
    const owners = projectOwnerIds(p).filter((oid,ix)=>data[oid] && (!role || (role==='primary')===(ix===0)));
    if(!owners.length) return;
    const s = new Date(p.startDate+'T00:00:00'), e = new Date(p.endDate+'T00:00:00');
    for(let i=0;i<12;i++){
      const {start,end} = monthCellRange(i);
      if(s<=end && e>=start) owners.forEach(oid=> data[oid][i]++);
    }
  });
  tasksInYear.forEach(t=>{
    if(!t.dueDate || !data[t.assigneeId]) return;
    if(role){ const tr = projectRoleOf(getProject(t.projectId), t.assigneeId)==='primary' ? 'primary' : 'co'; if(tr!==role) return; }
    const d = new Date(t.dueDate+'T00:00:00');
    for(let i=0;i<12;i++){
      const {start,end} = monthCellRange(i);
      if(d>=start && d<=end){ data[t.assigneeId][i]++; break; }
    }
  });
  return data;
}
function heatColor(n){
  if(n<=0) return '#F5F8F6';
  if(n===1) return '#DCEFE2';
  if(n===2) return '#AEDFC0';
  if(n===3) return '#F7DDA0';
  if(n===4) return '#F0B25E';
  return '#E8746B';
}

function refreshEvalOkrHint(){
  const box=document.getElementById('evalOkrHint'); const sel=document.getElementById('e_person'); if(!box||!sel) return;

  const s=personOkrSummary(sel.value, undefined, lv);
  if(!s.n){ box.innerHTML=roleTxt+'บุคคลนี้ยังไม่มี OKR ที่รับผิดชอบในระดับนี้'; return; }
  box.innerHTML=roleTxt+`OKR ปีงบ ${okrActiveYear()}: ${s.n} กิจกรรม · ${s.krN} KR · ความคืบหน้าเฉลี่ย <b>${s.avg}%</b> (คาดหวัง ณ ตอนนี้ ~${s.exp}%) (สำเร็จ ${s.done} · เสี่ยง ${s.risk} · ล่าช้า ${s.late}) → ดาวแนะนำ <b>${s.stars}★</b> <button type="button" class="btn btn-ghost btn-sm" onclick="setStar('okr',${s.stars})">ใช้ค่าแนะนำ</button>`;
}
function setStar(key,val){

function addFY(){ const v=Number(document.getElementById('newFY').value); if(!v) return; if(!DB.fiscalYears.includes(v)){ DB.fiscalYears.push(v); saveDB(); render(); } }
function removeFY(y){ if(DB.fiscalYears.length<=1){ showToast('ต้องมีอย่างน้อย 1 ปีงบ'); return;} DB.fiscalYears=DB.fiscalYears.filter(x=>x!==y); if(DB.currentYear===y) DB.currentYear=DB.fiscalYears[0]; saveDB(); render(); }
function addCategory(){ const v=document.getElementById('newCat').value.trim(); if(!v) return; DB.categories.push({id:uid('cat'),name:v,color:'#'+Math.floor(Math.random()*16777215).toString(16)}); saveDB(); render(); }
function removeCategory(id){ DB.categories=DB.categories.filter(c=>c.id!==id); saveDB(); render(); }
function addListItem(listName, inputId){ const v=document.getElementById(inputId).value.trim(); if(!v) return; DB[listName].push(v); saveDB(); render(); }
function removeListItem(listName, idx){ DB[listName].splice(idx,1); saveDB(); render(); }
function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='WorkPeopleOps_backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  URL.revokeObjectURL(url);
  try{ DB.meta.lastBackup=new Date().toISOString(); if(!isViewer()) saveDB(); }catch(e){}
  showToast('ส่งออกไฟล์สำรองเรียบร้อย');
}
function resetAllData(){
  if(viewerBlock()) return;
  if(!confirm('ยืนยันล้างข้อมูลทั้งหมดและเริ่มต้นใหม่ด้วยข้อมูลตัวอย่าง? การกระทำนี้ไม่สามารถย้อนกลับได้')) return;
  DB=seedData(); saveDB(); render();
  showToast('รีเซ็ตข้อมูลเรียบร้อย');
}

function openModal(title, bodyHtml, footerHtml, wide){
  closeModal();
  const overlay=document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='modalOverlay';
  overlay.innerHTML=`<div class="modal ${wide?'modal-wide':''}">
    <div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot">${footerHtml}</div>
  </div>`;
  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
}
function closeModal(){ const o=document.getElementById('modalOverlay'); if(o) o.remove(); }

/* =========================================================================
   Global events + charts
   ========================================================================= */
function wireGlobalEvents(){
  wireTopbarEvents();
  wireSidebarEvents();
  wireRouteEvents();
}
/* wireTopbarEvents(): fySelect / quick-add / global search — these elements are only ever recreated by a
   FULL render() (topbar HTML). Never call this from a partial refresh (contentArea/sidebar-only), or the
   same persisting topbar elements will accumulate duplicate listeners. */
function wireTopbarEvents(){
  const fy=document.getElementById('fySelect');
  if(fy) fy.addEventListener('change', e=>{ DB.currentYear=Number(e.target.value); saveDB(); render(); });
  const qa=document.getElementById('btnQuickAddProject');
  if(qa) qa.addEventListener('click', ()=>openProjectForm());

  const gs=document.getElementById('globalSearch');
  if(gs){
    gs.addEventListener('input', e=>{
      const panel=document.getElementById('globalSearchResults');
      const q=e.target.value;
      if(!q.trim()){ panel.style.display='none'; return; }
      panel.innerHTML = doGlobalSearch(q);
      panel.style.display='block';
    });
    gs.addEventListener('focus', e=>{ if(e.target.value.trim()){ document.getElementById('globalSearchResults').style.display='block'; } });
  }
  if(!window.__gsDocListenerAdded){
    window.__gsDocListenerAdded = true;
    document.addEventListener('click', function(e){
      const panel=document.getElementById('globalSearchResults');
      const inp=document.getElementById('globalSearch');
      if(panel && inp && !panel.contains(e.target) && e.target!==inp){ panel.style.display='none'; }
    });
  }
}
/* wireSidebarEvents(): nav-item / tab-item clicks. Safe to call whenever the sidebar (or tab bar) DOM was
   actually replaced — e.g. full render(), or refreshBackground() which also refreshes the sidebar for
   up-to-date badge counts. Never call on a contentArea-only refresh, since the (unchanged) sidebar nodes
   would accumulate duplicate listeners. */
function wireSidebarEvents(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const grp = el.dataset.group;
      if(grp && groupKeyOfRoute(UI.route)===grp){ return; } // already viewing this section, keep current tab
      UI.route=el.dataset.route; UI.personDetailId=null; render();
    });
  });
  document.querySelectorAll('.tab-item').forEach(el=>{
    el.addEventListener('click', ()=>{ UI.route=el.dataset.route; UI.personDetailId=null; render(); });
  });
}
/* wireRouteEvents(): wires interactions WITHIN #contentArea only (filters, inline forms, etc).
   Safe to call on its own after ANY partial #contentArea refresh — it never touches the
   sidebar/topbar/search DOM, so it can never accumulate duplicate listeners on those elements. */
function wireRouteEvents(){
  if(UI.route==='projects'){
    const q=document.getElementById('fltQ'); if(q) q.addEventListener('input', e=>{ UI.projectFilter.q=e.target.value; document.getElementById('contentArea').innerHTML=viewProjects(); wireRouteEvents(); });
    const s=document.getElementById('fltStatus'); if(s) s.addEventListener('change', e=>{ UI.projectFilter.status=e.target.value; document.getElementById('contentArea').innerHTML=viewProjects(); wireRouteEvents(); });
    const c=document.getElementById('fltCat'); if(c) c.addEventListener('change', e=>{ UI.projectFilter.cat=e.target.value; document.getElementById('contentArea').innerHTML=viewProjects(); wireRouteEvents(); });
    const pr=document.getElementById('fltPri'); if(pr) pr.addEventListener('change', e=>{ UI.projectFilter.pri=e.target.value; document.getElementById('contentArea').innerHTML=viewProjects(); wireRouteEvents(); });
    const ow=document.getElementById('fltOwner'); if(ow) ow.addEventListener('change', e=>{ UI.projectFilter.owner=e.target.value; document.getElementById('contentArea').innerHTML=viewProjects(); wireRouteEvents(); });
    const src=document.getElementById('fltSource'); if(src) src.addEventListener('change', e=>{ UI.projectFilter.source=e.target.value; document.getElementById('contentArea').innerHTML=viewProjects(); wireRouteEvents(); });
    const fcode=document.getElementById('fltCode'); if(fcode) fcode.addEventListener('input', e=>{ UI.projectFilter.code=e.target.value; document.getElementById('contentArea').innerHTML=viewProjects(); wireRouteEvents(); });
    const btnCode=document.getElementById('btnSearchCode');
    if(btnCode) btnCode.addEventListener('click', ()=>{ const v=document.getElementById('fltCode'); UI.projectFilter.code=v?v.value:''; document.getElementById('contentArea').innerHTML=viewProjects(); wireRouteEvents(); });
    const clr=document.getElementById('btnClearFilter'); if(clr) clr.addEventListener('click', ()=>{ UI.projectFilter={status:'',cat:'',pri:'',q:'',code:'',owner:'',source:''}; document.getElementById('contentArea').innerHTML=viewProjects(); wireRouteEvents(); });
    document.querySelectorAll('.projSelChk').forEach(chk=>{
      chk.addEventListener('change', e=>{ const id=e.target.dataset.id; if(e.target.checked) UI.projectsSelected.add(id); else UI.projectsSelected.delete(id); document.getElementById('contentArea').innerHTML=viewProjects(); wireRouteEvents(); });
    });
    const selAllP=document.getElementById('btnSelectAllProj');
    if(selAllP) selAllP.addEventListener('click', ()=>{ document.querySelectorAll('.projSelChk').forEach(c=>{ UI.projectsSelected.add(c.dataset.id); }); document.getElementById('contentArea').innerHTML=viewProjects(); wireRouteEvents(); });
    const clearSelP=document.getElementById('btnClearSelProj');
    if(clearSelP) clearSelP.addEventListener('click', ()=>{ UI.projectsSelected.clear(); document.getElementById('contentArea').innerHTML=viewProjects(); wireRouteEvents(); });
    const moveBtn=document.getElementById('btnMoveProjYear');
    if(moveBtn) moveBtn.addEventListener('click', openMoveProjectsModal);
  }
  if(UI.route==='settings'){
    const imp=document.getElementById('importFile');
    if(imp) imp.addEventListener('change', handleImportJSON);
  }
  if(UI.route==='baseedit'){
    const by=document.getElementById('baseYearSelect');
    if(by) by.addEventListener('change', e=>{ UI.baseEditSourceYear=Number(e.target.value)||null; UI.baseEditSelected.clear(); document.getElementById('contentArea').innerHTML=viewBaseEdit(); wireRouteEvents(); });
    document.querySelectorAll('.baseEditChk').forEach(chk=>{
      chk.addEventListener('change', e=>{ const id=e.target.dataset.id; if(e.target.checked) UI.baseEditSelected.add(id); else UI.baseEditSelected.delete(id); });
    });
    const selAll=document.getElementById('btnSelectAllBase');
    if(selAll) selAll.addEventListener('click', ()=>{ document.querySelectorAll('.baseEditChk').forEach(c=>{ c.checked=true; UI.baseEditSelected.add(c.dataset.id); }); });
    const deselAll=document.getElementById('btnDeselectAllBase');
    if(deselAll) deselAll.addEventListener('click', ()=>{ document.querySelectorAll('.baseEditChk').forEach(c=>{ c.checked=false; }); UI.baseEditSelected.clear(); });
    const copyBtn=document.getElementById('btnCopySelected');
    if(copyBtn) copyBtn.addEventListener('click', copySelectedBaseProjects);
    const saveBtn=document.getElementById('btnSaveBulkEdit');
    if(saveBtn) saveBtn.addEventListener('click', saveBulkProjectEdits);
  }
  if(UI.route==='auditlog'){
    const saveUserBtn=document.getElementById('btnSaveUserName');
    if(saveUserBtn) saveUserBtn.addEventListener('click', saveCurrentUserName);
  }
  if(UI.route==='expenseplanner'){
    const epy=document.getElementById('ep_year');
    if(epy) epy.addEventListener('change', e=>{ UI.expensePlan.year=Number(e.target.value); UI.expensePlan.targetProjectId=''; document.getElementById('contentArea').innerHTML=viewExpensePlanner(); wireRouteEvents(); });
    const ept=document.getElementById('ep_target');
    if(ept) ept.addEventListener('change', e=>{ UI.expensePlan.targetProjectId=e.target.value; document.getElementById('contentArea').innerHTML=viewExpensePlanner(); wireRouteEvents(); });
    const epn=document.getElementById('ep_newname');
    if(epn) epn.addEventListener('input', e=>{ UI.expensePlan.newProjectName=e.target.value; });
  }
  if(UI.route==='disbtrack'){
    document.querySelectorAll('[data-disb-input]').forEach(inp=>{
      inp.addEventListener('change', e=>{
        updateDisbBySource(e.target.dataset.projectId, e.target.dataset.code, e.target.value);
        refreshBackground();
      });
    });
  }
}
function refreshBackground(){
  // re-render current list-type views quietly to keep counts (incl. sidebar badges) fresh when modal stays open
  if(!document.getElementById('modalOverlay')){
    const sidebarEl = document.querySelector('.sidebar');
    if(sidebarEl) sidebarEl.outerHTML = renderSidebar(); // sidebar replaced fresh -> safe to rewire its listeners
    document.getElementById('contentArea').innerHTML = renderRoute();
    wireSidebarEvents(); wireRouteEvents(); afterRenderHook();
    // NOTE: topbar is untouched here on purpose — never call wireTopbarEvents()/wireGlobalEvents() from a
    // partial refresh like this one, or the persisting topbar elements accumulate duplicate listeners.
  }
}
function handleImportJSON(e){
  if(viewerBlock()) return;
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data.projects || !data.personnel){ showToast('ไฟล์ไม่ถูกต้อง'); return; }
      if(confirm('นำเข้าข้อมูลนี้จะแทนที่ข้อมูลปัจจุบันทั้งหมด ยืนยันหรือไม่?')){
        DB=data; ensureOKRData(); ensureCarbonData(); ensureKpiSeed(); saveDB(); render(); showToast('นำเข้าข้อมูลเรียบร้อย');
      }
    }catch(err){ showToast('อ่านไฟล์ไม่สำเร็จ: ไฟล์ไม่ใช่ JSON ที่ถูกต้อง'); }
  };
  reader.readAsText(file);
}

/* =========================================================================
   v3.16 — OKR (เชื่อมประเมินบุคคล) และ Carbon Footprint
   ที่มาข้อมูลตั้งต้น: ไฟล์ V8 ชีต "OKR รายกิจกรรม" และ "Carbon Footprint" (11 ต.ค. 69)
   - ข้อมูลตั้งต้นนำเข้าครั้งเดียว (บันทึกคีย์ที่นำเข้าแล้วไว้ใน DB.okr.seeded) ไม่ทับ/ไม่เพิ่มซ้ำสิ่งที่พี่จีแก้ไขหรือลบ
   - ค่าเป้าหมายใน KR ที่ไม่มีในแผนเดิมเป็นค่าที่เสนอ ให้ผู้รับผิดชอบยืนยันก่อนใช้ (ตามหมายเหตุในไฟล์ V8)

function sdiv(a,b){ b=Number(b); return b? a/b : 0; }
function matchOwnerIds(text){
  const ids=[]; const t=String(text||'');
  (DB.personnel||[]).forEach(p=>{
    const core=String(p.name||'').replace(/^(นางสาว|นาง|นาย|ดร\.|ภก\.|ภญ\.)/,'').trim().split(/\s+/)[0];
    if(!core) return;
    const hit = t.includes(core) || Object.keys(OWNER_ALIAS).some(k=>t.includes(k) && OWNER_ALIAS[k]===core);
    if(hit && !ids.includes(p.id)) ids.push(p.id);
  });
  return ids;
}
/* v3.17 — เติม "ผู้รับผิดชอบร่วม" ให้โครงการปี 2570 จากรายชื่อใน "ผู้รับผิดชอบ:" ของรายละเอียดโครงการ (ข้อมูลจากไฟล์ Excel)
   เพิ่มเฉพาะคนที่ยังไม่อยู่ในรายชื่อ โดยไม่เปลี่ยนผู้รับผิดชอบหลัก (คนแรก) · ทำครั้งเดียวต่อโครงการ (จำธงไว้) จึงไม่เติมซ้ำถ้าผู้ใช้ลบออกเอง */
function backfillCoOwners(){
  let n=0; const notes=[];
  try{
    (DB.projects||[]).forEach(p=>{
      if(p.year!==2570 || p.coOwnersBackfilled) return;
      p.coOwnersBackfilled=true;
      const m=String(p.description||'').match(/ผู้รับผิดชอบ:\s*([^|]*)/); if(!m) return;
      const cur=projectOwnerIds(p).slice();
      const add=matchOwnerIds(m[1]).filter(id=>!cur.includes(id));
      if(!add.length) return;
      p.ownerPersonIds=cur.concat(add); p.ownerPersonId=p.ownerPersonIds[0];
      notes.push(`${p.projectCode||p.name.slice(0,20)}: +${add.map(getPersonName).join(', ')}`); n++;
    });
    if(n>0){
      if(!DB.auditLog) DB.auditLog=[];
      DB.auditLog.unshift({id:uid('log'), action:'เติมผู้รับผิดชอบร่วมอัตโนมัติ', detail:`เพิ่มผู้รับผิดชอบร่วม ${n} โครงการ (ผู้รับผิดชอบหลักไม่เปลี่ยน) ตามรายชื่อในรายละเอียดโครงการ: ${notes.join(' | ')}`, actor:'ระบบ (อัตโนมัติ)', at:new Date().toISOString()});
    }
    if(n>0 || (DB.projects||[]).length) saveDB();
  }catch(e){}
  return n;
}
function parseQuarters(s){
  const m=String(s||'').match(/(\d)(?:\s*-\s*(\d))?/);
  if(!m) return [1,4];
  const a=Math.min(4,Math.max(1,Number(m[1]))), b=m[2]?Math.min(4,Math.max(1,Number(m[2]))):a;
  return [Math.min(a,b),Math.max(a,b)];
}
/* นำเข้า OKR ตั้งต้นจาก V8 — idempotent: จำคีย์ "รหัสโครงการ|ลำดับกิจกรรม" ที่นำเข้าแล้ว */
function ensureOKRData(){
  if(!DB.okr || typeof DB.okr!=='object') DB.okr={objectives:[],items:[],seeded:[]};
  const o=DB.okr; ['objectives','items','seeded'].forEach(k=>{ if(!Array.isArray(o[k])) o[k]=[]; });
  let added=0;
  OKR_SEED.forEach(sp=>{
    if(!o.seeded.includes(sp.code+'|O')){
      o.objectives.push({id:uid('okro'), year:OKR_YEAR, projectCode:sp.code, text:String(sp.objective||'').replace(/^O\s*:\s*/,'')});
      o.seeded.push(sp.code+'|O');
    }
    sp.acts.forEach(a=>{
      const key=sp.code+'|'+a.no; if(o.seeded.includes(key)) return;
      const [qs,qe]=parseQuarters(a.quarter);
      o.items.push({id:uid('okri'), year:OKR_YEAR, projectCode:sp.code, no:a.no, name:a.name, budget:Number(a.budget)||0,
        source:['เงินบำรุง','กองทุนฯ','ไม่ใช้งบ'].includes(a.src)?a.src:'', qStart:qs, qEnd:qe,
        ownerPersonIds:matchOwnerIds(a.owner), ownerText:a.owner||'', evidence:a.evidence||'',
        krs:(a.kr||[]).filter(Boolean).map(t=>({id:uid('kr'), text:t, progress:0})), checkins:[]});
      o.seeded.push(key); added++;
    });
  });
  if(added>0){
    if(!DB.auditLog) DB.auditLog=[];
    DB.auditLog.unshift({id:uid('log'), action:'นำเข้า OKR รายกิจกรรมอัตโนมัติ', detail:`นำเข้า OKR ปี 2570 จำนวน ${added} กิจกรรม จากไฟล์ V8`, actor:'ระบบ (อัตโนมัติ)', at:new Date().toISOString()});
    saveDB();
  }
  return added;
}
function ensureCarbonData(){
  if(!DB.carbon || typeof DB.carbon!=='object'){
    const ef={}; CARBON_EF_KEYS.forEach((k,i)=>{ ef[k]=Number(CARBON_SEED.ef[i].value); });
    DB.carbon={year:2570, ef, plans:CARBON_SEED.plans.map(p=>({
      id:uid('cbp'), no:p.no, name:p.name, relevance:p.relevance, kind:p.kind, scope:p.scope, detail:p.detail,
      carDays:Number(p.carDays)||0, roomDays:Number(p.roomDays)||0, attendDays:Number(p.attendDays)||0, directKwh:Number(p.directKwh)||0,
      measure:p.measure, reducePct:Number(p.reducePct)||0, kr:p.kr, projectCodes:p.projectCodes.slice(), ownerPersonId:'', status:'notstarted', progress:0
    })), logs:[]};
    if(!DB.auditLog) DB.auditLog=[];
    DB.auditLog.unshift({id:uid('log'), action:'นำเข้า Carbon Footprint อัตโนมัติ', detail:`นำเข้าแผนประมาณการก๊าซเรือนกระจก ${DB.carbon.plans.length} รายการ และค่า EF จากไฟล์ V8`, actor:'ระบบ (อัตโนมัติ)', at:new Date().toISOString()});
    saveDB(); return 1;
  }
  const c=DB.carbon;
  if(!c.ef) c.ef={}; CARBON_EF_KEYS.forEach((k,i)=>{ if(!(Number(c.ef[k])>=0) || c.ef[k]==null) c.ef[k]=Number(CARBON_SEED.ef[i].value); });
  if(!Array.isArray(c.plans)) c.plans=[]; if(!Array.isArray(c.logs)) c.logs=[];
  return 0;
}

/* ---------- ช่วงเวลา / ไตรมาสปีงบ ---------- */
function currentFYQuarter(year){
  const y=(year||DB.currentYear)-543-1; const now=new Date();
  const m=(now.getFullYear()*12+now.getMonth())-(y*12+9);
  if(m<0) return 0; if(m>=12) return 5; return Math.floor(m/3)+1;
}
function qLabel(i){ return i.qStart===i.qEnd ? `ไตรมาส ${i.qStart}` : `ไตรมาส ${i.qStart}–${i.qEnd}`; }

/* ---------- OKR: คำนวณ ---------- */
function okrActiveYear(){
  ensureOKRData(); const ys=[...new Set(DB.okr.items.map(i=>i.year))];
  if(ys.includes(DB.currentYear) || !ys.length) return DB.currentYear;
  return Math.max(...ys); /* ปีงบที่เลือกไม่มี OKR → แสดงปีล่าสุดที่มี (ข้อมูลตั้งต้นจาก V8 เป็นปี 2570) */
}
function okrItems(year){ ensureOKRData(); const y=year||okrActiveYear(); return DB.okr.items.filter(i=>i.year===y); }
function itemProgress(i){ const k=i.krs||[]; if(!k.length) return 0; return Math.round(k.reduce((s,x)=>s+(Number(x.progress)||0),0)/k.length); }
function itemExpected(i){
  const q=currentFYQuarter(i.year); if(q<i.qStart) return 0; if(q>i.qEnd) return 100;
  return Math.round((q-i.qStart+1)/(i.qEnd-i.qStart+1)*100);
}
function itemHealth(i){
  const p=itemProgress(i), e=itemExpected(i);
  if(p>=100) return {key:'done',label:'สำเร็จ'};
  if(e===0) return p>0 ? {key:'ontrack',label:'กำลังดำเนินการ'} : {key:'wait',label:'ยังไม่ถึงกำหนด'};
  const gap=e-p;
  if(gap<=10) return {key:'ontrack',label:'ตามแผน'};
  if(gap<=30) return {key:'risk',label:'เสี่ยงล่าช้า'};
  return {key:'late',label:'ล่าช้า'};
}
function okrBadge(h){
  const m={done:['#E1F5E9','#0F7A45'],ontrack:['#E3F1FB','#1D5F94'],risk:['#FFF3D6','#9C6B0B'],late:['#FDE4E4','#B02A2A'],wait:['#EEF1EF','#5C6B63']}[h.key]||['#EEF1EF','#5C6B63'];
  return `<span class="badge" style="background:${m[0]};color:${m[1]};">${h.label}</span>`;
}
function pctBar(p){ p=Math.max(0,Math.min(100,Number(p)||0)); return `<div class="progress-bar" style="height:6px;"><div class="progress-fill" style="width:${p}%"></div></div>`; }
function okrProjectName(code){
  const pr=findProjectByCodeOrName(DB.projects, okrActiveYear(), code, '');
  if(pr) return pr.name;
  const sp=OKR_SEED.find(x=>x.code===code); return sp?sp.name:code;
}
function okrStars(avg){ return avg>=90?5:avg>=75?4:avg>=60?3:avg>=40?2:1; }
function personOkrSummary(personId, year, level){
  const items=okrItems(year).filter(i=>{ const ix=(i.ownerPersonIds||[]).indexOf(personId); return level==='primary'?ix===0 : level==='co'?ix>0 : ix>=0; });
  const krN=items.reduce((s,i)=>s+(i.krs||[]).length,0);
  if(!items.length) return {n:0,krN:0,avg:null,late:0,risk:0,done:0,stars:null,items};
  const avg=Math.round(items.reduce((s,i)=>s+itemProgress(i),0)/items.length);
  const hs=items.map(itemHealth);
  const exp=Math.round(items.reduce((s,i)=>s+itemExpected(i),0)/items.length);
  return {n:items.length,exp,krN,avg,late:hs.filter(h=>h.key==='late').length,risk:hs.filter(h=>h.key==='risk').length,done:hs.filter(h=>h.key==='done').length,stars:okrStars(avg),items};
}
function lastCheckinText(i){
  const c=(i.checkins||[]).slice(-1)[0]; return c ? fmtDateTH(c.date) : '-';
}

/* ---------- OKR: หน้าติดตาม ---------- */
function okrFilterState(){ return UI.okrFilter || (UI.okrFilter={owner:'',q:'',health:'',project:''}); }
function setOkrFilter(k,v){ okrFilterState()[k]=v; render(); }
function okrFiltered(){
  const f=okrFilterState();
  return okrItems().filter(i=>{
    if(f.project && i.projectCode!==f.project) return false;
    if(f.owner==='_none'){ if((i.ownerPersonIds||[]).length) return false; }
    else if(f.owner && !(i.ownerPersonIds||[]).includes(f.owner)) return false;
    if(f.q && !(Number(f.q)>=i.qStart && Number(f.q)<=i.qEnd)) return false;
    if(f.health && itemHealth(i).key!==f.health) return false;
    return true;
  });
}

function saveOkrObjective(code){

function buildOKRAOA(year){
  const items=okrItems(year); const maxK=Math.max(3,...items.map(i=>(i.krs||[]).length));
  const head=['รหัสโครงการ','โครงการ','ลำดับ','กิจกรรม','งบ (บาท)','แหล่งงบ','ผู้รับผิดชอบ','ไตรมาส'];
  for(let k=1;k<=maxK;k++){ head.push('KR '+k, 'KR '+k+' (%)'); }
  head.push('ความคืบหน้ารวม (%)','คาดหวัง ณ ปัจจุบัน (%)','สถานะ','หลักฐาน/วิธีวัดผล','เช็คอินล่าสุด','หมายเหตุเช็คอินล่าสุด');
  const aoa=[[`OKR รายกิจกรรม ปีงบประมาณ ${year}  (ส่งออก ${fmtDateTH(new Date().toISOString().slice(0,10))})`],[],head];
  items.forEach(i=>{
    const r=[i.projectCode, okrProjectName(i.projectCode), i.no, i.name, i.budget, i.source, (i.ownerPersonIds||[]).length?getPersonNames(i.ownerPersonIds):(i.ownerText||''), qLabel(i)];
    for(let k=0;k<maxK;k++){ const kr=(i.krs||[])[k]; r.push(kr?kr.text:'', kr?Number(kr.progress)||0:''); }
    const lc=(i.checkins||[]).slice(-1)[0];
    r.push(itemProgress(i), itemExpected(i), itemHealth(i).label, i.evidence||'', lc?lc.date:'', lc?lc.note:'');
    aoa.push(r);
  });
  const p2=[['OKR รายบุคคล (สำหรับประกอบการประเมินผลงาน)'],[],['บุคลากร','ตำแหน่ง','กิจกรรม','KR','ความคืบหน้าเฉลี่ย (%)','สำเร็จ','เสี่ยงล่าช้า','ล่าช้า','ดาวแนะนำ (1-5)']];
  DB.personnel.forEach(p=>{ const s=personOkrSummary(p.id,year); p2.push([p.name,p.position||'',s.n,s.krN,s.avg==null?'':s.avg,s.done,s.risk,s.late,s.stars||'']); });
  return {aoa, p2, widths:[12,40,7,44,11,10,26,12].concat(Array(maxK*2).fill(0).map((_,x)=>x%2?9:42)).concat([12,12,14,40,12,30])};
}
function exportOKRExcel(){
  if(typeof XLSX==='undefined'){ showToast('⚠️ โหลดไลบรารี Excel ไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ต'); return; }

/* ======================= Carbon Footprint ======================= */
function carbonCalc(pl){
  ensureCarbonData(); const e=DB.carbon.ef;
  const s1=(Number(pl.carDays)||0)*sdiv(e.carKm,e.carKmPerL)*e.diesel;
  const s2=((Number(pl.roomDays)||0)*e.roomKwh+(Number(pl.directKwh)||0))*e.elec;
  const s3=(Number(pl.attendDays)||0)*sdiv(sdiv(e.attendKm,e.attendKmPerL),e.paxPerCar)*e.petrol;
  return {s1,s2,s3,total:s1+s2+s3};
}
function carbonTarget(pl){ return carbonCalc(pl).total*(1-(Number(pl.reducePct)||0)); }
function carbonLogKg(l){
  const e=DB.carbon.ef, q=Number(l.qty)||0;
  switch(l.type){
    case 'car_days': return q*sdiv(e.carKm,e.carKmPerL)*e.diesel;
    case 'car_km': return sdiv(q,e.carKmPerL)*e.diesel;
    case 'diesel_l': return q*e.diesel;
    case 'room_days': return q*e.roomKwh*e.elec;
    case 'elec_kwh': return q*e.elec;
    case 'attend_pd': return q*sdiv(sdiv(e.attendKm,e.attendKmPerL),e.paxPerCar)*e.petrol;
    case 'petrol_l': return q*e.petrol;
    default: return q;
  }
}
function carbonLogScope(l){ const t=CARBON_LOG_TYPES.find(x=>x.id===l.type); return t?t.scope:'อื่นๆ'; }
function carbonLogsOfYear(year){
  ensureCarbonData(); const sy=(year||DB.currentYear)-543-1;
  const a=`${sy}-10-01`, b=`${sy+1}-09-30`;
  return DB.carbon.logs.filter(l=>l.date>=a && l.date<=b);
}
function fyMonthIdx(dateStr){ const m=Number(String(dateStr).slice(5,7)); return (m+2)%12; }
function carbonTotals(year){
  ensureCarbonData(); const plans=DB.carbon.plans;
  const t={est:0,target:0,s1:0,s2:0,s3:0,actual:0,done:0,doing:0};
  plans.forEach(pl=>{ const c=carbonCalc(pl); t.est+=c.total; t.s1+=c.s1; t.s2+=c.s2; t.s3+=c.s3; t.target+=carbonTarget(pl); if(pl.status==='done') t.done++; if(pl.status==='doing') t.doing++; });
  carbonLogsOfYear(year).forEach(l=>{ t.actual+=carbonLogKg(l); });
  return t;
}
const fmtKg=(n)=>(Number(n)||0).toLocaleString('th-TH',{maximumFractionDigits:1});

  ensureCarbonData(); const c=DB.carbon; const t=carbonTotals(c.year);

  const logs=carbonLogsOfYear(c.year);
  const planActual=id=>logs.filter(l=>l.planId===id).reduce((s,l)=>s+carbonLogKg(l),0);
  const high=c.plans.filter(p=>p.relevance==='สูง').length;
  return `

  <div class="grid grid-4" style="margin-bottom:14px;">
    ${kpiCard('🏭','ประมาณการทั้งแผน (tCO2e)',(t.est/1000).toFixed(2),`รถราชการ ${(t.s1/1000).toFixed(2)} · ไฟฟ้า ${(t.s2/1000).toFixed(2)} · เดินทาง ${(t.s3/1000).toFixed(2)}`)}
    ${kpiCard('🎯','เป้าหลังใช้มาตรการลด (tCO2e)',(t.target/1000).toFixed(2),`ลดได้ ${(red/1000).toFixed(2)} t (${redPct.toFixed(1)}%)`)}
    ${kpiCard('📒','บันทึกการปล่อยจริงสะสม (tCO2e)',(t.actual/1000).toFixed(2),`${usedPct.toFixed(0)}% ของเป้าทั้งปี · ${logs.length} รายการ`)}
    ${kpiCard('✅','มาตรการที่ดำเนินการแล้ว',`${t.done}/${c.plans.length}`,`กำลังทำ ${t.doing} · ความเกี่ยวข้องระดับสูง ${high} รายการ`)}
  </div>
  <div class="card card-pad" style="margin-bottom:14px;"><div class="card-title" style="margin-bottom:8px;">สะสมการปล่อยจริง เทียบเป้าหมายรายเดือน (kgCO2e)</div><div style="height:240px;"><canvas id="chartCarbonCum"></canvas></div></div>

function resetCarbonEF(){ if(!confirm('คืนค่า EF/ค่าสมมติทั้งหมดเป็นค่าตามไฟล์ V8 หรือไม่?')) return; CARBON_EF_KEYS.forEach((k,i)=>{ DB.carbon.ef[k]=Number(CARBON_SEED.ef[i].value); }); saveDB(); render(); }
function drawCarbonChart(){
  if(typeof Chart==='undefined') return;
  const el=document.getElementById('chartCarbonCum'); if(!el) return;
  ensureCarbonData(); const t=carbonTotals(DB.carbon.year);
  const monthly=Array(12).fill(0); carbonLogsOfYear(DB.carbon.year).forEach(l=>{ monthly[fyMonthIdx(l.date)]+=carbonLogKg(l); });
  const cq=currentFYQuarter(DB.carbon.year); const now=new Date(); const sy=DB.carbon.year-543-1;
  const curIdx=Math.max(0,Math.min(11,(now.getFullYear()*12+now.getMonth())-(sy*12+9)));
  let run=0; const actual=monthly.map((v,i)=>{ run+=v; return (cq===5||i<=curIdx)? Math.round(run*10)/10 : null; });
  const tgt=FY_MONTHS_TH.map((_,i)=>Math.round(t.target*(i+1)/12*10)/10);
  const base=FY_MONTHS_TH.map((_,i)=>Math.round(t.est*(i+1)/12*10)/10);
  chartRefs.push(new Chart(el,{type:'line', data:{labels:FY_MONTHS_TH, datasets:[
    {label:'บันทึกจริงสะสม', data:actual, borderColor:'#146C43', backgroundColor:'#146C4333', fill:true, tension:.25, spanGaps:false},
    {label:'เส้นเป้าหลังลด', data:tgt, borderColor:'#C89B3C', borderDash:[6,4], pointRadius:0},
    {label:'ประมาณการไม่ลด', data:base, borderColor:'#D64545', borderDash:[2,3], pointRadius:0}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true}}}}));
}
function exportCarbonExcel(){

  ensureCarbonData(); const c=DB.carbon; const logs=carbonLogsOfYear(c.year);

function cmpClamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function cmpMetrics(p){
  const budget=Number(p.budgetAmount)||0, disb=disbBySourceTotal(p), remain=budget-disb;
  const tasks=tasksOfProject(p.id), done=tasks.filter(t=>t.status==='done').length;
  const yearTotal=DB.projects.filter(x=>x.year===p.year).reduce((s,x)=>s+(Number(x.budgetAmount)||0),0);
  const s=p.startDate?new Date(p.startDate+'T00:00:00'):null, e=p.endDate?new Date(p.endDate+'T00:00:00'):null;
  const days=(s&&e&&e>=s)? Math.round((e-s)/864e5)+1 : null;
  const timePct=days? Math.round(cmpClamp((Date.now()-s.getTime())/(days*864e5)*100,0,100)) : null;
  const disbPct=budget>0? Math.round(disb/budget*100) : 0;
  const risks=(p.risks||[]).filter(r=>r.status!=='closed');
  const riskHigh=risks.filter(r=>riskScore(r)>=15).length;
  const okrs=(typeof okrItems==='function' && p.projectCode)? okrItems(p.year).filter(i=>i.projectCode===p.projectCode) : [];
  const okrAvg=okrs.length? Math.round(okrs.reduce((a,i)=>a+itemProgress(i),0)/okrs.length) : null;
  const okrKR=okrs.reduce((a,i)=>a+(i.krs||[]).length,0);
  let carbon=null;
  if(p.projectCode && DB.carbon && Array.isArray(DB.carbon.plans)){
    const pl=DB.carbon.plans.filter(x=>(x.projectCodes||[]).includes(p.projectCode));
    if(pl.length) carbon=pl.reduce((a,x)=>a+carbonCalc(x).total/Math.max(1,(x.projectCodes||[]).length),0);
  }
  return {p, budget, disb, remain, disbPct, share: yearTotal>0? budget/yearTotal*100 : 0,
    tasks:tasks.length, done, taskPct: tasks.length? Math.round(done/tasks.length*100) : null,
    days, timePct, gap: (timePct!=null && budget>0)? disbPct-timePct : null,
    perTask: tasks.length? budget/tasks.length : null, perDay: days? budget/days : null,
    risks:risks.length, riskHigh, okrAvg, okrKR, okrN:okrs.length, carbon,
    carbonPer1k: (carbon!=null && budget>0)? carbon/(budget/1000) : null};
}

function bigrams(t){ const m=new Map(); for(let i=0;i<t.length-1;i++){ const g=t.substr(i,2); m.set(g,(m.get(g)||0)+1); } return m; }
function diceSim(a,b){
  if(!a||!b) return 0; if(a===b) return 1;
  const A=bigrams(a), B=bigrams(b); let inter=0, na=0, nb=0;
  A.forEach(v=>na+=v); B.forEach(v=>nb+=v); A.forEach((v,k)=>{ if(B.has(k)) inter+=Math.min(v,B.get(k)); });
  return (na+nb)? 2*inter/(na+nb) : 0;
}
function projActNames(p){
  const set=new Set();
  DB.tasks.filter(x=>x.projectId===p.id).forEach(x=>{ const n=nameForMatch(String(x.name||'').replace(/^[\d.\s\-)]+/,'')); if(n.length>=3) set.add(n); });
  if(DB.okr&&DB.okr.items) DB.okr.items.filter(i=>p.projectCode&&i.projectCode===p.projectCode&&i.year===p.year).forEach(i=>{ const n=nameForMatch(i.name||''); if(n.length>=3) set.add(n); });

function actSimilarity(pa,pb){
  const A=projActNames(pa), B=projActNames(pb);
  if(!A.length||!B.length) return {s:0,n:0,has:false};
  const small=A.length<=B.length?A:B, big=A.length<=B.length?B:A; let sum=0, hit=0;
  small.forEach(x=>{ let best=0; big.forEach(y=>{ const d=diceSim(x,y); if(d>best) best=d; }); sum+=best; if(best>=0.5) hit++; });
  return {s:sum/small.length, n:hit, has:true};
}
function projSimilarity(pa,pb){
  const ns=diceSim(nameForMatch(pa.name),nameForMatch(pb.name));
  if(ns>=0.98) return {score:1, basis:'ชื่อเหมือนกัน'};
  const ca=projConcepts(pa), cb=projConcepts(pb); const u=new Set([...ca,...cb]); let inter=0; ca.forEach(x=>{ if(cb.has(x)) inter++; });
  const cj=u.size? inter/u.size : 0;
  const sameCat = pa.categoryId===pb.categoryId ? 1 : 0;
  const ac=actSimilarity(pa,pb);
  let score;
  if(ns>=0.9) score=ns;
  else if(ac.has) score=0.40*ns + 0.30*cj + 0.25*ac.s + 0.05*sameCat;
  else score=0.55*ns + 0.4*cj + 0.05*sameCat;
  score=Math.min(0.99,score);
  let basis;
  if(ns>=0.6) basis='ชื่อใกล้เคียง';
  else if(ac.has && ac.s>=0.45 && ac.n>=1) basis='กิจกรรมในโครงการคล้ายกัน ('+ac.n+' กิจกรรม)';
  else if(cj>=0.5) basis='ลักษณะโครงการใกล้เคียง';
  else basis='คล้ายบางส่วน';
  return {score, basis};
}
function yearMatch(ya,yb,thr){
  if(thr==null) thr=(UI.yvs&&UI.yvs.thr)||0.4;
  const A=DB.projects.filter(p=>p.year===ya), B=DB.projects.filter(p=>p.year===yb);
  const ov=yearPairsList();
  const idsA=new Set(A.map(p=>p.id)), idsB=new Set(B.map(p=>p.id));
  const noneA=new Set(), noneB=new Set(), forced=[];
  ov.forEach(o=>{ if(o.type==='none'){ if(o.a&&idsA.has(o.a)) noneA.add(o.a); if(o.b&&idsB.has(o.b)) noneB.add(o.b); } else if(o.type==='pair' && idsA.has(o.a) && idsB.has(o.b)) forced.push(o); });
  const usedA=new Set(), usedB=new Set(), match=new Map();
  forced.forEach(o=>{ const pa=A.find(x=>x.id===o.a), pb=B.find(x=>x.id===o.b); if(usedA.has(pa.id)||usedB.has(pb.id)) return; usedA.add(pa.id); usedB.add(pb.id);
    match.set(pb.id,{pa,pb,score:projSimilarity(pa,pb).score,basis:'กำหนดเองโดยผู้ใช้',locked:true}); });
  const pairs=[];
  A.forEach(pa=>{ if(usedA.has(pa.id)||noneA.has(pa.id)) return; B.forEach(pb=>{ if(usedB.has(pb.id)||noneB.has(pb.id)) return;
    let sim; if(pa.projectCode && pb.projectCode && pa.projectCode===pb.projectCode) sim={score:1,basis:'รหัสโครงการตรงกัน'}; else sim=projSimilarity(pa,pb);
    if(sim.score>=thr) pairs.push({pa,pb,score:sim.score,basis:sim.basis});
  }); });
  pairs.sort((x,y)=>y.score-x.score);
  pairs.forEach(c=>{ if(usedA.has(c.pa.id)||usedB.has(c.pb.id)) return; usedA.add(c.pa.id); usedB.add(c.pb.id); match.set(c.pb.id,c); });
  const rows=[];
  B.forEach(pb=>{ const c=match.get(pb.id); rows.push({a:c?c.pa:null,b:pb,sim:c?c.score:0,basis:c?c.basis:'',locked:!!(c&&c.locked),forcedNone:noneB.has(pb.id)}); });
  A.forEach(pa=>{ if(!usedA.has(pa.id)) rows.push({a:pa,b:null,sim:0,basis:'',locked:false,forcedNone:noneA.has(pa.id)}); });
  rows.forEach(r=>{ r.ba=r.a?(Number(r.a.budgetAmount)||0):0; r.bb=r.b?(Number(r.b.budgetAmount)||0):0; r.d=r.bb-r.ba; r.kind=!r.a?'new':!r.b?'removed':r.d>0?'up':r.d<0?'down':'same'; });

function projActivities(p){
  const acts=DB.tasks.filter(t=>t.projectId===p.id).map(t=>({name:String(t.name||'').replace(/^\s*[\d.]+\s*[.)]?\s*/,'').trim()||String(t.name||''), key:'', statusId:t.status, owner:t.assigneeId?getPersonName(t.assigneeId):'', budget:null, pct:null}));
  if(p.projectCode && DB.okr && DB.okr.items){
    DB.okr.items.filter(i=>i.projectCode===p.projectCode && i.year===p.year).forEach(i=>{
      const k=nameForMatch(i.name||''); let hit=null, best=0;
      acts.forEach(a=>{ const d=diceSim(nameForMatch(a.name),k); if(d>best){best=d;hit=a;} });
      const owner=(i.ownerPersonIds&&i.ownerPersonIds.length)?getPersonNames(i.ownerPersonIds):(i.ownerText||'');
      if(hit && best>=0.6){ hit.budget=Number(i.budget)||0; hit.pct=itemProgress(i); if(!hit.owner) hit.owner=owner; }
      else acts.push({name:i.name||'', statusId:null, owner, budget:Number(i.budget)||0, pct:itemProgress(i)});
    });
  }
  acts.forEach(a=>{ a.key=nameForMatch(a.name); a.cn=new Set(PROJ_CONCEPTS.filter(c=>c[1].test(a.name)).map(c=>c[0])); });
  return acts;
}
function actPairSim(x,y){
  const d=diceSim(x.key,y.key); let inter=0; x.cn.forEach(c=>{ if(y.cn.has(c)) inter++; });
  const u=new Set([...x.cn,...y.cn]).size; const cj=u?inter/u:0;
  return d>=0.9? d : 0.7*d+0.3*cj;
}
function activityMatch(pa,pb,thr){
  thr=thr||0.35; const A=projActivities(pa), B=projActivities(pb); const pairs=[];
  A.forEach((x,i)=>B.forEach((y,j)=>{ const sc=actPairSim(x,y); if(sc>=thr) pairs.push({i,j,sc}); }));
  pairs.sort((u,v)=>v.sc-u.sc); const ua=new Set(), ub=new Set(), mp=new Map();
  pairs.forEach(c=>{ if(ua.has(c.i)||ub.has(c.j)) return; ua.add(c.i); ub.add(c.j); mp.set(c.j,c); });
  const rows=[]; B.forEach((y,j)=>{ const c=mp.get(j); rows.push({a:c?A[c.i]:null,b:y,sc:c?c.sc:0}); });
  A.forEach((x,i)=>{ if(!ua.has(i)) rows.push({a:x,b:null,sc:0}); });
  return {rows, na:A.length, nb:B.length, matched:mp.size};
}

/* ---------- พยากรณ์เบิกจ่าย ---------- */
function fcWindow(p,y){
  const fs=new Date(y-543-1,9,1), fe=new Date(y-543,8,30);
  let ps=parseISODate(p.startDate)||fs, pe=parseISODate(p.endDate)||fe;
  if(ps<fs) ps=fs; if(pe>fe) pe=fe; if(pe<=ps){ ps=fs; pe=fe; }
  return {ps,pe,fs,fe};
}
const FC_RISK = {high:['#FDE4E4','#B02A2A','เสี่ยงเหลือคืน/เลยกำหนด',0], mid:['#FFF3D6','#9C6B0B','เบิกช้ากว่าแผน',1], early:['#EEF1EF','#5C6B63','ยังเร็วเกินไปที่จะประเมิน',2], ok:['#E1F5E9','#0F7A45','เป็นไปตามแผน',3], done:['#E3F1FB','#1D5F94','เสร็จ/เบิกครบ',4]};
function forecastRows(year){
  year=year||DB.currentYear; const today=new Date(); today.setHours(0,0,0,0);
  return DB.projects.filter(p=>p.year===year && (Number(p.budgetAmount)||0)>0 && p.status!=='cancelled').map(p=>{
    const w=fcWindow(p,year); const budget=Number(p.budgetAmount)||0; const disb=disbBySourceTotal(p); const actual=disb/budget;
    const planned = today<=w.ps?0 : today>=w.pe?1 : (today-w.ps)/(w.pe-w.ps);
    const remain=Math.max(0,budget-disb); const monthsLeft=Math.max(0.5,(w.pe-today)/(30.4*864e5));
    let proj=null, risk='ok', note='';
    if(p.status==='done'||disb>=budget){ proj=Math.min(1,actual); risk='done'; }
    else if(today>w.pe){ proj=actual; risk=remain>0?'high':'ok'; note='พ้นกำหนดสิ้นสุดโครงการแล้ว ยังเหลืองบ'; }
    else if(planned<0.15){ risk='early'; }
    else { proj=Math.min(1,actual/planned); risk=proj>=0.8?'ok':proj>=0.5?'mid':'high'; }
    return {p,budget,disb,actual,planned,remain,monthsLeft,needPerMonth:remain/monthsLeft,proj,risk,note,w};
  });
}
function recordDisbSnapshot(){
  try{
    const y=DB.currentYear; if(!Array.isArray(DB.disbHistory)) DB.disbHistory=[];
    const day=new Date().toISOString().slice(0,10); const by={}; let tot=0;
    DB.projects.filter(p=>p.year===y).forEach(p=>{ const t=disbBySourceTotal(p); by[p.id]=t; tot+=t; });
    const ex=DB.disbHistory.find(h=>h.date===day&&h.year===y);
    if(ex){ ex.total=tot; ex.by=by; } else DB.disbHistory.push({date:day,year:y,total:tot,by});
    if(DB.disbHistory.length>400) DB.disbHistory.splice(0,DB.disbHistory.length-400);
  }catch(e){}
}

function alertsBuild(){
  const out=[]; const yr=DB.currentYear; const today=new Date(); today.setHours(0,0,0,0);
  const projs=yearProjects();
  DB.tasks.forEach(t=>{
    const p=projs.find(x=>x.id===t.projectId); if(!p||t.status==='done'||t.status==='cancelled') return;
    const d=parseISODate(t.dueDate); if(!d) return; const diff=Math.round((d-today)/864e5);
    if(diff<0) out.push({kind:'งานเลยกำหนด',sev:3,text:t.name,sub:`${shortProjName(p)} · เลยมา ${-diff} วัน`,go:`openProjectDetail('${p.id}')`});
    else if(diff<=7) out.push({kind:'งานใกล้ครบกำหนด (ภายใน 7 วัน)',sev:2,text:t.name,sub:`${shortProjName(p)} · อีก ${diff} วัน`,go:`openProjectDetail('${p.id}')`});
  });
  projs.forEach(p=>{
    const e=parseISODate(p.endDate);
    if(p.status==='delayed') out.push({kind:'โครงการสถานะล่าช้า',sev:3,text:shortProjName(p),sub:p.projectCode||'',go:`openProjectDetail('${p.id}')`});
    else if(e && e<today && !['done','cancelled'].includes(p.status)) out.push({kind:'โครงการพ้นวันสิ้นสุดแต่ยังไม่เสร็จ',sev:3,text:shortProjName(p),sub:`สิ้นสุด ${fmtDateTH(p.endDate)}`,go:`openProjectDetail('${p.id}')`});
  });
  try{
    const oy=okrActiveYear(); const q=currentFYQuarter(oy);
    const items=(DB.okr&&DB.okr.items||[]).filter(i=>i.year===oy);
    if(q>=1&&q<=4){
      const start=new Date(oy-543-1,9+(q-1)*3,1); const sev=(today-start)/864e5>=30?2:1;
      items.filter(i=>i.qStart<=q&&q<=i.qEnd&&!(i.checkins||[]).some(c=>c.quarter===q)).forEach(i=>
        out.push({kind:`OKR ยังไม่ check-in ไตรมาส ${q}`,sev,text:i.name,sub:i.projectCode+' · '+(itemProgress(i))+'%',go:`gotoRoute('okr')`}));
      if((today-start)/864e5>=45) items.forEach(i=>{ const h=itemHealth(i); if(h.key==='late') out.push({kind:'OKR ล่าช้ากว่าแผน',sev:3,text:i.name,sub:`ทำได้ ${itemProgress(i)}% · คาดหวัง ${itemExpected(i)}%`,go:`gotoRoute('okr')`}); else if(h.key==='risk') out.push({kind:'OKR เสี่ยงล่าช้า',sev:2,text:i.name,sub:`ทำได้ ${itemProgress(i)}% · คาดหวัง ${itemExpected(i)}%`,go:`gotoRoute('okr')`}); });
    }
  }catch(e){}
  try{ forecastRows(yr).forEach(r=>{ if(r.risk==='high') out.push({kind:'เบิกจ่ายเสี่ยงเหลือคืน/เลยกำหนด',sev:3,text:shortProjName(r.p),sub:`เบิกแล้ว ${Math.round(r.actual*100)}% · คงเหลือ ${money(r.remain)} บาท`,go:`gotoRoute('forecast')`}); else if(r.risk==='mid') out.push({kind:'เบิกจ่ายช้ากว่าแผน',sev:2,text:shortProjName(r.p),sub:`เบิกแล้ว ${Math.round(r.actual*100)}% · แผน ${Math.round(r.planned*100)}%`,go:`gotoRoute('forecast')`}); }); }catch(e){}
  try{
    if(DB.carbon && DB.carbon.year){ const q=currentFYQuarter(DB.carbon.year); const now=new Date(); const ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
      if(q>=1&&q<=4 && now.getDate()>=5 && !(DB.carbon.logs||[]).some(l=>String(l.date).slice(0,7)===ym)) out.push({kind:'Carbon ยังไม่ได้บันทึกเดือนนี้',sev:1,text:'ยังไม่มีบันทึกการปล่อยคาร์บอนของเดือนนี้',sub:'',go:`gotoRoute('carbonlog')`}); }
  }catch(e){}

/* ---------- นำเข้าจาก Excel แบบดูส่วนต่างก่อน ---------- */
const XL_SRC_MAP = {'เงินบำรุง':'เงินบำรุง','กองทุนฯ':'งบกองทุนส่งเสริมภูมิปัญญา'};
function xlCell(v){ return v==null?'':String(v).replace(/\s+/g,' ').trim(); }
function xlParse(wb){
  const out={projects:[],acts:[],warn:[]};
  const rowsOf=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}):null;
  const okrRows=rowsOf('OKR รายกิจกรรม'); const projBudget={};
  if(okrRows){
    const hi=okrRows.findIndex(r=>r.some(c=>/รหัสโครงการ/.test(xlCell(c))) && r.some(c=>/งบประมาณ/.test(xlCell(c))));
    if(hi<0) out.warn.push('ไม่พบหัวตารางในชีต "OKR รายกิจกรรม"');
    else{
      const h=okrRows[hi].map(c=>xlCell(c)); const col=re=>h.findIndex(x=>re.test(x));
      const c={no:col(/^ลำดับ/),code:col(/^รหัสโครงการ/),name:col(/โครงการ\s*\/\s*กิจกรรม/),bud:col(/^งบประมาณ/),src:col(/^แหล่งงบ/),k1:col(/^KR\s*1/),k2:col(/^KR\s*2/),k3:col(/^KR\s*3/),ev:col(/^หลักฐาน/),q:col(/^ไตรมาส/),ow:col(/^ผู้รับผิดชอบ/)};
      let cur=null;
      okrRows.slice(hi+1).forEach(r=>{
        const code=xlCell(r[c.code]), name=xlCell(r[c.name]); if(!name) return;
        if(/^\d{8}$/.test(code)){ cur={code,name,budget:Number(r[c.bud])||0}; projBudget[code]=cur.budget; return; }
        const no=xlCell(r[c.no]); if(!cur||!/^\d+$/.test(no)) return;
        const kr=[r[c.k1],r[c.k2],r[c.k3]].map(xlCell).filter(x=>x&&x!=='–'&&x!=='-');
        out.acts.push({code:cur.code,no,name,budget:Number(r[c.bud])||0,src:xlCell(r[c.src]),kr,evidence:xlCell(r[c.ev]),quarter:xlCell(r[c.q]),owner:xlCell(r[c.ow])});
      });
    }
  } else out.warn.push('ไม่พบชีต "OKR รายกิจกรรม"');
  const reg=rowsOf('ทะเบียนรหัสโครงการ');
  if(reg){
    const hi=reg.findIndex(r=>r.some(c=>/ชื่อโครงการ/.test(xlCell(c))) && r.some(c=>/รหัสโครงการ/.test(xlCell(c))));
    if(hi<0) out.warn.push('ไม่พบหัวตารางในชีต "ทะเบียนรหัสโครงการ"');
    else{
      const h=reg[hi].map(c=>xlCell(c).replace(/\s+/g,'')); const col=re=>h.findIndex(x=>re.test(x));
      const c={name:col(/^ชื่อโครงการ/),code:col(/^รหัสโครงการ/),src:h.findIndex(x=>x==='แหล่งงบประมาณ'),q:col(/ไตรมาส/),type:col(/^ประเภท/)};
      reg.slice(hi+1).forEach(r=>{ const code=xlCell(r[c.code]); if(!/^\d{8}$/.test(code)) return;
        out.projects.push({code,name:xlCell(r[c.name]),source:xlCell(r[c.src]),quarter:xlCell(r[c.q]),type:xlCell(r[c.type]),budget:projBudget[code]}); });
    }
  } else out.warn.push('ไม่พบชีต "ทะเบียนรหัสโครงการ"');
  return out;
}
function xlDiff(parsed){
  const diffs=[]; let n=0;
  parsed.projects.forEach(r=>{
    const year=2500+Number(r.code.slice(0,2));
    let p=DB.projects.find(x=>x.projectCode===r.code);
    if(!p){ const nm=nameForMatch(r.name); p=DB.projects.find(x=>x.year===year && !x.projectCode && nameForMatch(x.name)===nm);
      if(p){ diffs.push({id:'d'+(n++),type:'setcode',label:'เติมรหัสโครงการ',code:r.code,title:r.name,pid:p.id,changes:[{f:'projectCode',t:'รหัสโครงการ',old:'(ว่าง)',nu:r.code}]}); return; } }
    if(!p){ diffs.push({id:'d'+(n++),type:'newproj',label:'โครงการใหม่',code:r.code,title:r.name,year,data:r,changes:[{t:'เพิ่มโครงการ',old:'-',nu:`งบ ${money(r.budget||0)} · ${r.source||'-'} · ${r.quarter||''}`}]}); return; }
    const ch=[];
    if(normProjName(p.name)!==normProjName(r.name)) ch.push({f:'name',t:'ชื่อโครงการ',old:normProjName(p.name),nu:r.name});
    if(r.budget!=null && Number(p.budgetAmount)!==Number(r.budget)){
      if(isMixedBudget(p)) ch.push({f:'budgetAmount',t:'งบรวม (โครงการงบผสม — ปรับด้วยมือ)',old:money(p.budgetAmount),nu:money(r.budget),manual:true});
      else ch.push({f:'budgetAmount',t:'งบประมาณ',old:money(p.budgetAmount),nu:money(r.budget),raw:r.budget});
    }
    const ms=XL_SRC_MAP[r.source];
    if(ms && DB.budgetSources.includes(ms) && !isMixedBudget(p) && p.budgetSource!==ms && !(r.source==='' )) ch.push({f:'budgetSource',t:'แหล่งงบ',old:p.budgetSource||'-',nu:ms});
    if(ch.length) diffs.push({id:'d'+(n++),type:'chgproj',label:'แก้ไขโครงการ',code:r.code,title:normProjName(p.name),pid:p.id,changes:ch});
  });
  parsed.acts.forEach(a=>{
    const year=2500+Number(a.code.slice(0,2));
    const it=(DB.okr&&DB.okr.items||[]).find(i=>i.projectCode===a.code && String(i.no)===String(a.no) && i.year===year);
    if(!it){ diffs.push({id:'d'+(n++),type:'newokr',label:'กิจกรรม OKR ใหม่',code:a.code,title:a.name,year,data:a,changes:[{t:'เพิ่มกิจกรรม',old:'-',nu:`งบ ${money(a.budget)} · ${a.quarter} · KR ${a.kr.length} ข้อ`}]}); return; }
    const ch=[]; const [qs,qe]=parseQuarters(a.quarter);
    if(nameForMatch(it.name)!==nameForMatch(a.name)) ch.push({f:'name',t:'ชื่อกิจกรรม',old:it.name,nu:a.name});
    if(Number(it.budget)!==Number(a.budget)) ch.push({f:'budget',t:'งบ',old:money(it.budget),nu:money(a.budget),raw:a.budget});
    if(['เงินบำรุง','กองทุนฯ','ไม่ใช้งบ'].includes(a.src) && it.source!==a.src) ch.push({f:'source',t:'แหล่งงบ',old:it.source||'-',nu:a.src});
    if(it.qStart!==qs||it.qEnd!==qe) ch.push({f:'quarter',t:'ไตรมาส',old:qLabel(it),nu:a.quarter,raw:[qs,qe]});
    const oldKr=(it.krs||[]).map(k=>k.text);
    if(a.kr.some((t,i)=>oldKr[i]!==t) ) ch.push({f:'kr',t:'ข้อความ KR',old:oldKr.join(' | ').slice(0,160),nu:a.kr.join(' | ').slice(0,160),raw:a.kr});
    if(a.evidence && a.evidence!==it.evidence) ch.push({f:'evidence',t:'หลักฐาน/วิธีวัด',old:(it.evidence||'-').slice(0,80),nu:a.evidence.slice(0,80)});
    if(ch.length) diffs.push({id:'d'+(n++),type:'chgokr',label:'แก้ไขกิจกรรม OKR',code:a.code,title:a.name,iid:it.id,changes:ch});
  });
  return diffs;
}
function xlLoadFile(inp){
  if(viewerBlock()) return;
  if(typeof XLSX==='undefined'){ showToast('⚠️ ไม่พบไลบรารี Excel (ต้องต่ออินเทอร์เน็ตครั้งแรกเพื่อโหลด)'); return; }
  const f=inp.files&&inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'}); const parsed=xlParse(wb);
    window.__xl={name:f.name,warn:parsed.warn,diffs:xlDiff(parsed),np:parsed.projects.length,na:parsed.acts.length,sel:new Set()};
    window.__xl.diffs.filter(d=>d.type==='newproj'||d.type==='newokr'||d.type==='setcode').forEach(d=>window.__xl.sel.add(d.id));
    render();
  }catch(e){ showToast('อ่านไฟล์ Excel ไม่สำเร็จ: '+e.message); } };
  rd.readAsArrayBuffer(f);
}
function xlToggle(id,on){ const s=window.__xl.sel; if(on) s.add(id); else s.delete(id); const el=document.getElementById('xlCount'); if(el) el.textContent=s.size; }
function xlSelAll(on){ const x=window.__xl; if(!x) return; x.sel.clear(); if(on) x.diffs.forEach(d=>{ if(!d.changes.every(c=>c.manual)) x.sel.add(d.id); }); render(); }
function viewXlImport(){

    <label class="btn btn-primary" style="cursor:pointer;">📂 เลือกไฟล์ Excel (.xlsx)<input type="file" accept=".xlsx,.xls" style="display:none" onchange="xlLoadFile(this)"></label>
    ${x?`<span class="small-muted" style="margin-left:10px;">${escapeHtml(x.name)} · พบ ${x.np} โครงการ · ${x.na} กิจกรรม</span>`:''}</div>`;
  if(!x) return head;
  const tc={newproj:['#E1F5E9','#0F7A45'],newokr:['#E1F5E9','#0F7A45'],setcode:['#E3F1FB','#1D5F94'],chgproj:['#FFF3D6','#9C6B0B'],chgokr:['#FFF3D6','#9C6B0B']};

  <div class="card" style="margin-top:12px;"><div class="card-head"><div class="card-title">ผลเทียบ: ${x.diffs.length} รายการที่แตกต่าง <span class="small-muted">(เลือกแล้ว <span id="xlCount">${x.sel.size}</span>)</span></div>

    <div class="tbl-wrap card-pad"><table><thead><tr><th></th><th>ประเภท</th><th>รหัส</th><th>รายการ</th><th>สิ่งที่เปลี่ยน (เดิม → ใหม่)</th></tr></thead><tbody>
    ${x.diffs.map(d=>{ const allManual=d.changes.every(c=>c.manual); const c=tc[d.type]; return `<tr><td><input type="checkbox" ${x.sel.has(d.id)?'checked':''} ${allManual?'disabled':''} onchange="xlToggle('${d.id}',this.checked)"></td>

function xlApply(){
  if(viewerBlock()) return; const x=window.__xl; if(!x) return;
  const picks=x.diffs.filter(d=>x.sel.has(d.id)); if(!picks.length){ showToast('ยังไม่ได้เลือกรายการ'); return; }
  if(!confirm('นำเข้า '+picks.length+' รายการที่เลือก? (แนะนำให้สำรองข้อมูล JSON ก่อน)')) return;
  let np=0, cp=0, no=0, co=0;
  picks.forEach(d=>{
    if(d.type==='setcode'){ const p=getProject(d.pid); if(p){ p.projectCode=d.code; cp++; } }
    else if(d.type==='chgproj'){ const p=getProject(d.pid); if(!p) return; d.changes.forEach(c=>{ if(c.manual) return; if(c.f==='budgetAmount') p.budgetAmount=Number(c.raw); else p[c.f]=c.nu; }); cp++; }
    else if(d.type==='newproj'){
      const r=d.data; if(!DB.fiscalYears.includes(d.year)) DB.fiscalYears.push(d.year);
      const cat=/ภาระงาน|ประจำ/.test(r.type)? (DB.categories[1]||DB.categories[0]) : DB.categories[0];
      const maxSort=Math.max(0,...DB.projects.filter(p=>p.year===d.year).map(p=>p.sortOrder||0));
      const ms=XL_SRC_MAP[r.source]; 
      DB.projects.push({id:uid('proj'),year:d.year,projectCode:r.code,name:r.name,categoryId:cat?cat.id:'',ownerPersonIds:[],ownerPersonId:'',priority:'mid',status:'notstarted',startDate:'',endDate:'',budgetAmount:Number(r.budget)||0,budgetType:'งบดำเนินงาน',budgetSource:(ms&&DB.budgetSources.includes(ms))?ms:(DB.budgetSources[0]||''),target:'',indicator:'',description:'นำเข้าจากไฟล์ Excel '+x.name+' (ไตรมาส: '+(r.quarter||'-')+') โปรดตรวจสอบและกรอกผู้รับผิดชอบ/วันที่/รายละเอียด',attachments:[],disbRequestDate:'',disbCompleteDate:'',disbAmount:0,disbNote:'',sortOrder:maxSort+1,createdAt:new Date().toISOString()});
      np++; }
    else if(d.type==='chgokr'){ const it=DB.okr.items.find(i=>i.id===d.iid); if(!it) return;
      d.changes.forEach(c=>{
        if(c.f==='budget') it.budget=Number(c.raw); else if(c.f==='quarter'){ it.qStart=c.raw[0]; it.qEnd=c.raw[1]; }
        else if(c.f==='kr'){ it.krs=it.krs||[]; c.raw.forEach((t,i)=>{ if(it.krs[i]) it.krs[i].text=t; else it.krs.push({id:uid('kr'),text:t,progress:0}); }); }
        else it[c.f]=c.nu; });
      co++; }
    else if(d.type==='newokr'){ const a=d.data; const [qs,qe]=parseQuarters(a.quarter);
      DB.okr.items.push({id:uid('okri'),year:d.year,projectCode:a.code,no:a.no,name:a.name,budget:Number(a.budget)||0,source:['เงินบำรุง','กองทุนฯ','ไม่ใช้งบ'].includes(a.src)?a.src:'',qStart:qs,qEnd:qe,ownerPersonIds:matchOwnerIds(a.owner),ownerText:a.owner||'',evidence:a.evidence||'',krs:a.kr.map(t=>({id:uid('kr'),text:t,progress:0})),checkins:[]});
      DB.okr.seeded.push(a.code+'|'+a.no); no++; }
  });
  logAction('นำเข้าจาก Excel (เลือกจากส่วนต่าง)',`${x.name}: โครงการใหม่ ${np} · แก้โครงการ ${cp} · OKR ใหม่ ${no} · แก้ OKR ${co}`);
  saveDB(); window.__xl=null; render(); showToast(`✅ นำเข้าแล้ว: โครงการใหม่ ${np} · แก้ไขโครงการ ${cp} · OKR ใหม่ ${no} · แก้ OKR ${co}`);
}

  destroyCharts();

const CHART_GREEN_PALETTE=['#146C43','#2D6FA5','#C89B3C','#7C4FA0','#D64545','#22A05F','#4FC087','#8A9A92','#3B7BB0','#9C6B0B'];

function drawDashboardCharts(){
  const projs=yearProjects();
  const statusCounts=STATUS_LIST.map(s=>projs.filter(p=>p.status===s.id).length);
  const elS=document.getElementById('chartStatus');
  if(elS) chartRefs.push(new Chart(elS,{type:'doughnut', data:{labels:STATUS_LIST.map(s=>s.label), datasets:[{data:statusCounts, backgroundColor:STATUS_LIST.map(s=>s.color), borderWidth:0}]}, options:{plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}}, cutout:'62%'}}));

  const bySource={};

  Object.keys(bySource).forEach(k=>{ if(!(bySource[k]>0)) delete bySource[k]; });
  const elB=document.getElementById('chartBudgetSource');
  if(elB) chartRefs.push(new Chart(elB,{type:'bar', data:{labels:Object.keys(bySource), datasets:[{data:Object.values(bySource), backgroundColor:CHART_GREEN_PALETTE}]}, options:{plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:10}}},y:{beginAtZero:true}}}}));

  const wLabels=DB.personnel.map(p=>p.name.replace(/^(นางสาว|นาง|นาย)/,''));

  const wCo=DB.personnel.map(p=>personRoleTasks(p.id,DB.currentYear).co.length);
  const elW=document.getElementById('chartWorkload');
  if(elW) chartRefs.push(new Chart(elW,{type:'bar', data:{labels:wLabels, datasets:[{label:'งานย่อย รับผิดชอบหลัก', data:wPrim, backgroundColor:'#146C43'},{label:'งานย่อย รับผิดชอบร่วม', data:wCo, backgroundColor:'#7DB8E8'}]}, options:{indexAxis:'y', plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}}, scales:{x:{stacked:true,beginAtZero:true, ticks:{stepSize:1}},y:{stacked:true}}}}));

function drawPerfChart(){
  const el=document.getElementById('chartPerf'); if(!el) return;
  const labels=DB.personnel.map(p=>p.name);

function lockHash(str){
  let h1=0xdeadbeef^7, h2=0x41c6ce57^7; str='tm70|'+String(str);
  for(let i=0,ch;i<str.length;i++){ ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
function lockCurrentHash(){ return (DB && DB.security && DB.security.pwHash) || LOCK_DEFAULT_HASH; }
function isUnlocked(){ try{ return sessionStorage.getItem('thaimed_unlocked')==='1'; }catch(e){ return !!window.__unlockedMem; } }
function setUnlocked(v){ window.__unlockedMem=v; if(!v) setViewer(false); try{ if(v) sessionStorage.setItem('thaimed_unlocked','1'); else sessionStorage.removeItem('thaimed_unlocked'); }catch(e){} }
function showLockScreen(){
  if(document.getElementById('lockScreen')) return;
  const app=document.getElementById('app'); if(app) app.style.display='none';
  const d=document.createElement('div'); d.id='lockScreen';
  d.style.cssText='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0F3D2A,#146C43);font-family:inherit;padding:16px;';
  d.innerHTML=`<div style="background:#fff;border-radius:18px;padding:30px 28px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);">
    <div style="font-size:42px;">🔒</div>
    <div style="font-weight:700;font-size:16px;margin:6px 0 2px;color:#0F3D2A;">ระบบบริหารแผนงานโครงการและบุคลากร</div>
    <div style="font-size:12px;color:#6B7D73;margin-bottom:16px;">กลุ่มงานการแพทย์แผนไทยและการแพทย์ทางเลือก สสจ.สมุทรปราการ</div>
    <input id="lockInput" type="password" inputmode="numeric" autocomplete="off" placeholder="กรอกรหัสผ่าน" style="width:100%;box-sizing:border-box;padding:12px 14px;font-size:18px;text-align:center;letter-spacing:6px;border:1.5px solid #CFE3D8;border-radius:10px;outline:none;">
    <div id="lockMsg" style="min-height:20px;font-size:12.5px;color:#B02A2A;margin:8px 0;"></div>
    <button id="lockBtn" style="width:100%;padding:12px;border:0;border-radius:10px;background:#146C43;color:#fff;font-size:14px;font-weight:700;cursor:pointer;">เข้าสู่ระบบ</button>
  </div>`;
  document.body.appendChild(d);
  const inp=d.querySelector('#lockInput'), msg=d.querySelector('#lockMsg');
  let fails=0, until=0;
  const tryUnlock=()=>{
    const now=Date.now(); if(now<until){ msg.textContent=`ลองใหม่อีก ${Math.ceil((until-now)/1000)} วินาที`; return; }
    const hv=lockHash(inp.value);
    if(hv===lockCurrentHash()){ setViewer(false); setUnlocked(true); d.remove(); if(app) app.style.display=''; render(); }
    else if(DB.security && DB.security.viewerHash && hv===DB.security.viewerHash){ setUnlocked(true); setViewer(true); d.remove(); if(app) app.style.display=''; render(); }
    else{ fails++; inp.value=''; msg.textContent='รหัสผ่านไม่ถูกต้อง'; if(fails>=5){ until=Date.now()+15000; fails=0; msg.textContent='ใส่ผิดหลายครั้ง กรุณารอ 15 วินาที'; } inp.focus(); }
  };
  d.querySelector('#lockBtn').addEventListener('click', tryUnlock);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  setTimeout(()=>inp.focus(),50);
}
function lockNow(){ setUnlocked(false); showLockScreen(); }
function openChangePasswordForm(){
  openModal('เปลี่ยนรหัสผ่าน', `
    <div class="form-row"><label>รหัสผ่านปัจจุบัน</label><input class="input" type="password" id="pw_old" autocomplete="off"></div>
    <div class="form-row"><label>รหัสผ่านใหม่ (อย่างน้อย 4 ตัว)</label><input class="input" type="password" id="pw_new" autocomplete="off"></div>
    <div class="form-row"><label>ยืนยันรหัสผ่านใหม่</label><input class="input" type="password" id="pw_new2" autocomplete="off"></div>
    <div class="small-muted">หากลืมรหัสที่เปลี่ยนไว้ ให้ล้างข้อมูลเบราว์เซอร์ (จะกลับเป็น 8888 แต่ข้อมูลหาย) จึงควรส่งออกสำรองไว้เสมอ</div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="saveNewPassword()">💾 บันทึก</button>`);
}
function saveNewPassword(){
  if(viewerBlock()) return;
  const o=document.getElementById('pw_old').value, n=document.getElementById('pw_new').value, n2=document.getElementById('pw_new2').value;
  if(lockHash(o)!==lockCurrentHash()){ showToast('รหัสผ่านปัจจุบันไม่ถูกต้อง'); return; }
  if(n.length<4){ showToast('รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัว'); return; }
  if(n!==n2){ showToast('ยืนยันรหัสผ่านไม่ตรงกัน'); return; }
  DB.security=Object.assign({},DB.security||{},{pwHash:lockHash(n)}); logAction('เปลี่ยนรหัสผ่าน',''); saveDB(); closeModal(); showToast('เปลี่ยนรหัสผ่านเรียบร้อย');
}

loadDB();
if(!isUnlocked()) showLockScreen();
render();
if(window.__versionMismatch){
  const noteLines = [];
  if(window.__autoImportedCount>0) noteLines.push(`นำเข้าโครงการที่ขาดหายไปให้อัตโนมัติแล้ว ${window.__autoImportedCount} โครงการ (เช่น โครงการปีงบประมาณใหม่ที่เพิ่มเข้ามาในไฟล์นี้)`);
  if(window.__autoRevisedCount>0) noteLines.push(`ปรับปรุงเนื้อหาโครงการเดิมให้ตรงกับไฟล์ฉบับล่าสุดแล้ว ${window.__autoRevisedCount} โครงการ`);
  if(window.__autoSourceFixedCount>0) noteLines.push(`ปรับแหล่งงบปี 2570 ให้เหลือ 2 แหล่ง (เงินบำรุง/กองทุนฯ) ตามไฟล์ล่าสุด ${window.__autoSourceFixedCount} โครงการ`);
  if(window.__autoCoOwnerCount>0) noteLines.push(`เติมผู้รับผิดชอบร่วมให้ ${window.__autoCoOwnerCount} โครงการ (ผู้รับผิดชอบหลักไม่เปลี่ยน)`);
  if(window.__autoOKRCount>0) noteLines.push(`เพิ่มเมนู OKR และนำเข้า OKR รายกิจกรรมปี 2570 ให้แล้ว ${window.__autoOKRCount} กิจกรรม`);
  if(window.__autoCarbonCount>0) noteLines.push('เพิ่มเมนู Carbon Footprint พร้อมแผนประมาณการจากไฟล์ V8');
  if(window.__autoCodeFilledCount>0) noteLines.push(`เติมรหัสโครงการ (8 หลัก) ให้โครงการเดิมที่ยังไม่มีรหัสแล้ว ${window.__autoCodeFilledCount} โครงการ`);
  const importedNote = noteLines.length
    ? `<p class="small-muted">✅ ระบบตรวจพบและ${noteLines.join(' และ')} — ข้อมูลเดิมที่พี่จีเคยแก้ไขไว้ยังอยู่ครบ ไม่จำเป็นต้องล้างข้อมูลก็ได้</p>`
    : '';
  setTimeout(()=>{
    openModal('พบข้อมูลเก่าเวอร์ชันอื่นในเบราว์เซอร์นี้', `
      <p>ข้อมูลที่บันทึกไว้ในเบราว์เซอร์นี้เป็นเวอร์ชัน <b>${escapeHtml(window.__storedVersion||'-')}</b> แต่ไฟล์ที่เปิดอยู่ตอนนี้เป็นเวอร์ชัน <b>${APP_VERSION}</b></p>
      ${importedNote}
      <p class="small-muted">ถ้าเพิ่งได้ไฟล์ใหม่มา (มีโครงการ/ฟีเจอร์เพิ่มเติม) แนะนำให้ล้างข้อมูลเพื่อโหลดชุดล่าสุด แต่ถ้าพี่จีเคยแก้ไขข้อมูลไว้ในเบราว์เซอร์นี้แล้ว การล้างจะทำให้ข้อมูลที่แก้ไขหายไป — แนะนำกด "ส่งออกสำรอง" ก่อนทุกครั้ง</p>
    `, `
      <button class="btn btn-ghost" onclick="closeModal()">ใช้ข้อมูลเดิมต่อไป</button>
      <button class="btn btn-ghost" onclick="exportJSON()">⬇️ ส่งออกสำรองก่อน</button>
      <button class="btn btn-primary" onclick="resetAllData();closeModal();">♻️ ล้างข้อมูล &amp; โหลดชุดใหม่</button>
    `);
  }, 400);
} else if(window.__autoImportedCount>0 || window.__autoRevisedCount>0 || window.__autoCodeFilledCount>0 || window.__autoSourceFixedCount>0 || window.__autoOKRCount>0 || window.__autoCoOwnerCount>0){
  setTimeout(()=>{
    const parts=[];
    if(window.__autoImportedCount>0) parts.push(`เพิ่มโครงการใหม่ ${window.__autoImportedCount} โครงการ`);
    if(window.__autoRevisedCount>0) parts.push(`ปรับปรุงโครงการเดิม ${window.__autoRevisedCount} โครงการ`);
    if(window.__autoSourceFixedCount>0) parts.push(`ปรับแหล่งงบ ${window.__autoSourceFixedCount} โครงการ`);
    if(window.__autoCoOwnerCount>0) parts.push(`เติมผู้รับผิดชอบร่วม ${window.__autoCoOwnerCount} โครงการ`);
    if(window.__autoOKRCount>0) parts.push(`เพิ่ม OKR ${window.__autoOKRCount} กิจกรรม + เมนู Carbon`);
    if(window.__autoCodeFilledCount>0) parts.push(`เติมรหัสโครงการ ${window.__autoCodeFilledCount} โครงการ`);
    showToast(`✅ นำเข้าข้อมูลให้อัตโนมัติ: ${parts.join(' · ')}`);
  }, 400);
}
