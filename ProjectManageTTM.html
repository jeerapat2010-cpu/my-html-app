<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบริหารแผนงานโครงการและบุคลากร | กลุ่มงานการแพทย์แผนไทยฯ สสจ.สมุทรปราการ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --g-900:#0B3D2E; --g-800:#0F5132; --g-700:#146C43; --g-600:#1A8754; --g-500:#22A05F;
  --g-400:#4FC087; --g-100:#E3F5EC; --g-50:#F3FAF6;
  --gold:#C89B3C; --gold-d:#9C7A2C;
  --ink:#173226; --ink-soft:#4B6358; --line:#DCEAE2;
  --red:#D64545; --amber:#DE9A1F; --blue:#2D6FA5; --purple:#7C4FA0; --gray:#8A9A92;
  --bg:#F5F8F6; --card:#FFFFFF;
  --shadow: 0 1px 2px rgba(15,81,50,.06), 0 4px 16px rgba(15,81,50,.06);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'IBM Plex Sans Thai','Sarabun',sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#C5DACD;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

#app{display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:264px; flex:none; background:linear-gradient(180deg,var(--g-900),#0A2F23 85%);
  color:#EAF6EF; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; z-index:20;
}
.brand{ padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,.08);}
.brand-title{font-size:15.5px; font-weight:700; line-height:1.35; color:#fff;}
.brand-sub{font-size:11.5px; color:#9FCBAF; margin-top:4px; line-height:1.5;}
.nav-scroll{flex:1; overflow-y:auto; padding:10px 12px 18px;}
.nav-group-label{font-size:10.5px; letter-spacing:.06em; color:#7FB397; text-transform:uppercase; margin:16px 10px 6px; font-weight:600;}
.nav-substep{display:flex; align-items:center; gap:7px; font-size:10.5px; color:#6FA084; margin:12px 12px 4px; font-weight:600; letter-spacing:.02em;}
.nav-substep .step-num{width:15px; height:15px; border-radius:50%; background:rgba(255,255,255,.08); display:inline-flex; align-items:center; justify-content:center; font-size:9px; color:#B7E0C8; flex:none;}
.step-badge{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--g-600); color:#fff; font-size:12px; font-weight:700;}
.nav-leg{ margin:6px 8px 4px; padding:8px 10px; border-radius:10px; background:rgba(255,255,255,.05); display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:#CFE9DA;}
.nav-leg .dot{width:8px;height:8px;border-radius:3px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; margin:2px 6px; border-radius:9px;
  font-size:13.5px; color:#D3E9DC; cursor:pointer; transition:.15s; user-select:none;
}
.nav-item:hover{background:rgba(255,255,255,.08); color:#fff;}
.nav-item.active{background:var(--g-500); color:#06231A; font-weight:700; box-shadow:0 3px 10px rgba(34,160,95,.35);}
.nav-item .ic{width:18px;text-align:center;font-size:14px;}
.sidebar-foot{padding:14px 18px 18px; border-top:1px solid rgba(255,255,255,.08); font-size:10.5px; color:#6FA084; line-height:1.6;}

/* ---------- Main ---------- */
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:15; background:rgba(245,248,246,.9); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.tab-bar{position:sticky; top:0; z-index:14; display:flex; gap:4px; padding:0 26px; background:#fff; border-bottom:1px solid var(--line); overflow-x:auto;}
.tab-item{padding:12px 16px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap; transition:.15s;}
.tab-item:hover{color:var(--g-700);}
.tab-item.active{color:var(--g-800); border-bottom-color:var(--g-600);}
.page-title{font-size:19px; font-weight:700; color:var(--g-900);}
.page-sub{font-size:12px; color:var(--ink-soft); margin-top:1px;}
.spacer{flex:1;}
.fy-select-wrap{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px 10px; box-shadow:var(--shadow);}
.fy-select-wrap label{font-size:11px; color:var(--ink-soft); font-weight:600;}
select.fy-select{border:none; background:transparent; font-weight:700; color:var(--g-800); font-size:13.5px; outline:none;}
.btn{
  border:none; border-radius:10px; padding:9px 15px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:7px;
  transition:.15s; white-space:nowrap;
}
.btn-primary{background:var(--g-600); color:#fff; box-shadow:0 2px 8px rgba(26,135,84,.35);}
.btn-primary:hover{background:var(--g-700);}
.btn-ghost{background:#fff; color:var(--g-800); border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--g-500); color:var(--g-700);}
.btn-danger{background:#FCEAEA; color:var(--red);}
.btn-danger:hover{background:#F8D4D4;}
.btn-sm{padding:6px 10px; font-size:12px; border-radius:8px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.content{padding:22px 26px 60px;}

/* ---------- Cards / grid ---------- */
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:760px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid #EDF4F0;}
.card-pad{padding:18px 20px;}
.card-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px 0;}
.card-title{font-size:14.5px; font-weight:700; color:var(--g-900);}
.card-title .muted{font-weight:500; color:var(--ink-soft); font-size:11.5px;}

.kpi-card{padding:18px 20px; display:flex; flex-direction:column; gap:6px; position:relative; overflow:hidden;}
.kpi-icon{position:absolute; right:14px; top:14px; font-size:26px; opacity:.16;}
.kpi-label{font-size:12px; color:var(--ink-soft); font-weight:600;}
.kpi-value{font-size:26px; font-weight:700; color:var(--g-900);}
.kpi-delta{font-size:11.5px; font-weight:600;}
.kpi-delta.up{color:var(--g-600);} .kpi-delta.down{color:var(--red);}

/* ---------- Badges / tags ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px;}
.badge-dot{width:6px;height:6px;border-radius:50%;}
.b-notstarted{background:#EEF1EF; color:#5A6B63;}
.b-inprogress{background:#FFF3DC; color:#9C6B0B;}
.b-done{background:#E1F5E9; color:#0F7A45;}
.b-delayed{background:#FCE7E7; color:#C23838;}
.b-cancelled{background:#F1EFF6; color:#7A6A96;}
.pri-high{background:#FCE7E7; color:#C23838;}
.pri-mid{background:#FFF3DC; color:#9C6B0B;}
.pri-low{background:#E7F1FC; color:#2A6FA0;}

/* ---------- Table ---------- */
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); font-weight:700; padding:9px 12px; border-bottom:2px solid var(--line); white-space:nowrap;}
td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr.tbl-row{cursor:pointer; transition:.1s;}
tr.tbl-row:hover{background:var(--g-50);}
.tbl-wrap{overflow-x:auto;}

.progress-bar{width:100%; height:7px; background:#EAF0EC; border-radius:99px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--g-500),var(--g-600)); border-radius:99px;}

/* ---------- Buttons small icon ---------- */
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line); background:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:13px; color:var(--ink-soft);}
.icon-btn:hover{border-color:var(--g-500); color:var(--g-700); background:var(--g-50);}

/* ---------- Search / filters ---------- */
.filter-bar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
.input, .select{border:1px solid var(--line); border-radius:9px; padding:8px 12px; font-size:13px; background:#fff; color:var(--ink); outline:none;}
.input:focus,.select:focus{border-color:var(--g-500); box-shadow:0 0 0 3px rgba(34,160,95,.12);}
.input-search{min-width:220px;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(11,61,46,.45); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:38px 16px; overflow-y:auto;}
.modal{background:#fff; border-radius:16px; width:100%; max-width:720px; box-shadow:0 20px 60px rgba(0,0,0,.25); animation:pop .15s ease;}
.modal.modal-wide{max-width:980px;}
@keyframes pop{from{transform:translateY(8px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
.modal-head h3{margin:0; font-size:16.5px; color:var(--g-900);}
.modal-body{padding:20px 22px; max-height:72vh; overflow-y:auto;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
.modal-close{background:none;border:none;font-size:18px;color:var(--ink-soft);}

.form-row{margin-bottom:14px;}
.form-row label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
.form-row .input, .form-row .select, .form-row textarea{width:100%;}
.form-2col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
textarea.input{resize:vertical; min-height:70px;}

/* ---------- Kanban ---------- */
.kanban{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media(max-width:1000px){.kanban{grid-template-columns:repeat(2,1fr);}}
.kanban-col{background:#EEF5F0; border-radius:14px; padding:12px; min-height:200px;}
.kanban-col-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:0 4px;}
.kanban-col-title{font-size:12.5px; font-weight:700;}
.kanban-count{font-size:11px; background:#fff; padding:2px 8px; border-radius:99px; font-weight:700; color:var(--ink-soft);}
.kanban-card{background:#fff; border-radius:11px; padding:11px 12px; margin-bottom:9px; box-shadow:0 1px 3px rgba(0,0,0,.06); cursor:grab; border-left:4px solid var(--g-500);}
.kanban-card:active{cursor:grabbing;}
.kanban-card .kc-title{font-size:12.8px; font-weight:600; color:var(--ink); margin-bottom:5px; line-height:1.4;}
.kanban-card .kc-meta{font-size:11px; color:var(--ink-soft); display:flex; justify-content:space-between; align-items:center;}
.kanban-col.drag-over{outline:2px dashed var(--g-500); outline-offset:-4px;}

/* ---------- Misc ---------- */
.avatar{width:34px;height:34px;border-radius:10px; display:inline-flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:#fff; flex:none;}
.person-card{padding:16px; display:flex; gap:12px; align-items:flex-start; cursor:pointer;}
.person-card:hover{border-color:var(--g-400);}
.empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.empty-state .ic{font-size:34px; margin-bottom:10px;}
.tag-chip{display:inline-flex; align-items:center; gap:6px; background:var(--g-50); border:1px solid var(--g-100); color:var(--g-800); font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:99px;}
.hr{height:1px; background:var(--line); margin:16px 0;}
.subtask-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
.subtask-row:last-child{border-bottom:none;}
.chk{width:19px;height:19px; border-radius:6px; border:2px solid #C7D9CE; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:none; font-size:12px; color:#fff;}
.chk.done{background:var(--g-600); border-color:var(--g-600);}
.file-chip{display:flex; align-items:center; gap:8px; background:#F5F8F6; border:1px solid var(--line); border-radius:9px; padding:7px 10px; font-size:12px; margin-bottom:6px;}
.file-chip a{color:var(--g-700); font-weight:600; text-decoration:none; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.small-muted{font-size:11.5px; color:var(--ink-soft);}
.star-row{display:flex; gap:4px;}
.star{font-size:19px; color:#DDE6E0; cursor:pointer;}
.star.on{color:var(--gold);}
.section-title{font-size:13px; font-weight:700; color:var(--g-900); margin:22px 0 10px; display:flex; align-items:center; gap:8px;}
.section-title .line-flex{flex:1; height:1px; background:var(--line);}
.toast{position:fixed; bottom:22px; right:22px; background:var(--g-900); color:#fff; padding:12px 18px; border-radius:10px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:200; opacity:0; transform:translateY(10px); transition:.25s;}
.toast.show{opacity:1; transform:translateY(0);}
.priority-arrows{display:flex; flex-direction:column; gap:2px;}
.priority-arrows button{width:20px;height:16px;border:none;background:#F0F5F1;border-radius:4px;font-size:9px;color:var(--ink-soft);}
.gantt-wrap{overflow-x:auto;}
.gantt-grid{display:grid; grid-template-columns:220px repeat(12,1fr); min-width:920px; font-size:11px;}
.gantt-head{padding:8px 6px; font-weight:700; text-align:center; color:var(--ink-soft); border-bottom:2px solid var(--line);}
.gantt-name{padding:9px 10px; font-size:12px; font-weight:600; border-bottom:1px solid var(--line); display:flex; align-items:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.gantt-cell{border-bottom:1px solid var(--line); border-left:1px solid #F0F4F1; height:36px; position:relative;}
.gantt-bar{position:absolute; top:8px; bottom:8px; left:2px; right:2px; border-radius:5px; background:var(--g-500);}
.credit-footer{margin-top:34px; text-align:center; font-size:11px; color:#9FB3A8; padding:16px 0 4px;}
.link-btn{background:none;border:none;color:var(--g-700);font-weight:600;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0;}
.two-leg-banner{display:flex; gap:14px; margin-bottom:18px;}
.leg-pill{flex:1; border-radius:14px; padding:14px 18px; display:flex; align-items:center; gap:12px; color:#fff;}
.leg-pill .leg-ic{font-size:22px;}
.leg-pill .leg-t{font-size:13.5px; font-weight:700;}
.leg-pill .leg-s{font-size:11px; opacity:.85;}
.leg-pill.work{background:linear-gradient(120deg,#146C43,#1A8754);}
.leg-pill.people{background:linear-gradient(120deg,#2A5C8A,#3B7BB0);}
.radio-pills{display:flex; gap:8px; flex-wrap:wrap;}
.radio-pill{border:1px solid var(--line); border-radius:9px; padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer; background:#fff; color:var(--ink-soft);}
.radio-pill.sel{background:var(--g-600); border-color:var(--g-600); color:#fff;}
.nav-badge{margin-left:auto; background:var(--red); color:#fff; font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:99px; min-width:18px; text-align:center;}
.gs-wrap{position:relative;}
.gs-panel{position:absolute; top:calc(100% + 6px); left:0; width:360px; max-height:400px; overflow-y:auto; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.14); z-index:60; padding:6px;}
.gs-group-label{font-size:10.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; padding:8px 10px 4px;}
.gs-item{padding:8px 10px; border-radius:8px; font-size:12.5px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; align-items:center;}
.gs-item:hover{background:var(--g-50);}
@media print{
  .sidebar, .topbar, .filter-bar, .btn, .modal-overlay, #toast, .icon-btn, .priority-arrows, .credit-footer, .gs-panel{ display:none !important; }
  body{ background:#fff; }
  .main{ width:100%; }
  .content{ padding:0; }
  .card{ box-shadow:none; border:1px solid #ccc; break-inside:avoid; }
  a[href]:after{ content:''; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================================
   ระบบบริหารแผนงานโครงการและบุคลากร (Work & People Ops)
   กลุ่มงานการแพทย์แผนไทยและการแพทย์ทางเลือก สสจ.สมุทรปราการ
   Single-file offline-capable app · localStorage persistence
   ========================================================================= */

const STORAGE_KEY = 'thaimed_ops_v1';
const APP_VERSION = 'v3.1';
const THAI_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const FY_MONTHS = ['ต.ค.','พ.ย.','ธ.ค.','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.'];
const STATUS_LIST = [
  {id:'notstarted', label:'ยังไม่เริ่ม', cls:'b-notstarted', color:'#8A9A92'},
  {id:'inprogress', label:'กำลังดำเนินการ', cls:'b-inprogress', color:'#DE9A1F'},
  {id:'done', label:'เสร็จสิ้น', cls:'b-done', color:'#1A8754'},
  {id:'delayed', label:'ล่าช้า', cls:'b-delayed', color:'#D64545'},
  {id:'cancelled', label:'ยกเลิก', cls:'b-cancelled', color:'#7C4FA0'},
];
const PRIORITY_LIST = [
  {id:'high', label:'สูง', cls:'pri-high'},
  {id:'mid', label:'กลาง', cls:'pri-mid'},
  {id:'low', label:'ต่ำ', cls:'pri-low'},
];
const AVATAR_COLORS = ['#1A8754','#2D6FA5','#C89B3C','#7C4FA0','#D64545','#0F5132','#3B7BB0','#9C6B0B'];

/* อัตราค่าใช้จ่ายมาตรฐานตามระเบียบ สสจ.สมุทรปราการ (อัตราค่าใช้จ่ายสำหรับการดำเนินงานตามแผนงาน/โครงการ ปี 2569 ฉบับแก้ไข) */
function defaultExpenseRateCard(){
  return [
    // หมวด 1: ค่าใช้จ่ายในการจัดประชุมราชการ
    {id:uid('rate'), category:'1. ประชุมราชการ', name:'ค่าเช่าห้องประชุม/สถานที่ (สถานที่ราชการ)', unit:'บาท/วัน', rate:2000, note:'ไม่เกิน'},
    {id:uid('rate'), category:'1. ประชุมราชการ', name:'ค่าเช่าห้องประชุม/สถานที่ (สถานที่เอกชน)', unit:'บาท/วัน', rate:10000, note:'ไม่เกิน'},
    {id:uid('rate'), category:'1. ประชุมราชการ', name:'ค่าอาหารกลางวัน (สถานที่ราชการ)', unit:'บาท/มื้อ/คน', rate:100, note:'ไม่เกิน'},

function uid(p){ return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){ n=Number(n)||0; return n.toLocaleString('th-TH',{maximumFractionDigits:0}); }
function fmtDateTH(iso){
  if(!iso) return '-';
  const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return '-';
  return d.getDate()+' '+THAI_MONTHS[d.getMonth()]+' '+(d.getFullYear()+543);
}
function fmtDateShort(iso){
  if(!iso) return '-';
  const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return '-';
  return d.getDate()+' '+THAI_MONTHS[d.getMonth()]+' '+String(d.getFullYear()+543).slice(2);
}
function fmtDateTimeTH(isoFull){
  if(!isoFull) return '-';
  const d=new Date(isoFull); if(isNaN(d)) return '-';
  const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  return d.getDate()+' '+THAI_MONTHS[d.getMonth()]+' '+(d.getFullYear()+543)+' '+hh+':'+mm+' น.';
}
function daysUntil(iso){
  if(!iso) return null;
  const d=new Date(iso+'T00:00:00'); const now=new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}
function statusObj(id){ return STATUS_LIST.find(s=>s.id===id) || STATUS_LIST[0]; }
function priObj(id){ return PRIORITY_LIST.find(s=>s.id===id) || PRIORITY_LIST[1]; }
function escapeHtml(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ if(!name) return '?'; const parts=name.trim().split(/\s+/); return parts.length>1?(parts[0][0]+parts[1][0]).toUpperCase():name.slice(0,2).toUpperCase(); }
function colorForId(id){ let h=0; for(let i=0;i<id.length;i++) h=id.charCodeAt(i)+((h<<5)-h); return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length]; }
function showToast(msg){
  const t=document.getElementById('toast'); t.innerHTML=''; t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__toastTimer); window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}
function showToastUndo(msg, undoFn){
  const t=document.getElementById('toast');
  window.__toastUndo = undoFn;
  t.innerHTML = `<span>${escapeHtml(msg)}</span> <button onclick="window.__toastUndo && window.__toastUndo(); document.getElementById('toast').classList.remove('show');" style="margin-left:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);color:#fff;padding:4px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600;">↩️ เลิกทำ</button>`;
  t.classList.add('show');
  clearTimeout(window.__toastTimer); window.__toastTimer=setTimeout(()=>t.classList.remove('show'),6000);
}

let DB = null;
function loadDB(){
  let hadStoredData = false;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ DB = JSON.parse(raw); hadStoredData = true; }
    else{ DB = seedData(); }
  }catch(e){ DB = seedData(); }
  if(!DB.tasks) DB.tasks=[];
  if(!DB.evaluations) DB.evaluations=[];
  if(!DB.trash) DB.trash=[];
  if(!DB.auditLog) DB.auditLog=[];
  if(!DB.projectTemplates) DB.projectTemplates=[];
  if(!DB.expenseRateCard || !DB.expenseRateCard.length) DB.expenseRateCard=defaultExpenseRateCard();
  if(!DB.strategicGoals) DB.strategicGoals=[];
  if(DB.currentUserName===undefined) DB.currentUserName='';
  purgeOldTrash();
  window.__versionMismatch = hadStoredData && DB.meta && DB.meta.version !== APP_VERSION;
  window.__storedVersion = hadStoredData ? (DB.meta && DB.meta.version) : null;
}
function purgeOldTrash(){
  if(!DB.trash || !DB.trash.length) return;
  const cutoff = Date.now() - 7*24*60*60*1000;
  DB.trash = DB.trash.filter(e=> new Date(e.deletedAt).getTime() > cutoff);
}
function logAction(action, detail){
  if(!DB.auditLog) DB.auditLog=[];
  DB.auditLog.unshift({
    id: uid('log'),
    action, detail,
    actor: DB.currentUserName && DB.currentUserName.trim() ? DB.currentUserName.trim() : 'ไม่ระบุผู้ใช้',
    at: new Date().toISOString()
  });
  if(DB.auditLog.length > 500) DB.auditLog.length = 500;
}
function saveDB(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e){ showToast('⚠️ บันทึกไม่สำเร็จ (พื้นที่จัดเก็บเต็ม) กรุณาลบไฟล์แนบบางส่วน'); }
}

function getPersonName(id){ const p=DB.personnel.find(x=>x.id===id); return p?p.name:'— ไม่ระบุ —'; }

function getProject(id){ return DB.projects.find(x=>x.id===id); }
function getCategory(id){ return DB.categories.find(x=>x.id===id); }
function tasksOfProject(pid){ return DB.tasks.filter(t=>t.projectId===pid); }
function projectProgress(pid){
  const ts=tasksOfProject(pid);
  if(!ts.length) return null;
  const done=ts.filter(t=>t.status==='done').length;
  return Math.round(done/ts.length*100);
}
function yearProjects(){ return DB.projects.filter(p=>p.year===DB.currentYear); }

/* ---- Disbursement (การเบิกจ่ายงบประมาณ) helpers ---- */
function disbRemaining(p){ return (Number(p.budgetAmount)||0) - (Number(p.disbAmount)||0); }
function disbPercent(p){ const b=Number(p.budgetAmount)||0; if(b<=0) return 0; return Math.min(100, Math.round((Number(p.disbAmount)||0)/b*100)); }
function disbStatusLabel(p){
  const b=Number(p.budgetAmount)||0, d=Number(p.disbAmount)||0;
  if(b<=0) return {label:'ไม่มีงบประมาณ', cls:'b-notstarted'};
  if(p.disbCompleteDate || d>=b) return {label:'เบิกจ่ายแล้วเสร็จ', cls:'b-done'};
  if(d>0) return {label:'กำลังเบิกจ่าย', cls:'b-inprogress'};
  return {label:'ยังไม่เบิกจ่าย', cls:'b-notstarted'};
}
function urgentProjectsCount(){
  return yearProjects().filter(p=>p.status!=='done' && p.status!=='cancelled' && p.endDate && daysUntil(p.endDate)<=7).length;
}
function urgentTasksCount(){
  const pids = new Set(yearProjects().map(p=>p.id));
  return DB.tasks.filter(t=>pids.has(t.projectId) && t.status!=='done' && t.dueDate && daysUntil(t.dueDate)<=7).length;
}
function nearDepletedCount(){
  return yearProjects().filter(p=>(Number(p.budgetAmount)||0)>0 && disbPercent(p)>=90 && disbPercent(p)<100).length;
}

/* ---------------------------- Global Search ---------------------------- */
function doGlobalSearch(q){
  q = q.trim().toLowerCase();
  if(!q) return '';
  const matchedProjects = DB.projects.filter(p=>p.name.toLowerCase().includes(q)).slice(0,5);
  const matchedPersonnel = DB.personnel.filter(p=>p.name.toLowerCase().includes(q)||(p.position&&p.position.toLowerCase().includes(q))).slice(0,5);
  const matchedTasks = DB.tasks.filter(t=>t.name.toLowerCase().includes(q)).slice(0,5);
  if(!matchedProjects.length && !matchedPersonnel.length && !matchedTasks.length){
    return `<div class="small-muted" style="padding:14px;text-align:center;">ไม่พบผลลัพธ์สำหรับ "${escapeHtml(q)}"</div>`;
  }
  let html='';
  if(matchedProjects.length){
    html += `<div class="gs-group-label">📁 โครงการ</div>`;
    html += matchedProjects.map(p=>`<div class="gs-item" onclick="gsGoProject('${p.id}')"><span>${escapeHtml(p.name)}</span><span class="small-muted">ปี ${p.year}</span></div>`).join('');
  }
  if(matchedPersonnel.length){
    html += `<div class="gs-group-label">👤 บุคลากร</div>`;
    html += matchedPersonnel.map(p=>`<div class="gs-item" onclick="gsGoPerson('${p.id}')"><span>${escapeHtml(p.name)}</span><span class="small-muted">${escapeHtml(p.position||'')}</span></div>`).join('');
  }
  if(matchedTasks.length){
    html += `<div class="gs-group-label">✅ งานย่อย</div>`;
    html += matchedTasks.map(t=>{
      const proj=getProject(t.projectId);
      return `<div class="gs-item" onclick="gsGoTask('${t.projectId}')"><span>${escapeHtml(t.name)}</span><span class="small-muted">${proj?escapeHtml(proj.name.slice(0,20))+'…':''}</span></div>`;
    }).join('');
  }
  return html;
}
function hideGlobalSearch(){
  const panel=document.getElementById('globalSearchResults'); if(panel) panel.style.display='none';
  const inp=document.getElementById('globalSearch'); if(inp) inp.value='';
}
function gsGoProject(id){
  const p=getProject(id);
  hideGlobalSearch();
  if(p && p.year!==DB.currentYear){ DB.currentYear=p.year; saveDB(); }
  UI.route='projects'; UI.personDetailId=null; render();
  openProjectDetail(id);
}
function gsGoPerson(id){
  hideGlobalSearch();
  UI.route='people'; UI.personDetailId=id; render();
}
function gsGoTask(pid){
  const p=getProject(pid);
  hideGlobalSearch();
  if(p && p.year!==DB.currentYear){ DB.currentYear=p.year; saveDB(); }
  UI.route='projects'; UI.personDetailId=null; render();
  openProjectDetail(pid);
}

function viewDashboard(){
  const projs = yearProjects();
  const totalBudget = projs.reduce((s,p)=>s+(Number(p.budgetAmount)||0),0);
  const allTasks = DB.tasks.filter(t=>projs.some(p=>p.id===t.projectId));
  const doneTasks = allTasks.filter(t=>t.status==='done').length;
  const taskPct = allTasks.length ? Math.round(doneTasks/allTasks.length*100) : 0;
  const delayed = projs.filter(p=>p.status==='delayed').length;
  const upcoming = projs.filter(p=>{const d=daysUntil(p.endDate); return d!==null && d>=0 && d<=21 && p.status!=='done' && p.status!=='cancelled';})
    .sort((a,b)=>daysUntil(a.endDate)-daysUntil(b.endDate));
  const budgetAlerts = projs.filter(p=>(Number(p.budgetAmount)||0)>0 && disbPercent(p)>=90);
  const milestoneAlerts = allUpcomingMilestones(14);
  const highRisks = allRisksInYear().filter(x=>riskScore(x.risk)>=15 && x.risk.status!=='closed');

  return `
  <div class="two-leg-banner">
    <div class="leg-pill work"><span class="leg-ic">📁</span><div><div class="leg-t">PART “งาน” — ${projs.length} โครงการ</div><div class="leg-s">งบประมาณรวม ${money(totalBudget)} บาท · ปีงบ ${DB.currentYear}</div></div></div>
    <div class="leg-pill people"><span class="leg-ic">👥</span><div><div class="leg-t">PART “คน” — ${DB.personnel.length} คน</div><div class="leg-s">งานย่อยทั้งหมด ${allTasks.length} รายการ</div></div></div>
  </div>
  ${budgetAlerts.length? `
  <div class="card card-pad" style="margin-bottom:12px; border-left:4px solid var(--amber); background:#FFFBF0;">
    <div style="font-weight:700; color:#9C6B0B; margin-bottom:4px;">⚠️ งบประมาณใกล้หมด ${budgetAlerts.length} โครงการ — <span class="link-btn" style="text-decoration:underline;cursor:pointer;font-weight:600;" onclick="UI.route='budget';render()">ดูรายละเอียดที่หน้างบประมาณ</span></div>
  </div>` : ''}
  ${highRisks.length? `
  <div class="card card-pad" style="margin-bottom:12px; border-left:4px solid var(--red); background:#FDF1F1;">
    <div style="font-weight:700; color:#C23838; margin-bottom:4px;">🔴 ความเสี่ยงระดับสูงมาก ${highRisks.length} รายการ — <span class="link-btn" style="text-decoration:underline;cursor:pointer;font-weight:600;color:#C23838;" onclick="UI.route='riskregister';render()">ดูทะเบียนความเสี่ยง</span></div>
  </div>` : ''}
  ${milestoneAlerts.length? `
  <div class="card card-pad" style="margin-bottom:16px; border-left:4px solid var(--g-500); background:var(--g-50);">
    <div style="font-weight:700; color:var(--g-800); margin-bottom:6px;">🚩 หมุดหมายสำคัญใกล้ถึง (14 วัน)</div>
    ${milestoneAlerts.slice(0,5).map(({project,milestone,daysLeft})=>`<div style="font-size:12.5px;padding:3px 0;cursor:pointer;" onclick="openProjectDetail('${project.id}')">${daysLeft<0?'🔴 เลยกำหนด':'🚩'} <b>${escapeHtml(milestone.name)}</b> — ${escapeHtml(project.name)} · ${daysLeft<0?`เลยมา ${Math.abs(daysLeft)} วัน`:`อีก ${daysLeft} วัน`}</div>`).join('')}
  </div>` : ''}

  <div class="grid grid-4">
    ${kpiCard('📁','โครงการทั้งหมด (ปีนี้)', projs.length, `${projs.filter(p=>p.status==='inprogress').length} กำลังดำเนินการ`)}
    ${kpiCard('💰','งบประมาณรวม', money(totalBudget)+' บาท', `${DB.budgetSources.length} แหล่งงบ`)}
    ${kpiCard('✅','ความคืบหน้างานย่อย', taskPct+'%', `${doneTasks}/${allTasks.length} รายการเสร็จสิ้น`)}
    ${kpiCard('⚠️','โครงการล่าช้า', delayed, delayed>0?'ต้องติดตามเร่งด่วน':'ไม่มีโครงการล่าช้า')}
  </div>

  <div class="grid grid-3" style="margin-top:16px;">
    <div class="card card-pad">
      <div class="card-title" style="margin-bottom:10px;">สัดส่วนสถานะโครงการ</div>
      <canvas id="chartStatus" height="200"></canvas>
    </div>
    <div class="card card-pad">
      <div class="card-title" style="margin-bottom:10px;">งบประมาณตามแหล่งที่มา</div>
      <canvas id="chartBudgetSource" height="200"></canvas>
    </div>
    <div class="card card-pad">
      <div class="card-title" style="margin-bottom:10px;">ภาระงานรายบุคคล (จำนวนงานย่อย)</div>
      <canvas id="chartWorkload" height="200"></canvas>
    </div>
  </div>

  <div class="grid grid-2" style="margin-top:16px; align-items:start;">
    <div class="card">
      <div class="card-head"><div class="card-title">โครงการใกล้ครบกำหนด <span class="muted">(ภายใน 21 วัน)</span></div></div>
      <div class="card-pad" style="padding-top:12px;">
        ${upcoming.length? upcoming.map(p=>{
          const d=daysUntil(p.endDate); const s=statusObj(p.status);
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="openProjectDetail('${p.id}')">
            <div><div style="font-weight:600;font-size:13px;">${escapeHtml(p.name)}</div><div class="small-muted">กำหนดเสร็จ ${fmtDateTH(p.endDate)} · ${getPersonName(p.ownerPersonId)}</div></div>
            <span class="badge ${d<=7?'b-delayed':'b-inprogress'}">${d} วัน</span>
          </div>`;
        }).join('') : `<div class="empty-state" style="padding:20px;">ไม่มีโครงการใกล้ครบกำหนดในขณะนี้ 🎉</div>`}
      </div>
    </div>
    <div class="card">

      </div>
    </div>
  </div>

  <div class="section-title" style="margin-top:22px;">🎯 Balanced Scorecard<span class="line-flex"></span></div>

      const f = budgetBurnRateForecast();

      return `<div class="card card-pad">

      </div>`;
    })()}
    ${(()=>{
      const doneP = projs.filter(p=>p.status==='done').length;
      const projPct = projs.length? Math.round(doneP/projs.length*100) : 0;
      return `<div class="card card-pad">
        <div style="font-weight:700;color:var(--g-900);margin-bottom:8px;">⚙️ มุมกระบวนการ</div>
        <div class="small-muted">โครงการเสร็จสมบูรณ์</div><div style="font-size:20px;font-weight:700;">${projPct}%</div>
        <div class="small-muted" style="margin-top:6px;">${doneP}/${projs.length} โครงการ · ล่าช้า ${delayed} โครงการ</div>
      </div>`;
    })()}
    ${(()=>{
      const wd = computeHeatmapData();
      const totalW = Object.values(wd).reduce((s,arr)=>s+arr.reduce((a,b)=>a+b,0),0);
      const avgW = DB.personnel.length? (totalW/DB.personnel.length).toFixed(1) : '0';
      const evals = DB.evaluations.filter(e=>e.year===DB.currentYear);
      const avgEval = evals.length? (evals.reduce((s,e)=>s+evalOverall(e),0)/evals.length).toFixed(1) : null;
      return `<div class="card card-pad">
        <div style="font-weight:700;color:var(--g-900);margin-bottom:8px;">👥 มุมบุคลากร</div>
        <div class="small-muted">ภาระงานเฉลี่ย/คน/ปี</div><div style="font-size:20px;font-weight:700;">${avgW}</div>
        <div class="small-muted" style="margin-top:6px;">คะแนนประเมินเฉลี่ย ${avgEval? avgEval+' / 5' : '- ยังไม่มีการประเมิน'}</div>
      </div>`;
    })()}
    ${(()=>{
      const withIndicator = projs.filter(p=>p.indicator && p.indicator.trim());
      const achieved = withIndicator.filter(p=>p.status==='done').length;
      const pct = withIndicator.length? Math.round(achieved/withIndicator.length*100) : 0;
      return `<div class="card card-pad">
        <div style="font-weight:700;color:var(--g-900);margin-bottom:8px;">🧑‍⚕️ มุมผู้รับบริการ</div>
        <div class="small-muted">โครงการบรรลุตัวชี้วัด (โดยประมาณ)</div><div style="font-size:20px;font-weight:700;">${pct}%</div>
        <div class="small-muted" style="margin-top:6px;">${achieved}/${withIndicator.length} โครงการที่มีตัวชี้วัดกำหนดไว้</div>
      </div>`;
    })()}
  </div>

  <div class="credit-footer">จัดทำโดย ภก.จีรภัทร พลายงาม · ลงวันที่ 21 สิงหาคม 2569 · ระบบบริหารแผนงานโครงการและบุคลากร · ${DB.meta.group} · ${DB.meta.version}</div>
  `;
}
function kpiCard(icon,label,value,delta){
  return `<div class="card kpi-card"><span class="kpi-icon">${icon}</span><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-delta up">${delta}</div></div>`;
}

function viewProjects(){
  let projs = yearProjects();

}
function renderAttachments(p){
  if(!p.attachments || !p.attachments.length) return '<div class="small-muted">ยังไม่มีไฟล์แนบ</div>';
  return p.attachments.map(a=>`<div class="file-chip">
    <span>📎</span><a href="${a.data}" download="${escapeHtml(a.name)}" target="_blank">${escapeHtml(a.name)}</a>
    <span class="small-muted">${(a.size/1024).toFixed(0)} KB</span>
    <button class="icon-btn" onclick="removeAttachment('${p.id}','${a.id}')">✕</button>
  </div>`).join('');
}
function handleFileAttach(e, projectId){
  const files=Array.from(e.target.files||[]);
  const p=getProject(projectId); if(!p) return;
  let remaining=files.length;
  if(!files.length) return;
  files.forEach(file=>{
    if(file.size>4*1024*1024){ showToast('⚠️ ไฟล์ "'+file.name+'" ใหญ่เกิน 4MB ข้ามไป'); remaining--; return; }
    const reader=new FileReader();
    reader.onload=()=>{
      p.attachments = p.attachments||[];
      p.attachments.push({id:uid('att'), name:file.name, size:file.size, type:file.type, data:reader.result});
      saveDB();
      const el=document.getElementById('attachmentList'); if(el) el.innerHTML=renderAttachments(p);
      showToast('แนบไฟล์ "'+file.name+'" เรียบร้อย');
    };
    reader.readAsDataURL(file);
  });
}
function removeAttachment(projectId, attId){
  const p=getProject(projectId); if(!p) return;
  p.attachments = (p.attachments||[]).filter(a=>a.id!==attId);
  saveDB();
  const el=document.getElementById('attachmentList'); if(el) el.innerHTML=renderAttachments(p);
}
function saveDisbursement(projectId){
  const p=getProject(projectId); if(!p) return;
  const amt = Number(document.getElementById('disb_amount').value)||0;
  if(amt > (Number(p.budgetAmount)||0)){
    showToast('⚠️ จำนวนเงินที่เบิกจ่ายต้องไม่เกินงบประมาณโครงการ');
    return;
  }
  p.disbRequestDate = document.getElementById('disb_reqdate').value;
  p.disbCompleteDate = document.getElementById('disb_donedate').value;
  p.disbAmount = amt;
  p.disbNote = document.getElementById('disb_note').value;
  logAction('เบิกจ่ายงบประมาณ', `โครงการ "${p.name}" เบิกจ่ายแล้ว ${money(amt)} บาท`);
  saveDB();
  showToast('บันทึกข้อมูลการเบิกจ่ายเรียบร้อย');
  closeModal();
  openProjectDetail(projectId);
  refreshBackground();
}

/* ---- Milestones (หมุดหมายสำคัญ) ---- */
function renderMilestones(p){
  const ms = (p.milestones||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(!ms.length) return '<div class="small-muted">ยังไม่มีหมุดหมายสำคัญ</div>';
  return ms.map(m=>{
    const d = daysUntil(m.date);
    let dueLabel='';
    if(!m.done && d!==null){
      if(d<0) dueLabel=`<span class="badge b-delayed">เลยกำหนด ${Math.abs(d)} วัน</span>`;
      else if(d<=7) dueLabel=`<span class="badge b-inprogress">อีก ${d} วัน</span>`;
    }
    return `<div class="subtask-row">
      <span class="chk ${m.done?'done':''}" onclick="toggleMilestoneDone('${p.id}','${m.id}')">${m.done?'✓':''}</span>
      <div style="flex:1;cursor:pointer;" onclick="openMilestoneForm('${p.id}','${m.id}')">
        <div style="font-weight:600;font-size:13px;${m.done?'text-decoration:line-through;color:var(--ink-soft);':''}">🚩 ${escapeHtml(m.name)}</div>
        <div class="small-muted">วันที่ ${fmtDateTH(m.date)}</div>
      </div>
      ${dueLabel}
      <button class="icon-btn" onclick="event.stopPropagation();deleteMilestone('${p.id}','${m.id}')">🗑️</button>
    </div>`;
  }).join('');
}
function openMilestoneForm(projectId, milestoneId){
  const p=getProject(projectId); if(!p) return;
  if(!p.milestones) p.milestones=[];
  const editing = !!milestoneId;
  const m = editing? p.milestones.find(x=>x.id===milestoneId) : {id:null, name:'', date:'', done:false};
  const body=`
    <div class="form-row"><label>ชื่อหมุดหมาย *</label><input class="input" id="ms_name" value="${escapeHtml(m.name)}" placeholder="เช่น วันอนุมัติงบประมาณ, วันเปิดอบรม"></div>
    <div class="form-row"><label>วันที่ *</label><input class="input" type="date" id="ms_date" value="${m.date||''}"></div>
  `;
  const footer=`
    ${editing?`<button class="btn btn-danger" onclick="deleteMilestone('${projectId}','${milestoneId}');closeModal();openProjectDetail('${projectId}')">ลบ</button>`:''}
    <button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
    <button class="btn btn-primary" onclick="saveMilestoneForm('${projectId}',${editing?`'${milestoneId}'`:'null'})">💾 บันทึก</button>`;
  openModal(editing?'แก้ไขหมุดหมาย':'เพิ่มหมุดหมายสำคัญ', body, footer);
}
function saveMilestoneForm(projectId, milestoneId){
  const p=getProject(projectId); if(!p) return;
  if(!p.milestones) p.milestones=[];
  const name=document.getElementById('ms_name').value.trim();
  const date=document.getElementById('ms_date').value;
  if(!name || !date){ showToast('กรุณากรอกชื่อและวันที่'); return; }
  if(milestoneId){ Object.assign(p.milestones.find(x=>x.id===milestoneId), {name,date}); }
  else{ p.milestones.push({id:uid('ms'), name, date, done:false}); }
  logAction('บันทึกหมุดหมาย', `โครงการ "${p.name}" · "${name}"`);
  saveDB(); closeModal();
  openProjectDetail(projectId);

}
function toggleMilestoneDone(projectId, milestoneId){
  const p=getProject(projectId); if(!p) return;
  const m=(p.milestones||[]).find(x=>x.id===milestoneId); if(!m) return;
  m.done = !m.done;
  saveDB();
  const el=document.getElementById('milestoneList'); if(el) el.innerHTML=renderMilestones(p);
  refreshBackground();
}
function deleteMilestone(projectId, milestoneId){
  const p=getProject(projectId); if(!p) return;
  p.milestones = (p.milestones||[]).filter(x=>x.id!==milestoneId);
  saveDB();
  const el=document.getElementById('milestoneList'); if(el) el.innerHTML=renderMilestones(p);
  refreshBackground();
}
function allUpcomingMilestones(daysAhead){
  const projs = yearProjects();
  const list=[];
  projs.forEach(p=>{
    (p.milestones||[]).forEach(m=>{
      if(m.done) return;
      const d = daysUntil(m.date);
      if(d===null) return;
      if(daysAhead===undefined || d<=daysAhead){ list.push({project:p, milestone:m, daysLeft:d}); }
    });
  });
  return list.sort((a,b)=>a.daysLeft-b.daysLeft);
}

/* ---- Risk Register (ความเสี่ยงโครงการ) ---- */
function riskScore(r){ return (Number(r.probability)||0)*(Number(r.impact)||0); }
function riskLevel(score){
  if(score>=15) return {label:'สูงมาก', cls:'b-delayed', color:'#D64545'};
  if(score>=8) return {label:'ปานกลาง', cls:'b-inprogress', color:'#DE9A1F'};
  return {label:'ต่ำ', cls:'b-done', color:'#1A8754'};
}
const RISK_STATUS = [
  {id:'open', label:'เปิดอยู่'},
  {id:'monitoring', label:'ติดตามอยู่'},
  {id:'closed', label:'ปิดแล้ว'},
];
function renderRisks(p){
  const risks = (p.risks||[]).slice().sort((a,b)=>riskScore(b)-riskScore(a));
  if(!risks.length) return '<div class="small-muted">ยังไม่มีการบันทึกความเสี่ยง</div>';
  return risks.map(r=>{
    const score=riskScore(r); const lvl=riskLevel(score);
    const st = RISK_STATUS.find(s=>s.id===r.status)||RISK_STATUS[0];
    return `<div class="subtask-row" style="align-items:flex-start;">
      <span class="badge ${lvl.cls}" style="margin-top:2px;">${score}</span>
      <div style="flex:1;cursor:pointer;" onclick="openRiskForm('${p.id}','${r.id}')">
        <div style="font-weight:600;font-size:13px;">${escapeHtml(r.name)}</div>
        <div class="small-muted">โอกาสเกิด ${r.probability}/5 × ผลกระทบ ${r.impact}/5 = ${score} (${lvl.label}) · ${st.label}</div>
        ${r.mitigation?`<div class="small-muted" style="margin-top:2px;">🛡️ ${escapeHtml(r.mitigation)}</div>`:''}
      </div>
      <button class="icon-btn" onclick="event.stopPropagation();deleteRisk('${p.id}','${r.id}')">🗑️</button>
    </div>`;
  }).join('');
}
function openRiskForm(projectId, riskId){
  const p=getProject(projectId); if(!p) return;
  if(!p.risks) p.risks=[];
  const editing = !!riskId;
  const r = editing? p.risks.find(x=>x.id===riskId) : {id:null, name:'', probability:3, impact:3, mitigation:'', status:'open'};
  const body=`
    <div class="form-row"><label>ความเสี่ยง *</label><input class="input" id="rk_name" value="${escapeHtml(r.name)}" placeholder="เช่น วิทยากรยกเลิกกะทันหัน"></div>
    <div class="form-2col">
      <div class="form-row"><label>โอกาสเกิด (1=น้อย, 5=มาก)</label><select class="select" id="rk_prob">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===r.probability?'selected':''}>${n}</option>`).join('')}</select></div>
      <div class="form-row"><label>ผลกระทบ (1=น้อย, 5=มาก)</label><select class="select" id="rk_impact">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===r.impact?'selected':''}>${n}</option>`).join('')}</select></div>
    </div>
    <div class="form-row"><label>สถานะ</label><select class="select" id="rk_status">${RISK_STATUS.map(s=>`<option value="${s.id}" ${s.id===r.status?'selected':''}>${s.label}</option>`).join('')}</select></div>
    <div class="form-row"><label>มาตรการรองรับ/แผนบรรเทา</label><textarea class="input" id="rk_mitigation" placeholder="เช่น เตรียมวิทยากรสำรอง 1 คน">${escapeHtml(r.mitigation||'')}</textarea></div>
  `;
  const footer=`
    ${editing?`<button class="btn btn-danger" onclick="deleteRisk('${projectId}','${riskId}');closeModal();openProjectDetail('${projectId}')">ลบ</button>`:''}
    <button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
    <button class="btn btn-primary" onclick="saveRiskForm('${projectId}',${editing?`'${riskId}'`:'null'})">💾 บันทึก</button>`;
  openModal(editing?'แก้ไขความเสี่ยง':'เพิ่มความเสี่ยงโครงการ', body, footer);
}
function saveRiskForm(projectId, riskId){
  const p=getProject(projectId); if(!p) return;
  if(!p.risks) p.risks=[];
  const name=document.getElementById('rk_name').value.trim();
  if(!name){ showToast('กรุณากรอกชื่อความเสี่ยง'); return; }
  const data={
    name, probability:Number(document.getElementById('rk_prob').value),

  saveDB(); closeModal();
  openProjectDetail(projectId);
  refreshBackground();
}
function deleteRisk(projectId, riskId){
  const p=getProject(projectId); if(!p) return;
  p.risks = (p.risks||[]).filter(x=>x.id!==riskId);
  saveDB();
  const el=document.getElementById('riskList'); if(el) el.innerHTML=renderRisks(p);
  refreshBackground();
}
function allRisksInYear(){
  const projs = yearProjects();
  const list=[];
  projs.forEach(p=>{ (p.risks||[]).forEach(r=>{ list.push({project:p, risk:r}); }); });
  return list.sort((a,b)=>riskScore(b.risk)-riskScore(a.risk));
}

/* ---- Approval Workflow (เสนอ → ตรวจสอบ → เห็นชอบ → อนุมัติ) ---- */
const APPROVAL_STAGES = [
  {id:'draft', label:'ร่าง'},
  {id:'proposed', label:'เสนอแล้ว'},
  {id:'reviewed', label:'ตรวจสอบแล้ว'},
  {id:'approved', label:'อนุมัติแล้ว'},
];
function approvalStageIndex(p){
  const idx = APPROVAL_STAGES.findIndex(s=>s.id===(p.approvalStage||'draft'));
  return idx<0?0:idx;
}
function renderApprovalStepper(p){
  const idx = approvalStageIndex(p);
  const history = p.approvalHistory||[];
  return `
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
    ${APPROVAL_STAGES.map((s,i)=>`<div style="display:flex;align-items:center;gap:6px;">
      <span style="width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:${i<=idx?'var(--g-600)':'#EAF0EC'};color:${i<=idx?'#fff':'var(--ink-soft)'};">${i+1}</span>
      <span style="font-size:12px;font-weight:${i===idx?700:500};color:${i<=idx?'var(--g-800)':'var(--ink-soft)'};">${s.label}</span>
      ${i<APPROVAL_STAGES.length-1?'<span style="color:var(--line);">→</span>':''}
    </div>`).join('')}
  </div>
  <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
    ${idx<APPROVAL_STAGES.length-1?`<button class="btn btn-primary btn-sm" onclick="advanceApproval('${p.id}')">➡️ ส่งต่อขั้นถัดไป: ${APPROVAL_STAGES[idx+1].label}</button>`:'<span class="badge b-done">อนุมัติครบทุกขั้นตอนแล้ว</span>'}
    ${idx>0?`<button class="btn btn-ghost btn-sm" onclick="revertApproval('${p.id}')">↩️ ย้อนกลับขั้นก่อนหน้า</button>`:''}
  </div>
  ${history.length? `<div class="small-muted">${history.slice().reverse().slice(0,5).map(h=>{
    const stg = APPROVAL_STAGES.find(s=>s.id===h.stage);
    return `<div>• ${escapeHtml(stg?stg.label:h.stage)} โดย ${escapeHtml(h.by)} · ${fmtDateTimeTH(h.at)}${h.note?' · '+escapeHtml(h.note):''}</div>`;
  }).join('')}</div>` : ''}
  `;
}
function advanceApproval(projectId){
  const p=getProject(projectId); if(!p) return;
  const idx = approvalStageIndex(p);
  if(idx>=APPROVAL_STAGES.length-1) return;
  const nextStage = APPROVAL_STAGES[idx+1];
  const body=`
    <div class="form-row"><label>ผู้ดำเนินการ</label><input class="input" id="apr_by" value="${escapeHtml(DB.currentUserName||'')}" placeholder="ชื่อผู้ดำเนินการ"></div>
    <div class="form-row"><label>หมายเหตุ (ถ้ามี)</label><textarea class="input" id="apr_note"></textarea></div>
  `;
  const footer = `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="confirmAdvanceApproval('${projectId}')">✅ ยืนยัน: ${nextStage.label}</button>`;
  openModal(`ส่งต่อขั้น: ${nextStage.label}`, body, footer);
}
function confirmAdvanceApproval(projectId){
  const p=getProject(projectId); if(!p) return;
  const idx = approvalStageIndex(p);
  const nextStage = APPROVAL_STAGES[idx+1];
  const by = document.getElementById('apr_by').value.trim() || 'ไม่ระบุ';
  const note = document.getElementById('apr_note').value;
  p.approvalStage = nextStage.id;
  if(!p.approvalHistory) p.approvalHistory=[];
  p.approvalHistory.push({stage:nextStage.id, by, at:new Date().toISOString(), note});
  logAction('เปลี่ยนขั้นอนุมัติโครงการ', `โครงการ "${p.name}" → ${nextStage.label} โดย ${by}`);
  saveDB(); closeModal();
  openProjectDetail(projectId);
  refreshBackground();
}
function revertApproval(projectId){
  const p=getProject(projectId); if(!p) return;
  const idx = approvalStageIndex(p);
  if(idx<=0) return;
  if(!confirm('ย้อนกลับไปขั้นก่อนหน้าหรือไม่?')) return;
  p.approvalStage = APPROVAL_STAGES[idx-1].id;
  logAction('ย้อนกลับขั้นอนุมัติ', `โครงการ "${p.name}" → ${APPROVAL_STAGES[idx-1].label}`);
  saveDB();
  openProjectDetail(projectId);
  refreshBackground();
}

function saveRaciForm(projectId){

function toggleTaskDone(taskId){
  const t=DB.tasks.find(x=>x.id===taskId); if(!t) return;
  t.status = t.status==='done' ? 'inprogress' : 'done';
  saveDB();
  const el=document.getElementById('subtaskList');
  if(el){ const ts=tasksOfProject(t.projectId); el.innerHTML = ts.map(subtaskRowHtml).join(''); }
  refreshBackground();
}
function deleteTask(taskId){
  if(!confirm('ลบงานย่อยนี้หรือไม่?')) return;
  const t=DB.tasks.find(x=>x.id===taskId);
  if(!t) return;
  const trashId = uid('trash');
  DB.trash.push({id:trashId, type:'task', payload:JSON.parse(JSON.stringify(t)), deletedAt:new Date().toISOString()});
  DB.tasks = DB.tasks.filter(x=>x.id!==taskId);
  logAction('ลบงานย่อย', `"${t.name}"`);
  saveDB();
  const el=document.getElementById('subtaskList'); if(el){ const ts=tasksOfProject(t.projectId); el.innerHTML = ts.length? ts.map(subtaskRowHtml).join('') : '<div class="small-muted">ยังไม่มีงานย่อย</div>'; }
  refreshBackground();
  showToastUndo('ลบงานย่อย "'+t.name+'" แล้ว', ()=>restoreTrashItem(trashId));
}
function deleteProject(id){
  if(!confirm('ลบโครงการนี้ทั้งหมด (รวมงานย่อยและไฟล์แนบ) ?')) return;
  const p = getProject(id); if(!p) return;
  const relatedTasks = DB.tasks.filter(t=>t.projectId===id);
  const trashId = uid('trash');
  DB.trash.push({id:trashId, type:'project', payload:JSON.parse(JSON.stringify(p)), relatedTasks:JSON.parse(JSON.stringify(relatedTasks)), deletedAt:new Date().toISOString()});
  DB.projects = DB.projects.filter(x=>x.id!==id);
  DB.tasks = DB.tasks.filter(t=>t.projectId!==id);
  logAction('ลบโครงการ', `"${p.name}"`);
  saveDB(); render();
  showToastUndo('ลบโครงการ "'+p.name+'" แล้ว', ()=>restoreTrashItem(trashId));
}
function restoreTrashItem(trashId){
  const idx = (DB.trash||[]).findIndex(x=>x.id===trashId);
  if(idx===-1){ showToast('ไม่พบรายการนี้ในถังขยะแล้ว (อาจถูกลบถาวรหรือกู้คืนไปแล้ว)'); return; }
  const entry = DB.trash[idx];
  if(entry.type==='project'){
    DB.projects.push(entry.payload);
    (entry.relatedTasks||[]).forEach(t=>DB.tasks.push(t));
  }else if(entry.type==='task'){
    DB.tasks.push(entry.payload);
  }
  DB.trash.splice(idx,1);
  logAction('กู้คืนจากถังขยะ', entry.type==='project'?`โครงการ "${entry.payload.name}"`:`งานย่อย "${entry.payload.name}"`);
  saveDB(); render();
  showToast('กู้คืนเรียบร้อย');
}
function permanentlyDeleteTrashItem(trashId){
  if(!confirm('ลบถาวร ไม่สามารถกู้คืนได้อีก ยืนยันหรือไม่?')) return;
  const entry=(DB.trash||[]).find(x=>x.id===trashId);
  DB.trash = (DB.trash||[]).filter(x=>x.id!==trashId);
  if(entry) logAction('ลบถาวร', entry.type==='project'?`โครงการ "${entry.payload.name}"`:`งานย่อย "${entry.payload.name}"`);
  saveDB(); render();
  showToast('ลบถาวรเรียบร้อย');
}
function moveProjectPriority(id, dir){
  const p=getProject(id); if(!p) return;
  const siblings = DB.projects.filter(x=>x.priority===p.priority && x.year===p.year).sort((a,b)=>a.sortOrder-b.sortOrder);
  const idx=siblings.findIndex(x=>x.id===id);
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=siblings.length) return;
  const tmp=siblings[idx].sortOrder; siblings[idx].sortOrder=siblings[swapIdx].sortOrder; siblings[swapIdx].sortOrder=tmp;
  saveDB(); render();
}

function confirmMoveProjects(){

  if(!targetYear){ showToast('กรุณาเลือกปีงบปลายทาง'); return; }

    const maxSort=Math.max(0,...DB.projects.filter(p=>p.priority===src.priority && p.year===targetYear).map(p=>p.sortOrder||0));
    DB.projects.push({
      id:uid('proj'), year:targetYear, name:src.name, categoryId:src.categoryId, ownerPersonId:src.ownerPersonId,

      attachments:[], disbRequestDate:'', disbCompleteDate:'', disbAmount:0, disbNote:'', sortOrder:maxSort+1, createdAt:new Date().toISOString()
    });
    if(removeSource){
      DB.projects = DB.projects.filter(p=>p.id!==pid);
      DB.tasks = DB.tasks.filter(t=>t.projectId!==pid);
    }

function viewKanban(){
  const pids = new Set(yearProjects().map(p=>p.id));
  const tasks = DB.tasks.filter(t=>pids.has(t.projectId));
  const cols = STATUS_LIST.filter(s=>s.id!=='cancelled');
  return `
  <div class="kanban">
    ${cols.map(col=>{
      const items=tasks.filter(t=>t.status===col.id);
      return `<div class="kanban-col" data-status="${col.id}" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="handleDrop(event,'${col.id}')">
        <div class="kanban-col-head"><span class="kanban-col-title">${col.label}</span><span class="kanban-count">${items.length}</span></div>
        ${items.map(t=>{
          const proj=getProject(t.projectId);
          return `<div class="kanban-card" draggable="true" ondragstart="handleDragStart(event,'${t.id}')" onclick="openTaskForm('${t.id}')" style="border-left-color:${statusObj(t.status).color}">
            <div class="kc-title">${escapeHtml(t.name)}</div>
            <div class="small-muted" style="margin-bottom:6px;">${escapeHtml(proj?proj.name:'')}</div>
            <div class="kc-meta"><span>👤 ${escapeHtml(getPersonName(t.assigneeId))}</span><span>${fmtDateShort(t.dueDate)}</span></div>
          </div>`;
        }).join('') || '<div class="small-muted" style="padding:10px 4px;">ไม่มีงาน</div>'}
      </div>`;
    }).join('')}
  </div>`;
}
let dragTaskId=null;
function handleDragStart(e,taskId){ dragTaskId=taskId; }
function handleDrop(e,status){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  const t=DB.tasks.find(x=>x.id===dragTaskId); if(!t) return;
  t.status=status; saveDB();
  document.getElementById('contentArea').innerHTML=viewKanban();
  refreshBackground();
}

function timeElapsedPercent(p){
  if(!p.startDate || !p.endDate) return null;
  const s=new Date(p.startDate+'T00:00:00'), e=new Date(p.endDate+'T00:00:00');
  const now=new Date(); now.setHours(0,0,0,0);
  if(isNaN(s)||isNaN(e)||e<=s) return null;
  if(now<=s) return 0;
  if(now>=e) return 100;
  return Math.round((now-s)/(e-s)*100);
}

function budgetBurnRateForecast(){
  const y = DB.currentYear;
  const fyStartCE = y-543-1, fyEndCE=y-543;
  const fyStart = new Date(fyStartCE,9,1), fyEnd = new Date(fyEndCE,8,30);
  const today = new Date(); today.setHours(0,0,0,0);
  const totalFYDays = Math.round((fyEnd-fyStart)/86400000)+1;
  let daysElapsed = Math.round((today-fyStart)/86400000)+1;
  daysElapsed = Math.max(0, Math.min(daysElapsed, totalFYDays));
  const projs = yearProjects();
  const total = projs.reduce((s,p)=>s+(Number(p.budgetAmount)||0),0);
  const disb = projs.reduce((s,p)=>s+(Number(p.disbAmount)||0),0);
  if(daysElapsed<=0 || total<=0) return null;
  const dailyRate = disb/daysElapsed;
  const projectedFinal = dailyRate*totalFYDays;
  const projectedPct = Math.min(999, Math.round(projectedFinal/total*100));
  const onTrack = projectedPct >= 95;
  return {daysElapsed, totalFYDays, dailyRate, projectedFinal, projectedPct, onTrack, total, disb};
}

function copySelectedBaseProjects(){
  if(!UI.baseEditSelected.size){ showToast('กรุณาเลือกอย่างน้อย 1 โครงการ'); return; }
  let count=0;
  UI.baseEditSelected.forEach(pid=>{
    const src=getProject(pid); if(!src) return;
    const maxSort=Math.max(0,...DB.projects.filter(p=>p.priority===src.priority && p.year===DB.currentYear).map(p=>p.sortOrder||0));
    DB.projects.push({
      id:uid('proj'), year:DB.currentYear, name:src.name, categoryId:src.categoryId, ownerPersonId:src.ownerPersonId,
      priority:src.priority, status:'notstarted', startDate:'', endDate:'', budgetAmount:src.budgetAmount, budgetType:src.budgetType,
      budgetSource:src.budgetSource, target:src.target||'', indicator:src.indicator||'', description:src.description||'',
      attachments:[], disbRequestDate:'', disbCompleteDate:'', disbAmount:0, disbNote:'', sortOrder:maxSort+1, createdAt:new Date().toISOString()
    });
    count++;
  });
  saveDB();
  UI.baseEditSelected.clear();
  logAction('คัดลอกโครงการจากปีฐาน', `${count} โครงการ มาปีงบ ${DB.currentYear}`);

  wireGlobalEvents();
}
function saveBulkProjectEdits(){
  const rows = document.querySelectorAll('#contentArea tr[data-pid]');
  let n=0;
  rows.forEach(row=>{
    const pid=row.dataset.pid; const p=getProject(pid); if(!p) return;
    const nameVal=row.querySelector('.be-name').value.trim();
    p.name = nameVal || p.name;
    p.target = row.querySelector('.be-target').value;
    p.categoryId = row.querySelector('.be-cat').value;
    p.ownerPersonId = row.querySelector('.be-owner').value;
    p.startDate = row.querySelector('.be-start').value;
    p.endDate = row.querySelector('.be-end').value;
    p.budgetAmount = Number(row.querySelector('.be-budget').value)||0;
    p.budgetType = row.querySelector('.be-btype').value;
    p.budgetSource = row.querySelector('.be-bsource').value;
    p.status = row.querySelector('.be-status').value;
    n++;
  });
  logAction('แก้ไขโครงการแบบกลุ่ม', `${n} โครงการ ปีงบ ${DB.currentYear}`);
  saveDB();
  showToast('บันทึกการแก้ไขทั้งหมดเรียบร้อย');

  wireGlobalEvents();
}

/* ---- Excel export via SheetJS ---- */
function buildProjectsAOA(year){
  const projs = DB.projects.filter(p=>p.year===year).slice().sort((a,b)=> (a.priority===b.priority? a.sortOrder-b.sortOrder : ({high:0,mid:1,low:2}[a.priority]-{high:0,mid:1,low:2}[b.priority])));
  const aoa=[]; const merges=[];
  aoa.push([`แผนปฏิบัติงานด้านสาธารณสุข ปีงบประมาณ พ.ศ. ${year} จังหวัดสมุทรปราการ`,'','','','','','','']);
  merges.push({s:{r:0,c:0},e:{r:0,c:7}});
  aoa.push(['โครงการตามนโยบายกระทรวงสาธารณสุขและแผนยุทธศาสตร์ที่เกี่ยวข้อง','','','หน่วยงาน :',DB.meta.group,'','','']);
  merges.push({s:{r:1,c:0},e:{r:1,c:2}});
  merges.push({s:{r:1,c:4},e:{r:1,c:7}});
  aoa.push(['ลำดับ','โครงการ/กิจกรรม','เป้าหมาย/หน่วยนับ','ระยะเวลาดำเนินการ','รายละเอียดการใช้จ่ายเงิน','แหล่งงบประมาณ','ตัวชี้วัดความสำเร็จ','ผู้รับผิดชอบ']);
  let idx=0, totalBudget=0;
  const grouped = DB.categories.map(cat=>({cat, list: projs.filter(p=>p.categoryId===cat.id)})).filter(g=>g.list.length);
  const uncatList = projs.filter(p=>!DB.categories.some(c=>c.id===p.categoryId));
  if(uncatList.length) grouped.push({cat:{name:'อื่นๆ'}, list:uncatList});
  grouped.forEach(g=>{
    const rIdx=aoa.length;
    aoa.push([g.cat.name,'','','','','','','']);
    merges.push({s:{r:rIdx,c:0},e:{r:rIdx,c:7}});
    g.list.forEach(p=>{
      idx++;
      const budgetText = p.budgetAmount>0 ? `${p.budgetType||''} จำนวน ${money(p.budgetAmount)} บาท` : '-';
      totalBudget += Number(p.budgetAmount)||0;
      aoa.push([idx, p.name, p.target||'-', `${fmtDateTH(p.startDate)} - ${fmtDateTH(p.endDate)}`, budgetText, p.budgetSource||'-', p.indicator||'-', getPersonName(p.ownerPersonId)]);
    });
  });
  const totalRow=aoa.length;
  aoa.push(['','','','','รวมทั้งแผนงาน/โครงการ', money(totalBudget)+' บาท','','']);
  merges.push({s:{r:totalRow,c:0},e:{r:totalRow,c:3}});
  merges.push({s:{r:totalRow,c:5},e:{r:totalRow,c:7}});
  const colWidths=[6,42,26,20,32,22,32,22];
  return {aoa, merges, colWidths};
}
function exportProjectsExcel(year){
  if(typeof XLSX==='undefined'){ showToast('⚠️ โหลดไลบรารี Excel ไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่'); return; }
  const {aoa, merges, colWidths} = buildProjectsAOA(year);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = merges;
  ws['!cols'] = colWidths.map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'แผนงานโครงการ');
  XLSX.writeFile(wb, `แผนงานโครงการ_ปีงบ${year}.xlsx`);
  showToast('ส่งออกไฟล์ Excel เรียบร้อย');
}

/* ---- "สรุปงบประมาณตามแหล่งที่มา" export — mirrors the Sheet "สรุป" layout of the uploaded template exactly ---- */
function sourceColumnInfo(source){
  // Maps our 6 app budget-source labels back onto the template's 5 physical columns + remark note,
  // the same way the original file buckets "กองทุนภูมิปัญญา" / "สนง.เขตสุขภาพที่ 6" under "อื่นๆ" with a remark.
  switch(source){
    case 'เงินบำรุง': return {col:0, remark:''};
    case 'เงินงบประมาณ': return {col:1, remark:''};
    case 'งบ UC': return {col:2, remark:''};
    case 'งบกองทุนส่งเสริมภูมิปัญญา': return {col:4, remark:'กองทุนภูมิปัญญา'};
    case 'งบสำนักงานเขตสุขภาพที่ 6': return {col:4, remark:'สนง.เขตสุขภาพที่ 6'};
    default: return {col:4, remark:''}; // 'อื่นๆ' / unrecognized
  }
}

  const projs = DB.projects.filter(p=>p.year===year).slice().sort((a,b)=> (a.priority===b.priority? a.sortOrder-b.sortOrder : ({high:0,mid:1,low:2}[a.priority]-{high:0,mid:1,low:2}[b.priority])));
  const aoa=[]; const merges=[];
  aoa.push([`สรุปโครงการ งบประมาณ และแหล่งงบประมาณ ตามแผนปฏิบัติการด้านสาธารณสุข ปีงบประมาณ พ.ศ. ${year}`]);
  merges.push({s:{r:0,c:0},e:{r:0,c:12}});
  aoa.push([`${DB.meta.group} ${DB.meta.org}`]);
  merges.push({s:{r:1,c:0},e:{r:1,c:12}});
  aoa.push([]);
  const headRow1 = aoa.length;
  aoa.push(['ลำดับ','โครงการ','แหล่งงบประมาณ','','','','','วงเงินทั้งโครงการ (บาท)','ความต้องการการใช้จ่ายเงิน','','','ร้อยละของการเบิกจ่าย','หมายเหตุ']);
  const headRow2 = aoa.length;
  aoa.push(['','','เงินบำรุง (บาท)','เงินงบประมาณ (บาท)','งบ UC (บาท)','กองทุนตำบล (บาท)','อื่นๆ (บาท)','','ขออนุมัติ (บาท)','ใช้ไป (บาท)','คงเหลือ (บาท)','','']);
  merges.push({s:{r:headRow1,c:0},e:{r:headRow2,c:0}}); // ลำดับ
  merges.push({s:{r:headRow1,c:1},e:{r:headRow2,c:1}}); // โครงการ
  merges.push({s:{r:headRow1,c:2},e:{r:headRow1,c:6}}); // แหล่งงบประมาณ span
  merges.push({s:{r:headRow1,c:7},e:{r:headRow2,c:7}}); // วงเงินทั้งโครงการ
  merges.push({s:{r:headRow1,c:8},e:{r:headRow1,c:10}}); // ความต้องการการใช้จ่ายเงิน span
  merges.push({s:{r:headRow1,c:11},e:{r:headRow2,c:11}}); // ร้อยละของการเบิกจ่าย
  merges.push({s:{r:headRow1,c:12},e:{r:headRow2,c:12}}); // หมายเหตุ

  let idx=0;
  const colSums=[0,0,0,0,0]; let grandTotal=0;
  const grouped = DB.categories.map((cat,ci)=>({cat, list: projs.filter(p=>p.categoryId===cat.id)})).filter(g=>g.list.length);
  const uncatList = projs.filter(p=>!DB.categories.some(c=>c.id===p.categoryId));
  if(uncatList.length) grouped.push({cat:{name:'อื่นๆ'}, list:uncatList});

  grouped.forEach((g,gi)=>{
    const sectionTotal = g.list.reduce((s,p)=>s+(Number(p.budgetAmount)||0),0);
    const rIdx=aoa.length;
    aoa.push([`ส่วนที่ ${gi+1}`, g.cat.name, '','','','','', sectionTotal, '','','','','บาท']);
    merges.push({s:{r:rIdx,c:1},e:{r:rIdx,c:6}});
    g.list.forEach(p=>{
      idx++;
      const amounts=[0,0,0,0,0];
      const {col, remark} = sourceColumnInfo(p.budgetSource);
      amounts[col] = Number(p.budgetAmount)||0;
      colSums[col]+=amounts[col];
      grandTotal += Number(p.budgetAmount)||0;
      const disbAmt = Number(p.disbAmount)||0;
      const remain = disbRemaining(p);
      const pct = disbPercent(p);
      const fullRemark = [remark, p.disbNote].filter(Boolean).join(' | ');
      aoa.push([idx, p.name, amounts[0]||'', amounts[1]||'', amounts[2]||'', amounts[3]||'', amounts[4]||'', p.budgetAmount||0, p.budgetAmount||0, disbAmt||'', remain, pct?pct+'%':'', fullRemark]);
    });
  });
  const totalRow=aoa.length;
  const totalDisb = projs.reduce((s,p)=>s+(Number(p.disbAmount)||0),0);
  const totalRemain = grandTotal - totalDisb;
  const totalPct = grandTotal>0? Math.round(totalDisb/grandTotal*100)+'%' : '';
  aoa.push(['งบประมาณทั้งหมด','', colSums[0], colSums[1], colSums[2], colSums[3], colSums[4], grandTotal, grandTotal, totalDisb||'', totalRemain, totalPct, 'บาท']);
  const colWidths=[7,40,13,14,11,13,11,15,12,10,12,12,20];
  return {aoa, merges, colWidths};
}
function exportBudgetSummaryExcel(year){
  if(typeof XLSX==='undefined'){ showToast('⚠️ โหลดไลบรารี Excel ไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่'); return; }
  const {aoa, merges, colWidths} = buildBudgetSummaryAOA(year);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = merges;
  ws['!cols'] = colWidths.map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'สรุป');
  XLSX.writeFile(wb, `สรุปงบประมาณ_ปีงบ${year}.xlsx`);
  showToast('ส่งออกไฟล์สรุปงบประมาณ (รูปแบบเดียวกับไฟล์ต้นฉบับ) เรียบร้อย');
}

function confirmAddRateItem(){
  const rateId = document.getElementById('rateItemSelect').value;

  const people = Number(document.getElementById('rateItemPeople').value)||1;
  const days = Number(document.getElementById('rateItemDays').value)||1;
  UI.expensePlan.items.push({id:uid('epi'), name:rate.name, unit:rate.unit, people, days, rate:rate.rate, note:''});
  closeModal();
  document.getElementById('contentArea').innerHTML = viewExpensePlanner();
  wireGlobalEvents();

function addCustomExpenseRow(){
  UI.expensePlan.items.push({id:uid('epi'), name:'', unit:'บาท', people:1, days:1, rate:0, note:''});

  wireGlobalEvents();

function updateExpenseItem(idx, field, value){
  const it = UI.expensePlan.items[idx]; if(!it) return;
  it[field] = (field==='people'||field==='days'||field==='rate') ? Number(value)||0 : value;
  // update only the affected row's subtotal + footer total, without full re-render (keeps focus while typing)
  const row = document.querySelector(`#contentArea tr[data-idx="${idx}"]`);
  if(row){ const cell = row.children[5]; if(cell) cell.textContent = money(expenseItemSubtotal(it)); }
  const totalCells = document.querySelectorAll('#contentArea .card-pad div[style*="font-size:22px"]');
  if(totalCells[0]) totalCells[0].textContent = money(expensePlanTotal())+' บาท';
  const footTotal = document.querySelector('#contentArea tfoot td[style*="font-size:15px"]');
  if(footTotal) footTotal.textContent = money(expensePlanTotal());
}
function removeExpenseItem(idx){
  UI.expensePlan.items.splice(idx,1);

function uploadExpensePlanToProject(){
  const ep = UI.expensePlan;
  if(!ep.items.length){ showToast('ยังไม่มีรายการค่าใช้จ่าย'); return; }

  if(ep.targetProjectId){
    const p = getProject(ep.targetProjectId); if(!p){ showToast('ไม่พบโครงการปลายทาง'); return; }
    p.expenseItems = ep.items.map(it=>({...it}));
    p.budgetAmount = total;
    logAction('อัพโหลดรายละเอียดค่าใช้จ่าย', `เข้าโครงการ "${p.name}" รวม ${money(total)} บาท (${ep.items.length} รายการ)`);
    saveDB();
    showToast('อัพโหลดรายละเอียดค่าใช้จ่ายเข้าโครงการเรียบร้อย');
    DB.currentYear = p.year; saveDB();
    UI.route='projects'; render();
    openProjectDetail(p.id);

    if(!name){ showToast('กรุณากรอกชื่อโครงการใหม่'); return; }
    const maxSort = Math.max(0,...DB.projects.filter(p=>p.priority==='mid' && p.year===ep.year).map(p=>p.sortOrder||0));
    const newProj = {
      id:uid('proj'), year:ep.year, name, categoryId:DB.categories[0]?.id||'', ownerPersonId:DB.personnel[0]?.id||'',
      priority:'mid', status:'notstarted', startDate:'', endDate:'', budgetAmount:total, budgetType:DB.budgetTypes[0]||'',
      budgetSource:DB.budgetSources[0]||'', target:'', indicator:'', description:'จัดทำรายละเอียดค่าใช้จ่ายจากหน้า "รายละเอียดค่าใช้จ่าย" อ้างอิงระเบียบ สสจ.สป.',
      attachments:[], disbRequestDate:'', disbCompleteDate:'', disbAmount:0, disbNote:'',
      expenseItems: ep.items.map(it=>({...it})), sortOrder:maxSort+1, createdAt:new Date().toISOString()
    };
    DB.projects.push(newProj);
    logAction('สร้างโครงการจากรายละเอียดค่าใช้จ่าย', `"${name}" รวม ${money(total)} บาท`);
    saveDB();
    showToast('สร้างโครงการใหม่พร้อมรายละเอียดค่าใช้จ่ายเรียบร้อย');
    DB.currentYear = ep.year; saveDB();
    UI.route='projects'; render();
    openProjectDetail(newProj.id);
  }
  UI.expensePlan = { year: DB.currentYear, targetProjectId:'', newProjectName:'', items:[] };
}

    ${kpiCard('🟡','ระดับปานกลาง', mid, 'คะแนน 8-14')}

      <tbody>
        ${all.length? all.map(({project,risk})=>{
          const score=riskScore(risk); const lvl=riskLevel(score);
          const st = RISK_STATUS.find(s=>s.id===risk.status)||RISK_STATUS[0];
          return `<tr class="tbl-row" onclick="openProjectDetail('${project.id}')">
            <td style="max-width:200px;">${escapeHtml(project.name)}</td>
            <td style="font-weight:600;max-width:200px;">${escapeHtml(risk.name)}</td>

            <td style="text-align:center;">${risk.impact}/5</td>
            <td style="text-align:center;font-weight:700;">${score}</td>
            <td><span class="badge ${lvl.cls}">${lvl.label}</span></td>
            <td class="small-muted">${st.label}</td>
            <td class="small-muted" style="max-width:220px;">${escapeHtml(risk.mitigation)||'-'}</td>
          </tr>`;
        }).join('') : `<tr><td colspan="8"><div class="empty-state"><div class="ic">✅</div>ยังไม่มีการบันทึกความเสี่ยงในปีงบนี้<br><span class="small-muted">เพิ่มได้จากหน้ารายละเอียดโครงการแต่ละโครงการ</span></div></td></tr>`}
      </tbody>
    </table>
    </div>
  </div>
  <p class="small-muted" style="margin-top:10px;">* คะแนนความเสี่ยง = โอกาสเกิด × ผลกระทบ (1-5 คูณกัน ได้ 1-25) · 15 ขึ้นไป = สูงมาก, 8-14 = ปานกลาง, ต่ำกว่า 8 = ต่ำ</p>
  `;
}

/* =========================================================================

   ========================================================================= */
function computeHeatmapData(){
  const y = DB.currentYear;
  const fyStartCE = y-543-1, fyEndCE=y-543;
  const projs = yearProjects();
  const pids = new Set(projs.map(p=>p.id));
  const tasksInYear = DB.tasks.filter(t=>pids.has(t.projectId));
  const data = {};
  DB.personnel.forEach(p=>{ data[p.id] = Array(12).fill(0); });
  function monthCellRange(i){
    const cellCE = fyStartCE + Math.floor((9+i)/12);
    const cellMonth = (9+i)%12;
    return {start:new Date(cellCE,cellMonth,1), end:new Date(cellCE,cellMonth+1,0)};
  }
  projs.forEach(p=>{
    if(!p.startDate || !p.endDate || !data[p.ownerPersonId]) return;
    const s = new Date(p.startDate+'T00:00:00'), e = new Date(p.endDate+'T00:00:00');
    for(let i=0;i<12;i++){
      const {start,end} = monthCellRange(i);
      if(s<=end && e>=start) data[p.ownerPersonId][i]++;
    }
  });
  tasksInYear.forEach(t=>{
    if(!t.dueDate || !data[t.assigneeId]) return;
    const d = new Date(t.dueDate+'T00:00:00');
    for(let i=0;i<12;i++){
      const {start,end} = monthCellRange(i);
      if(d>=start && d<=end){ data[t.assigneeId][i]++; break; }
    }
  });
  return data;
}
function heatColor(n){
  if(n<=0) return '#F5F8F6';
  if(n===1) return '#DCEFE2';
  if(n===2) return '#AEDFC0';
  if(n===3) return '#F7DDA0';
  if(n===4) return '#F0B25E';
  return '#E8746B';
}

function addFY(){ const v=Number(document.getElementById('newFY').value); if(!v) return; if(!DB.fiscalYears.includes(v)){ DB.fiscalYears.push(v); saveDB(); render(); } }

function addCategory(){ const v=document.getElementById('newCat').value.trim(); if(!v) return; DB.categories.push({id:uid('cat'),name:v,color:'#'+Math.floor(Math.random()*16777215).toString(16)}); saveDB(); render(); }

function removeListItem(listName, idx){ DB[listName].splice(idx,1); saveDB(); render(); }
function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='WorkPeopleOps_backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('ส่งออกไฟล์สำรองเรียบร้อย');
}

function openModal(title, bodyHtml, footerHtml, wide){
  closeModal();
  const overlay=document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='modalOverlay';
  overlay.innerHTML=`<div class="modal ${wide?'modal-wide':''}">
    <div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot">${footerHtml}</div>
  </div>`;
  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) closeModal(); });

}

function wireGlobalEvents(){
  const fy=document.getElementById('fySelect');
  if(fy) fy.addEventListener('change', e=>{ DB.currentYear=Number(e.target.value); saveDB(); render(); });
  const qa=document.getElementById('btnQuickAddProject');
  if(qa) qa.addEventListener('click', ()=>openProjectForm());

  const gs=document.getElementById('globalSearch');
  if(gs){
    gs.addEventListener('input', e=>{
      const panel=document.getElementById('globalSearchResults');
      const q=e.target.value;
      if(!q.trim()){ panel.style.display='none'; return; }
      panel.innerHTML = doGlobalSearch(q);
      panel.style.display='block';
    });
    gs.addEventListener('focus', e=>{ if(e.target.value.trim()){ document.getElementById('globalSearchResults').style.display='block'; } });
  }
  if(!window.__gsDocListenerAdded){
    window.__gsDocListenerAdded = true;
    document.addEventListener('click', function(e){
      const panel=document.getElementById('globalSearchResults');
      const inp=document.getElementById('globalSearch');
      if(panel && inp && !panel.contains(e.target) && e.target!==inp){ panel.style.display='none'; }
    });
  }

  document.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const grp = el.dataset.group;
      if(grp && groupKeyOfRoute(UI.route)===grp){ return; } // already viewing this section, keep current tab
      UI.route=el.dataset.route; UI.personDetailId=null; render();

    el.addEventListener('click', ()=>{ UI.route=el.dataset.route; UI.personDetailId=null; render(); });

    const ept=document.getElementById('ep_target');
    if(ept) ept.addEventListener('change', e=>{ UI.expensePlan.targetProjectId=e.target.value; document.getElementById('contentArea').innerHTML=viewExpensePlanner(); wireGlobalEvents(); });
    const epn=document.getElementById('ep_newname');
    if(epn) epn.addEventListener('input', e=>{ UI.expensePlan.newProjectName=e.target.value; });
  }
}
function refreshBackground(){
  // re-render current list-type views quietly to keep counts fresh when modal stays open
  if(!document.getElementById('modalOverlay')){
    document.getElementById('contentArea').innerHTML = renderRoute();
    wireGlobalEvents(); afterRenderHook();
  }
}
function handleImportJSON(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data.projects || !data.personnel){ showToast('ไฟล์ไม่ถูกต้อง'); return; }
      if(confirm('นำเข้าข้อมูลนี้จะแทนที่ข้อมูลปัจจุบันทั้งหมด ยืนยันหรือไม่?')){
        DB=data; saveDB(); render(); showToast('นำเข้าข้อมูลเรียบร้อย');
      }
    }catch(err){ showToast('อ่านไฟล์ไม่สำเร็จ: ไฟล์ไม่ใช่ JSON ที่ถูกต้อง'); }
  };
  reader.readAsText(file);
}

let chartRefs=[];
function destroyCharts(){ chartRefs.forEach(c=>c.destroy()); chartRefs=[]; }
function afterRenderHook(){
  destroyCharts();
  if(UI.route==='dashboard') drawDashboardCharts();
  if(UI.route==='budget') drawBudgetCharts();
  if(UI.route==='performance') drawPerfChart();
  if(UI.route==='yearcompare') drawYearCompareCharts();
  if(UI.route==='strategicalign') drawStrategicChart();
}
const CHART_GREEN_PALETTE=['#146C43','#2D6FA5','#C89B3C','#7C4FA0','#D64545','#22A05F','#4FC087','#8A9A92','#3B7BB0','#9C6B0B'];

function drawDashboardCharts(){
  const projs=yearProjects();
  const statusCounts=STATUS_LIST.map(s=>projs.filter(p=>p.status===s.id).length);
  const elS=document.getElementById('chartStatus');
  if(elS) chartRefs.push(new Chart(elS,{type:'doughnut', data:{labels:STATUS_LIST.map(s=>s.label), datasets:[{data:statusCounts, backgroundColor:STATUS_LIST.map(s=>s.color), borderWidth:0}]}, options:{plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}}, cutout:'62%'}}));

  const bySource={};
  projs.forEach(p=>{ bySource[p.budgetSource||'ไม่ระบุ']=(bySource[p.budgetSource||'ไม่ระบุ']||0)+(Number(p.budgetAmount)||0); });
  const elB=document.getElementById('chartBudgetSource');
  if(elB) chartRefs.push(new Chart(elB,{type:'bar', data:{labels:Object.keys(bySource), datasets:[{data:Object.values(bySource), backgroundColor:CHART_GREEN_PALETTE}]}, options:{plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:10}}},y:{beginAtZero:true}}}}));

  const workload={};
  DB.personnel.forEach(p=>{ workload[p.name]=DB.tasks.filter(t=>t.assigneeId===p.id && projs.some(pr=>pr.id===t.projectId)).length; });
  const elW=document.getElementById('chartWorkload');
  if(elW) chartRefs.push(new Chart(elW,{type:'bar', data:{labels:Object.keys(workload), datasets:[{data:Object.values(workload), backgroundColor:'#22A05F'}]}, options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true, ticks:{stepSize:1}}}}}));
}
function drawBudgetCharts(){
  const d=window.__budgetData||{bySource:{},byType:{}};
  const elS=document.getElementById('chartBSource2');
  if(elS) chartRefs.push(new Chart(elS,{type:'pie', data:{labels:Object.keys(d.bySource), datasets:[{data:Object.values(d.bySource), backgroundColor:CHART_GREEN_PALETTE, borderWidth:0}]}, options:{plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}}}}));
  const elT=document.getElementById('chartBType2');
  if(elT) chartRefs.push(new Chart(elT,{type:'pie', data:{labels:Object.keys(d.byType), datasets:[{data:Object.values(d.byType), backgroundColor:CHART_GREEN_PALETTE.slice().reverse(), borderWidth:0}]}, options:{plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}}}}));
}
function drawPerfChart(){
  const el=document.getElementById('chartPerf'); if(!el) return;
  const labels=DB.personnel.map(p=>p.name);
  const totalT=DB.personnel.map(p=>DB.tasks.filter(t=>t.assigneeId===p.id).length);
  const doneT=DB.personnel.map(p=>DB.tasks.filter(t=>t.assigneeId===p.id && t.status==='done').length);
  chartRefs.push(new Chart(el,{type:'bar', data:{labels, datasets:[
    {label:'งานทั้งหมด', data:totalT, backgroundColor:'#CFE3D8'},
    {label:'เสร็จสิ้น', data:doneT, backgroundColor:'#1A8754'},
  ]}, options:{plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true, ticks:{stepSize:1}}}}}));
}

/* =========================================================================
   Init
   ========================================================================= */
loadDB();
render();
if(window.__versionMismatch){
  setTimeout(()=>{
    openModal('พบข้อมูลเก่าเวอร์ชันอื่นในเบราว์เซอร์นี้', `
      <p>ข้อมูลที่บันทึกไว้ในเบราว์เซอร์นี้เป็นเวอร์ชัน <b>${escapeHtml(window.__storedVersion||'-')}</b> แต่ไฟล์ที่เปิดอยู่ตอนนี้เป็นเวอร์ชัน <b>${APP_VERSION}</b></p>
      <p class="small-muted">ถ้าเพิ่งได้ไฟล์ใหม่มา (มีโครงการ/ฟีเจอร์เพิ่มเติม) แนะนำให้ล้างข้อมูลเพื่อโหลดชุดล่าสุด แต่ถ้าพี่จีเคยแก้ไขข้อมูลไว้ในเบราว์เซอร์นี้แล้ว การล้างจะทำให้ข้อมูลที่แก้ไขหายไป — แนะนำกด "ส่งออกสำรอง" ก่อนทุกครั้ง</p>
    `, `
      <button class="btn btn-ghost" onclick="closeModal()">ใช้ข้อมูลเดิมต่อไป</button>
      <button class="btn btn-ghost" onclick="exportJSON()">⬇️ ส่งออกสำรองก่อน</button>
      <button class="btn btn-primary" onclick="resetAllData();closeModal();">♻️ ล้างข้อมูล &amp; โหลดชุดใหม่</button>
    `);
  }, 400);
}
