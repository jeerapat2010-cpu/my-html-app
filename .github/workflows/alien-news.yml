# ดึงหัวข้อข่าวอวกาศ/UAP ทุก 6 ชม. → data/alien_news.json (แอป Alien Defense อ่านผ่าน raw.githubusercontent.com)
name: Alien news feed
on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: alien-news
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/alien_news.py
      - run: |
          git config user.name "alien-news-bot"; git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "chore: update alien news [skip ci]" && git pull --rebase -q && git push)
