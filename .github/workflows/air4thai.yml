# ดึง PM2.5 วัดจริงจาก Air4Thai ทุกครึ่งชั่วโมง → data/air4thai.json (แอปอ่านผ่าน raw.githubusercontent.com)
name: Air4Thai PM2.5 + TMD quake
on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: air4thai
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/air4thai.py
      - run: python3 scripts/tmdquake.py
      - run: |
          git config user.name "air4thai-bot"; git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "chore: update Air4Thai/TMD data [skip ci]" && git pull --rebase -q && git push)
