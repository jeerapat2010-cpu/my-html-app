name: GA visitor stats
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      GA_SA_KEY: ${{ secrets.GA_SA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ env.GA_SA_KEY != '' }}
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - if: ${{ env.GA_SA_KEY != '' }}
        run: pip install google-analytics-data google-auth && python scripts/ga_stats.py
      - if: ${{ env.GA_SA_KEY != '' }}
        run: |
          git config user.name "ga-stats-bot"; git config user.email "actions@users.noreply.github.com"
          git add stats.json; git diff --cached --quiet || (git commit -m "chore: update GA stats [skip ci]" && git pull --rebase -q && git push)
