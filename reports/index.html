<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คลังรายงานเดือน กวป. แพทย์แผนไทย</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#0f766e;--ink:#13232b;--muted:#5d6b75;--line:#dfe7ea;--bg:#f4f7f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",Tahoma,sans-serif}
main{max-width:760px;margin:auto;padding:28px 16px}
h1{font-size:22px;margin:0 0 4px;color:var(--teal)}p{color:var(--muted);margin:0 0 18px}
a.item{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--ink)}
a.item:hover{border-color:var(--teal)}a.item b{font-size:16px}a.item span{color:var(--muted);font-size:13px}
.latest{background:var(--teal);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px;margin-left:8px}
.back{display:inline-block;margin-bottom:14px;color:var(--teal);text-decoration:none}
</style>
</head>
<body><main>
<a class="back" href="../index.html">← กลับ TTM Digital Portal</a>
<h1>คลังรายงานเดือน กวป. งานแพทย์แผนไทย</h1>
<p>สำนักงานสาธารณสุขจังหวัดสมุทรปราการ • รายงานทุกเดือนที่อัปจากระบบสร้างรายงาน</p>
<div id="list">กำลังโหลด…</div>
</main>
<script>
fetch('manifest.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(L=>{
  document.getElementById('list').innerHTML = L.length ? L.map((x,i)=>`<a class="item" href="${x.file}"><div><b>${x.label}</b>${i===0?'<span class="latest">ล่าสุด</span>':''}</div><span>อัปเมื่อ ${new Date(x.updated).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})} →</span></a>`).join('') : 'ยังไม่มีรายงาน';
}).catch(()=>{ document.getElementById('list').textContent='โหลดรายการไม่ได้'; });
</script>
</body></html>
