<style>
:root{--h1:#06291f;--h2:#0b4d39;--h3:#0f6b4f;--glow:rgba(20,163,127,.55);--soft:#e2f5ec;--soft2:#c9ecdc;--bg:#f3f6f4;--card:#ffffff;--ink:#10231b;--ink2:#3b4d45;--muted:#6b7c74;--line:#e1e9e4;--brand:#0f6b4f;--brand2:#14a37f;--gold:#c99a2e;--ok:#15803d;--okbg:#e7f6ec;--near:#b45309;--nearbg:#fff4e0;--bad:#b91c1c;--badbg:#fdeaea;--info:#1d4ed8;--infobg:#e8efff;--shadow:0 10px 30px rgba(16,35,27,.08);--r:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",Tahoma,sans-serif;font-size:15px;line-height:1.6}

.wrap{max-width:1320px;margin:0 auto;padding:0 20px}

.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(1200px 500px at 85% -10%,rgba(255,215,120,.28),transparent 60%),radial-gradient(900px 500px at -10% 120%,var(--glow),transparent 60%),linear-gradient(135deg,var(--h1) 0%,var(--h2) 45%,var(--h3) 100%);padding:34px 0 120px}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(180deg,#000,transparent)}

.tile.bad .meter i{background:linear-gradient(90deg,#f87171,#b91c1c)}.tile.near .meter i{background:linear-gradient(90deg,#fbbf24,#d97706)}

    peers:(S.f?x.dists:x.provs).map(function(d){return {name:d.name,v:pc(d.a,d.b),a:d.a,b:d.b};}).filter(function(d){return d.v!=null&&d.b>0;}).sort(function(a,b){return b.v-a.v;})}; }
function paModel(){ var S=scope(), x=K.OPD; if(!x) return null; var U=x.units; var res={};
  DIST.forEach(function(d){ var u=U.filter(function(z){return z.dist===d;}); var h=u.filter(function(z){return z.t==='H';}), p=u.filter(function(z){return z.t==='P';});
    var hb=sum(h,'b'),ha=sum(h,'a'),pb=sum(p,'b'),pa=sum(p,'a'); var hp=pc(ha,hb), pp=pc(pa,pb);

function ucModel(){ var S=scope(), x=K.UC; if(!x) return null; if(S.f){ var d=(x.dists||[]).filter(function(z){return z.name===S.f;})[0]; if(!d) return null; return {value:d.value,t12:d.t12,tNow:d.tNow,pNow:pc(d.value,d.tNow),p12:pc(d.value,d.t12)}; }

function rankOf(peers,name){ for(var i=0;i<peers.length;i++) if(peers[i].name===name) return i+1; return null; }

  if(r14&&r14.v!=null){ var rk=rankOf(r14.peers,f||PROV); var line='ตชว.14 ปฐมภูมิ '+P(r14.v)+' ('+cmp(r14.v,r14.crit,'เกณฑ์')+')'+(rk?' อันดับ '+rk+'/'+r14.peers.length+(f?' ของจังหวัด':' ของเขต 6'):''); (r14.v>=r14.crit?Sx:Wx).push(line+(r14.v<r14.crit?' — ต้องเพิ่มบริการอีก '+N(need(r14.me.a,r14.me.b,r14.crit))+' ครั้ง'+(LEFT?' (เฉลี่ย '+N(need(r14.me.a,r14.me.b,r14.crit)/Math.max(1,LEFT))+' ครั้ง/เดือน)':''):'')); if(r14.prov!=null&&f) (r14.v>=r14.prov?Sx:Wx).push('ตชว.14 '+cmp(r14.v,r14.prov,'ค่าจังหวัด')); }
  if(ro&&paMe){ (paMe.hp!=null&&paMe.hp>=15?Sx:Wx).push('PA ระดับ รพ. '+P(paMe.hp)+' ได้ '+(paMe.hs||'–')+' คะแนน'+(paMe.hp!=null&&paMe.hp<15?' — ต้องเพิ่มอีก '+N(paMe.hneed)+' ครั้ง':''));
    (paMe.pp!=null&&paMe.pp>=50?Sx:Wx).push('PA ระดับ สสอ. (รวม รพ.สต.) '+P(paMe.pp)+' ได้ '+(paMe.ps||'–')+' คะแนน'+(paMe.pp!=null&&paMe.pp<50?' — ต้องเพิ่มอีก '+N(paMe.pneed)+' ครั้ง':'')); }

  var pass=Sx.length, lead='<b>'+E(S.meLabel)+'</b> ณ '+E(META.date)+' (ปีงบ '+META.fy+' เดือนที่ '+META.fm+') มีประเด็นที่ทำได้ดี '+pass+' ประเด็น และประเด็นที่ต้องเร่งรัด '+Wx.length+' ประเด็น. ';

function unitEval(code,u0){ var r=[]; function add(k,label,x,crit){ if(!x||!(x.b>0)) return; var v=pc(x.a,x.b); r.push({k:k,label:label,v:v,crit:crit,a:x.a,b:x.b,ok:v>=crit,near:v>=crit*0.8&&v<crit,att:Math.min(1,v/crit)}); }

  if(K.PRIM&&t!=='H'){ var x=K.PRIM.units.filter(function(z){return z.code===code;})[0]; add('PRIM','ตชว.14 ปฐมภูมิ',x,K.PRIM.crit); }
  if(K.OPD&&t!=='C'){ var o=K.OPD.units.filter(function(z){return z.code===code;})[0]; add('OPD','PA ผู้ป่วยนอก (เกณฑ์ '+(t==='H'?15:50)+'%)',o,t==='H'?15:50); }
  if(K.IMC){ var m=K.IMC.units.filter(function(z){return z.code===code;})[0]; add('IMC','ตชว.26 IMC',m,K.IMC.crit); }
  var n=r.length; var score=n?Math.round(r.reduce(function(s,z){return s+z.att;},0)/n*100):null;
  var col=n===0?'x':(r.every(function(z){return z.ok;})?'g':(score<50?'r':'y'));
  return {rows:r,score:score,col:col,pass:r.filter(function(z){return z.ok;}).length,n:n}; }

  return L.map(function(u){ var e=unitEval(u.code,u); return {code:u.code,name:sn(u.name),dist:u.dist,t:u.t,e:e,ll:COORDS[u.code]||null}; }); }

  h+='<p class="note" id="mNote" style="margin-top:8px"></p></section>'; return h; }
