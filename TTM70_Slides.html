const $=s=>document.querySelector(s);let fails=0;
function b2u(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function open_(pin){
 if(!(window.crypto&&crypto.subtle))throw new Error('nosubtle');
 const d=b2u(B64),salt=d.slice(0,16),iv=d.slice(16,28),ct=d.slice(28);
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
 return new TextDecoder().decode(pt)}
function boot(html){document.open();document.write(html);document.close()}
async function tryPin(pin,auto){
 try{const h=await open_(pin);try{sessionStorage.setItem('ttm70',pin)}catch(e){}boot(h);return true}
 catch(e){if(e.message==='nosubtle'){$('#m').textContent='เบราว์เซอร์นี้ไม่รองรับ (ต้องเปิดผ่าน https)';return false}
  if(!auto){fails++;const b=$('.box');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('#m').textContent='รหัสผ่านไม่ถูกต้อง';$('#pw').value='';$('#go').disabled=true;setTimeout(()=>$('#go').disabled=false,Math.min(8000,fails*1000))}
  return false}}
$('#f').onsubmit=e=>{e.preventDefault();const v=$('#pw').value.trim();if(v){$('#m').textContent='กำลังตรวจสอบ…';tryPin(v,false)}};
try{const p=sessionStorage.getItem('ttm70');if(p)tryPin(p,true)}catch(e){}
})();
</script></body></html>
