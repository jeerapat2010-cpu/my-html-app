:root{--teal:#0F766E;--teal9:#0A4F4A;--teal2:#B5DDD8;--teal1:#EAF6F4;--ink:#13232B;--mut:#5B6B72;--line:#D9E3E1;--bg:#F4F9F8;--y68:#A9C4C0;--green:#2F9E5F;--coral:#E0533D;--amber:#F2A93B;--gold:#E9B44C}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:'Sarabun',sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:'Prompt','Sarabun',sans-serif}
.mut{color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#tn-btn{position:fixed;top:10px;right:10px;z-index:99990;display:flex;gap:6px;align-items:center;font:600 13px 'Prompt',sans-serif;color:#fff;background:rgba(10,79,74,.94);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.25);backdrop-filter:blur(6px)}
#tn-btn:hover{background:#0F766E}#tn-btn:focus-visible,.tn-i:focus-visible,#tn-x:focus-visible{outline:3px solid #F2A93B;outline-offset:2px}
#tn-panel{position:fixed;inset:0;z-index:99995;display:none;background:rgba(10,30,34,.55);backdrop-filter:blur(3px)}
#tn-panel.on{display:block}
#tn-card{position:absolute;top:0;right:0;bottom:0;width:min(400px,92vw);background:#fff;box-shadow:-10px 0 40px rgba(0,0,0,.3);overflow:auto;padding:18px 18px 28px;animation:tnin .25s ease}
@keyframes tnin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
#tn-card h3{font-size:15px;color:#0A4F4A;margin:2px 0 4px}#tn-card .sub{font-size:12px;color:#5B6B72;margin-bottom:12px}
.tn-i{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;text-decoration:none;color:#13232B;border:1px solid transparent;margin-bottom:3px}
.tn-i:hover{background:#EAF6F4;border-color:#B5DDD8}.tn-i.cur{background:#0F766E;color:#fff}
.tn-i .ic{width:34px;height:34px;border-radius:10px;background:#EAF6F4;display:grid;place-items:center;font-size:18px;flex:none}.tn-i.cur .ic{background:rgba(255,255,255,.2)}
.tn-i b{font:600 14px 'Prompt',sans-serif;display:block}.tn-i small{font-size:11.5px;opacity:.75}
.tn-tools{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}.tn-tools button{font:600 12.5px 'Prompt',sans-serif;border:1px solid #B5DDD8;background:#EAF6F4;color:#0A4F4A;border-radius:999px;padding:7px 12px;cursor:pointer}.tn-tools button:hover{background:#0F766E;color:#fff}
#tn-x{position:absolute;top:10px;right:12px;border:0;background:#EAF6F4;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
#tn-about{position:fixed;inset:0;z-index:99999;display:none;place-items:center;background:rgba(10,30,34,.6);padding:14px}#tn-about.on{display:grid}
#tn-about .box{background:#fff;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#tn-about h2{font-size:20px;color:#0A4F4A;margin-bottom:8px}#tn-about h4{font:600 14px 'Prompt',sans-serif;margin:14px 0 4px;color:#0F766E}#tn-about p,#tn-about li{font-size:13.5px;line-height:1.65}#tn-about ul{padding-left:18px}
#tn-about button{margin-top:14px;font:600 14px 'Prompt',sans-serif;background:#0F766E;color:#fff;border:0;border-radius:10px;padding:9px 20px;cursor:pointer}
#tn-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99999;background:#13232B;color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}#tn-toast.on{opacity:1}
.skip{position:fixed;left:8px;top:-60px;z-index:100000;background:#fff;padding:8px 14px;border-radius:8px}.skip:focus{top:8px}
@media print{#tn-btn,#tn-panel,#tn-about,#tn-toast{display:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(max-width:700px){#tn-btn{top:6px;right:6px;padding:6px 10px;font-size:15px;opacity:.92}#tn-btn span{display:none}header,h1{padding-right:34px}}

html,body{height:100%;overflow:hidden;background:#052725;color:#fff}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}#cv.dr{cursor:grabbing}
.pn{position:fixed;z-index:20;background:rgba(5,39,37,.86);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:18px}
#top{left:14px;top:12px;padding:12px 18px;max-width:min(420px,calc(100vw - 90px))}#top h1{font-size:1.15rem;line-height:1.25}#top p{font-size:.85rem;opacity:.8;margin-top:2px}
#met{left:14px;top:92px;padding:8px;display:flex;flex-direction:column;gap:4px;width:min(250px,calc(100vw - 28px))}
#met button{border:0;background:transparent;color:#fff;text-align:left;padding:8px 12px;border-radius:12px;font:600 .9rem 'Prompt';cursor:pointer}#met button:hover{background:rgba(255,255,255,.12)}#met button.on{background:var(--gold);color:#4a3200}
#mt{position:fixed;left:50%;transform:translateX(-50%);top:70px;z-index:19;font:800 clamp(1.1rem,2.6vw,1.9rem) 'Prompt';color:#E9B44C;text-shadow:0 2px 10px #052725,0 0 4px #052725;white-space:nowrap;pointer-events:none}#yr{left:50%;transform:translateX(-50%);top:12px;padding:6px;display:flex;gap:4px}#yr button{border:0;background:transparent;color:#fff;padding:7px 16px;border-radius:12px;font:700 .95rem 'Prompt';cursor:pointer}#yr button.on{background:#fff;color:var(--teal9)}#yr button:disabled{opacity:.3;cursor:default}
#ctl{left:50%;transform:translateX(-50%);bottom:14px;width:max-content;padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 20px)}#ctl button{border:0;background:#fff;color:var(--teal9);padding:9px 16px;border-radius:99px;font:600 .88rem 'Prompt';cursor:pointer}#ctl button.on{background:var(--gold);color:#4a3200}
#info{right:14px;bottom:80px;width:min(300px,calc(100vw - 28px));padding:14px 18px;display:none}#info.on{display:block}#info h2{font-size:1.2rem;color:var(--gold)}#info .r{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:.88rem}#info .r b{font-family:Prompt}
#sum{right:14px;top:56px;padding:12px 16px;width:min(250px,calc(100vw - 28px))}#sum .l{font-size:.78rem;opacity:.8}#sum .n{font:700 2rem/1.1 'Prompt'}#sum .d{font:600 .8rem 'Prompt'}
.lg{position:fixed;left:14px;bottom:76px;max-width:330px;line-height:1.75;z-index:20;font-size:.78rem;opacity:.85;background:rgba(5,39,37,.7);padding:6px 12px;border-radius:12px}.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin:0 4px 0 8px;vertical-align:-1px}
@media(max-width:760px){#sub{display:none}#mt{top:112px;font-size:1rem}#top{max-width:calc(100vw - 60px)}#yr{top:58px}#yr button{padding:5px 12px;font-size:.85rem}#met{top:auto;bottom:56px;flex-direction:row;flex-wrap:wrap;width:calc(100vw - 20px);left:10px;padding:5px;gap:2px}#met button{padding:5px 9px;font-size:.72rem}#sum{top:108px;right:10px;width:128px;padding:6px 10px}#sum .n{font-size:1.3rem}#sum .l{font-size:.68rem}.lg{display:none}#ctl{bottom:8px;flex-wrap:nowrap;gap:3px;padding:5px;width:calc(100vw - 20px);overflow-x:auto;justify-content:flex-start}#ctl button{padding:7px 10px;font-size:.72rem;white-space:nowrap}#info{bottom:150px;right:10px}#top h1{font-size:.9rem}#top{padding:7px 12px}}
</style></head><body>

 items.forEach(it=>{const r=it.r,P_=POLY[r.key],isSel=sel===r.key;const side=proj(0,0,0);

 /* threshold plane */
 const thrH=m.thr!=null?m.thr/m.max*HMAX:null;
 if(thrH!=null){poly3([[bb[0],bb[1]],[bb[2],bb[1]],[bb[2],bb[3]],[bb[0],bb[3]]],thrH,'rgba(233,180,76,.10)','rgba(233,180,76,.9)');const q=proj(bb[2],bb[1],thrH);g.fillStyle='#E9B44C';g.font="600 13px Prompt";g.textAlign='left';g.fillText(m.thrL,q[0]+6,q[1]-4)}
 /* bars */

 hits=[];
 objs.forEach(o=>{const parts=POLY[o.r.key],col=colOf(o.r),hh=Math.max(2,o.h);if(ghostOn&&o.gh>0&&yr!==m.yrs[0])ghostRing(parts,o.gh);prism(parts,hh,col,sel===o.r.key);

   g.font='600 '+(W<760?10:12)+'px Prompt';g.strokeText(m.s,lx,tp[1]-10-fs-2);g.fillStyle='#E7F5F2';g.fillText(m.s,lx,tp[1]-10-fs-2);

function anim(dt){const [t,gt]=tgt();R.forEach(r=>{cur[r.key]+=(t[r.key]-cur[r.key])*Math.min(1,dt*6);ghost[r.key]+=(gt[r.key]-ghost[r.key])*Math.min(1,dt*6)});

 yaw+=(tY-yaw)*Math.min(1,dt*8);pitch+=(tP-pitch)*Math.min(1,dt*8);zoom+=(tZ-zoom)*Math.min(1,dt*8)}
let last=performance.now();function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;anim(dt);draw();requestAnimationFrame(loop)}
/* interaction */
let drag=false,px=0,py=0,moved=0;
cv.addEventListener('pointerdown',e=>{drag=true;moved=0;px=e.clientX;py=e.clientY;cv.classList.add('dr');cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);tY+=dx*.008;yaw=tY;tP=clamp(tP+dy*.006,.15,1.45);pitch=tP});
cv.addEventListener('pointerup',e=>{drag=false;cv.classList.remove('dr');if(moved<6)pick(e.clientX,e.clientY)});
cv.addEventListener('wheel',e=>{e.preventDefault();tZ=clamp(tZ*(e.deltaY>0?.92:1.08),.55,2.6)},{passive:false});
let pinch=0;cv.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)tZ=clamp(tZ*d/pinch,.55,2.6);pinch=d}},{passive:true});cv.addEventListener('touchend',()=>pinch=0);
function pick(x,y){let best=null;for(let i=hits.length-1;i>=0;i--){if(hits[i].polys.some(pp=>inPoly(x,y,pp))){best=hits[i].k;break}}sel=best;showInfo()}

 rows.push(['ตัวชี้วัด 14',r.i14.p69.toFixed(2)+'%'],['มูลค่า UC',mb(r.uc.v69)+' ล้านบาท ('+r.uc.pct.toFixed(0)+'% เป้า)'],['ชดเชย สปสช.',r.rb.rate.toFixed(1)+'%'],['IMC',r.imc.pct.toFixed(2)+'%'],['Flagship',r.flag.ok+'/'+r.flag.tgt+' คน']);
 el.innerHTML=`<h2>${r.key==='เมืองสมุทรปราการ'?'เมืองสมุทรปราการ':r.short==='พระสมุทรฯ'?'พระสมุทรเจดีย์':r.short}</h2>`+rows.map(x=>`<div class="r"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')+`<div style="font-size:.74rem;opacity:.65;margin-top:6px">แตะที่ว่างเพื่อปิด</div>`;el.classList.add('on')}

 const y=document.getElementById('yr');y.innerHTML=[67,68,69].map(v=>`<button data-y="${v}" class="${v===yr?'on':''}" ${MET[mk].yrs.includes(v)?'':'disabled'}>ปี 25${v}</button>`).join('');y.querySelectorAll('button').forEach(b=>b.onclick=()=>{yr=+b.dataset.y;ui();showInfo()});
 const pv=m.prov(yr),py=m.yrs[m.yrs.indexOf(yr)-1];document.getElementById('sum').innerHTML=`<div class="l">รวมจังหวัด · ${m.n}</div><div class="n">${m.f(pv)}</div>${py!=null?`<div class="d ${pv>=m.prov(py)?'up':'dn'}">${pv>=m.prov(py)?'▲ +':'▼ '}${Math.abs(pv-m.prov(py)).toFixed(2)} จุด จากปี 25${py}</div>`:`<div class="d" style="opacity:.7">มีข้อมูลเฉพาะปี 2569</div>`}`;
 document.getElementById('mt').textContent=m.n+' · ปี 25'+yr;document.getElementById('sub').textContent=`ยกพื้นที่อำเภอจริงให้สูง-ต่ำตามผลงาน · ${m.n} ปี 25${yr} · ลากเพื่อหมุน เลื่อนล้อ/บีบนิ้วเพื่อซูม แตะอำเภอเพื่อดูรายละเอียด`;
 document.getElementById('lg').innerHTML=Object.keys(DC).map(k=>`<i style="background:${DC[k]}"></i>${R.find(r=>r.key===k).short}`).join('')+(m.thr!=null?`<br>ตัวเลข: <b style="color:#4CE08A">เขียว = ผ่านเกณฑ์</b> · <b style="color:#FF6B57">แดง = ไม่ผ่าน</b> · เส้นทอง = ระนาบเกณฑ์`:`<br>ตัวเลขสีขาว = ตัวชี้วัดนี้ไม่มีเกณฑ์รายอำเภอ`)}
