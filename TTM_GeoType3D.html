<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--ink:#0f2a24;--ink2:#41554e;--muted:#74867f;--line:#e2ebe7;--bg:#f4f8f6;--card:#fff;--brand:#0f6b4f;--brand2:#14a37f;--ok:#16a34a;--near:#eab308;--bad:#dc2626;--nil:#94a3b8;--blue:#2563eb}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"IBM Plex Sans Thai",Tahoma,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,.mitr{font-family:Mitr,"IBM Plex Sans Thai",sans-serif;font-weight:500;margin:0}
/* header */
header{background:#fff;display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#0ea5e9,#14a37f,#eab308) 1;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo i{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#14a37f,#0ea5e9);display:grid;place-items:center;color:#fff;font:600 22px Mitr,sans-serif;font-style:normal;box-shadow:0 4px 12px rgba(20,163,127,.35)}
.logo b{display:block;font:600 19px Mitr,sans-serif;letter-spacing:1.5px;line-height:1.1}
.logo small{display:block;font-size:10.5px;letter-spacing:1.2px;color:var(--muted)}
.sep{width:1px;align-self:stretch;background:var(--line)}
.seg{display:flex;align-items:center;gap:4px;background:#f1f5f3;padding:3px 4px;border-radius:12px}
.seg span.l{font-size:11.5px;color:var(--muted);padding:0 6px}
.seg button{border:0;background:transparent;font:500 12.5px inherit;font-family:inherit;padding:6px 11px;border-radius:9px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{border:0;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;color:#fff;background:#0f1f1b;padding:7px 14px;border-radius:99px;transition:.15s;border:2px solid transparent}
.pill:hover{transform:translateY(-1px)}
.pill.on{background:linear-gradient(135deg,#0f6b4f,#14a37f);box-shadow:0 4px 14px rgba(20,163,127,.45);border-color:#a7f3d0}
.asof{margin-left:auto;text-align:right;font-size:11.5px;color:var(--muted);line-height:1.35}
.asof b{color:var(--ink);font-weight:600}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
.kpi{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;min-width:0}
.kpi .t{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .n{font:500 24px Mitr,sans-serif;line-height:1.25}
.kpi .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.kpi.hl{background:linear-gradient(180deg,#fff,#f0fdf7);border-color:#bbf7d0}
/* body */
.main{flex:1;display:flex;min-height:0;position:relative}
aside{width:310px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:margin .2s}
aside.hide{margin-left:-310px}
.ah{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 4px}
.ah h2{font-size:18px}
.ah button{border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;width:30px;height:28px}
.fs{padding:6px 14px 10px;border-bottom:1px solid var(--line)}
.fs label{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin:8px 0 4px}
.fs select,.fs input[type=search]{width:100%;font:inherit;padding:8px 10px;border:1px solid #cfdad5;border-radius:10px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid #cfdad5;background:#fff;border-radius:99px;padding:4px 10px;font:500 12px inherit;font-family:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink2)}
.chip.on{border-color:var(--brand2);background:#ecfdf5;color:#065f46;font-weight:600}
.list{flex:1;overflow:auto;padding:4px 8px 10px}
.row{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.row:hover{background:#f1f8f5;border-color:#d5e8df}
.row .v{min-width:46px;text-align:center;font:600 12.5px Mitr,sans-serif;color:#fff;border-radius:8px;padding:3px 0}
.row b{display:block;font-size:12.5px;font-weight:600;line-height:1.25}
.row small{color:var(--muted);font-size:11px}
.lh{padding:8px 14px 2px;font-size:11.5px;color:var(--muted)}
#map{flex:1;min-width:0;position:relative}
.reopen{position:absolute;left:10px;top:10px;z-index:5;border:0;background:#fff;border-radius:10px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;font:600 12.5px inherit;font-family:inherit;display:none}
.main.closed .reopen{display:block}
.banner{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:4;background:rgba(255,255,255,.96);border-radius:99px;padding:6px 16px;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.15);max-width:70%;text-align:center}
.nowebgl{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:30px;background:#eef3f1;z-index:6}
/* legend */
footer{background:#fff;border-top:1px solid var(--line);padding:7px 14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
footer b{font-weight:600;color:var(--ink)}
footer span.i{display:inline-flex;align-items:center;gap:5px}
footer .ramp{width:90px;height:9px;border-radius:5px;background:linear-gradient(90deg,#bfdbfe,#2563eb,#1e3a8a)}
.tools{position:absolute;right:10px;bottom:34px;z-index:4;display:flex;flex-direction:column;gap:6px}
.tools button{border:0;background:#fff;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.2);padding:7px 10px;cursor:pointer;font:500 12px inherit;font-family:inherit}
.tools button.on{background:#0f6b4f;color:#fff}
/* popup */
.maplibregl-popup-content{border-radius:14px;padding:12px 14px;font-family:"IBM Plex Sans Thai",sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.mp h4{font:500 15px Mitr,sans-serif;margin:0 0 2px;padding-right:14px}
.mp small{color:var(--muted);font-size:11.5px}
.mp .sc{display:flex;gap:10px;align-items:center;margin:8px 0}
.mp .sc i{font:500 17px Mitr,sans-serif;font-style:normal;color:#fff;width:46px;height:46px;border-radius:12px;display:grid;place-items:center}
.mp table{width:100%;border-collapse:collapse;font-size:12.5px}
.mp td{padding:4px 0;border-top:1px solid #edf2ef;vertical-align:top}.mp td:last-child{text-align:right;white-space:nowrap;padding-left:8px}
.mp .need{margin-top:6px;font-size:11.5px;color:#b91c1c}
.vh{filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));transform:scale(var(--vs,1));pointer-events:none}.vh.pl{z-index:9}.vh.ps{opacity:.8}
.lmk{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.94);border:2px solid #8b5cf6;border-radius:14px;padding:1px 7px 1px 3px;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none}.lmk span{font-size:14px}.lmk em{font-style:normal;font-size:10.5px;font-weight:600;color:#0f2a24}
.tip{pointer-events:none}.tip .maplibregl-popup-content{padding:6px 10px;font-size:12px;border-radius:9px}
.seg{flex-wrap:wrap;max-width:560px}.seg button{white-space:nowrap}
.mk{cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));transition:transform .15s;animation:mkin .55s cubic-bezier(.2,1.5,.4,1) both}
.mk:hover{transform:scale(1.3)}.mk svg{display:block;overflow:visible}
@keyframes mkin{from{opacity:0;transform:scale(.1) translateY(-30px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
.kpi{animation:pop .5s ease both}.kpi:nth-child(2){animation-delay:.06s}.kpi:nth-child(3){animation-delay:.12s}.kpi:nth-child(4){animation-delay:.18s}.kpi:nth-child(5){animation-delay:.24s}.kpi:nth-child(6){animation-delay:.3s}
.pill.on{box-shadow:0 4px 14px rgba(20,163,127,.45)}@keyframes glow{50%{box-shadow:0 4px 22px rgba(20,163,127,.8)}}
.dlab{cursor:pointer;font-family:"IBM Plex Sans Thai",sans-serif;background:rgba(255,255,255,.95);border-radius:12px;padding:5px 9px 6px;box-shadow:0 3px 14px rgba(0,0,0,.3);min-width:128px;animation:mkin .6s cubic-bezier(.2,1.5,.4,1) both;font-size:12px}
.dlab b{font:500 13px Mitr,sans-serif}.dlab .dv{font:600 15px Mitr,sans-serif;margin-left:4px}.dlab small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.dlab .sb{display:flex;height:6px;border-radius:4px;overflow:hidden;background:#e2e8f0;margin-top:3px}.dlab .sb i{display:block;height:100%}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}aside{position:absolute;z-index:6;height:100%}.asof{display:none}}
</style>
</head>

  var h=hd*Math.PI/180,sn=Math.sin(h),cs=Math.cos(h),kx=111320*Math.cos(la*Math.PI/180);
  return pts.map(function(q){var x=q[0]*L,y=q[1]*L,e=x*cs+y*sn,n=-x*sn+y*cs;return [lo+e/kx,la+n/110574]}) }
function rect(x0,x1,y0,y1){return [[x0,y0],[x1,y0],[x1,y1],[x0,y1],[x0,y0]]}
function part(F,la,lo,hd,L,poly,b,h,c){ var r=place(la,lo,hd,poly,L); F.push({type:'Feature',properties:{c:c,b:b*L,h:h*L},geometry:{type:'Polygon',coordinates:[r]}}) }
function modelCar(F,la,lo,hd,L,col){ part(F,la,lo,hd,L,[[-.2,-.5],[.2,-.5],[.23,-.38],[.23,.38],[.18,.5],[-.18,.5],[-.23,.38],[-.23,-.38],[-.2,-.5]],0,.2,col);
  part(F,la,lo,hd,L,rect(-.19,.19,-.18,.3),.2,.36,'#bfe6ff'); part(F,la,lo,hd,L,rect(-.19,.19,-.14,.24),.36,.4,col);
  part(F,la,lo,hd,L,rect(-.2,.2,.42,.48),.12,.15,'#fff7c2'); part(F,la,lo,hd,L,rect(-.2,.2,-.48,-.43),.12,.15,'#ef4444') }
function modelBus(F,la,lo,hd,L,col){ part(F,la,lo,hd,L,rect(-.19,.19,-.5,.5),0,.16,col); part(F,la,lo,hd,L,rect(-.195,.195,-.46,.46),.16,.3,'#1e3a5f'); part(F,la,lo,hd,L,rect(-.19,.19,-.5,.5),.3,.34,'#fff'); part(F,la,lo,hd,L,rect(-.19,.19,.46,.5),.16,.3,'#bfe6ff') }
function modelTrain(F,la,lo,hd,L,col,head){ part(F,la,lo,hd,L,rect(-.16,.16,-.5,.5),0,.12,col); part(F,la,lo,hd,L,rect(-.165,.165,-.46,.46),.12,.23,'#1e3a5f'); part(F,la,lo,hd,L,rect(-.16,.16,-.5,.5),.23,.27,'#f8fafc');
  part(F,la,lo,hd,L,rect(-.12,.12,-.3,.3),.27,.31,'#cbd5e1'); if(head) part(F,la,lo,hd,L,rect(-.16,.16,.46,.5),.12,.23,'#fef08a') }
function modelPlane(F,S2,la,lo,hd,L,alt,tail){ var B=alt, W='#ffffff';

  part(F,la,lo,hd,L,fus,B+.02,B+.13,W);
  part(F,la,lo,hd,L,[[-.075,.06],[-.5,-.14],[-.5,-.06],[-.075,.2],[-.075,.06]],B+.05,B+.075,'#e2e8f0');
  part(F,la,lo,hd,L,[[.075,.06],[.5,-.14],[.5,-.06],[.075,.2],[.075,.06]],B+.05,B+.075,'#e2e8f0');
  part(F,la,lo,hd,L,[[-.5,-.14],[-.44,-.15],[-.44,-.07],[-.5,-.06],[-.5,-.14]],B+.05,B+.115,tail);
  part(F,la,lo,hd,L,[[.5,-.14],[.44,-.15],[.44,-.07],[.5,-.06],[.5,-.14]],B+.05,B+.115,tail);
  part(F,la,lo,hd,L,rect(-.014,.014,-.5,-.3),B+.13,B+.29,tail);
  part(F,la,lo,hd,L,[[-.075,-.43],[-.24,-.5],[-.24,-.45],[-.075,-.36],[-.075,-.43]],B+.06,B+.08,'#e2e8f0');
  part(F,la,lo,hd,L,[[.075,-.43],[.24,-.5],[.24,-.45],[.075,-.36],[.075,-.43]],B+.06,B+.08,'#e2e8f0');
  part(F,la,lo,hd,L,rect(-.2,-.15,-.05,.1),B+.02,B+.065,'#64748b'); part(F,la,lo,hd,L,rect(.15,.2,-.05,.1),B+.02,B+.065,'#64748b');

var VEH={on:true,items:[],raf:0,last:0};
function initVeh(){ if(!map||VEH.items.length) return;
  var gr=prep(RT.green.p),yr=prep(RT.yellow.p),sk=prep(RT.sukh.p),bn=prep(RT.bangna.p),tp=prep(RT.thep.p);
  [[gr,'#22c55e',0,60],[gr,'#22c55e',.5,60],[yr,'#facc15',.2,46],[yr,'#facc15',.7,46]].forEach(function(x){VEH.items.push({k:'train',R:x[0],col:x[1],ph:x[2],per:x[3],n:4})});
  var bc=['#f97316','#ef4444','#3b82f6','#a855f7','#14b8a6','#eab308'];
  [[sk,70,0],[sk,64,.4],[bn,80,.1],[tp,50,.6],[bn,72,.55],[sk,58,.8]].forEach(function(x,j){VEH.items.push({k:'bus',R:x[0],per:x[1],ph:x[2],dir:j%2?-1:1,col:bc[j%bc.length]})});
  [[sk,38],[sk,44],[bn,46],[bn,52],[bn,41],[tp,36],[sk,57],[bn,63],[tp,48],[sk,33],[bn,37],[tp,55]].forEach(function(x,j){VEH.items.push({k:'car',R:x[0],per:x[1],ph:(j*.137)%1,dir:j%2?-1:1,col:CARC[j%CARC.length]})});
  [['r2',0,'dep',26,0],['r2',0,'dep',26,.5],['r3',1,'arr',26,.15],['r3',1,'arr',26,.65],['r1',0,'dep',34,.3],['r1',0,'arr',34,.8]].forEach(function(x,j){ var w=RWY[x[0]], a=w[0],b=w[1],dy=(b[0]-a[0])*110574,dx=(b[1]-a[1])*111320*Math.cos(a[0]*Math.PI/180),L=Math.sqrt(dx*dx+dy*dy),ux=dx/L,uy=dy/L,ext=7000;
    var far=function(p,sg){return [p[0]+sg*uy*ext/110574,p[1]+sg*ux*ext/(111320*Math.cos(p[0]*Math.PI/180))]};
    var R=x[2]==='dep'?prep([a,b,far(b,1)]):prep([far(a,-1),a,b]);
    VEH.items.push({k:'plane',R:R,L:L,mode:x[2],per:x[3],ph:x[4],tail:TAILC[j%TAILC.length]}); });
  (function loop(now){ vehTick(now); VEH.raf=requestAnimationFrame(loop); })(performance.now()); }
function vehTick(now){ var s1=map&&map.getSource('veh3d'),s2=map&&map.getSource('vehsh'); if(!s1||!s2) return;
  if(!VEH.on){ if(VEH.last){s1.setData({type:'FeatureCollection',features:[]});s2.setData({type:'FeatureCollection',features:[]});VEH.last=0} return; }
  if(now-VEH.last<33) return; VEH.last=now; var t=now/1000,F=[],S2=[],m=mpp(13.62)*Math.max(.18,Math.min(1.5,Math.pow(2,(map.getZoom()-12)*.5)*.5));
  VEH.items.forEach(function(v){ var f=((t/v.per)+v.ph)%1,p,hd,Lm=PX[v.k]*m;
    if(v.k==='train'){ var q=f<.5?f*2:(1-f)*2,fw=f<.5,sp=Lm*1.1; q=Math.max(0,Math.min(1,q)); var s=q*v.R.len;
      for(var j=0;j<v.n;j++){ var sj=fw?s-j*sp:s+j*sp; p=at(v.R,sj); hd=fw?p[2]:(p[2]+180)%360; modelTrain(F,p[0],p[1],hd,Lm,v.col,j===0) } }
    else if(v.k==='bus'||v.k==='car'){ var g=v.dir>0?f:1-f; p=at(v.R,g*v.R.len); hd=v.dir>0?p[2]:(p[2]+180)%360; var off=(v.dir>0?1:-1)*Lm*.28, rr=place(p[0],p[1],hd,[[1,0]],off*1)[0]; (v.k==='bus'?modelBus:modelCar)(F,rr[1],rr[0],hd,Lm,v.col) }
    else{ var s,alt; if(v.mode==='dep'){ var roll=v.L/v.R.len; var g1=f<.38?Math.pow(f/.38,2)*roll:roll+(f-.38)/.62*(1-roll); s=g1*v.R.len; alt=f<.38?0:Math.pow((f-.38)/.62,1.6); }
      else{ var ap=v.R.c[1]/v.R.len; var g2=f<.6?f/.6*(ap+.02):(ap+.02)+(1-Math.pow(1-(f-.6)/.4,2))*(1-ap-.02); s=g2*v.R.len; alt=f<.6?Math.pow(1-f/.6,1.4):0; }
      p=at(v.R,s); modelPlane(F,S2,p[0],p[1],p[2],Lm,alt*1.1,v.tail); } });
  s1.setData({type:'FeatureCollection',features:F}); s2.setData({type:'FeatureCollection',features:S2}); }
function vehShow(on){ VEH.on=on; if(map&&map.getLayer('routes')) map.setLayoutProperty('routes','visibility',on?'visible':'none'); }
/* ===== สถานที่สำคัญใกล้เคียง (ห้าง/ตลาด/รพ./คลินิก) — อ่านจากข้อมูล OpenStreetMap ในไทล์แผนที่ แล้วสร้างโมเดล 3 มิติ ===== */
var LM={on:true,db:{},mk:[],n:0},LMC={mall:{ic:'🏬',c:'#8b5cf6',t:'ห้างสรรพสินค้า'},market:{ic:'🛒',c:'#f59e0b',t:'ตลาด/ซูเปอร์มาร์เก็ต'},hosp:{ic:'🏥',c:'#ef4444',t:'โรงพยาบาล'},clinic:{ic:'⚕️',c:'#14b8a6',t:'คลินิก'}};
function lmCat(p){ var k=p['class']+'/'+p.subclass,nm=p.name||''; if(!nm) return null;
  if(k==='shop/mall'||k==='shop/department_store') return 'mall';
  if(k==='grocery/marketplace') return /ตลาด|market/i.test(nm)?'market':null;
  if(k==='grocery/supermarket') return /big ?c|บิ๊กซี|lotus|โลตัส|makro|แม็คโคร|tops|ท็อปส์|villa|วิลล่า|ตลาด|ห้าง/i.test(nm)?'market':null;
  if(/รพ\.สต|ส่งเสริมสุขภาพ|สถานีอนามัย|ศสช|ศูนย์บริการสาธารณสุข|ศูนย์สุขภาพ/.test(nm)) return null;
  if(k==='hospital/hospital') return /คลินิก/.test(nm)&&!/โรงพยาบาล|รพ\./.test(nm)?'clinic':'hosp';
  if(k==='hospital/clinic') return /โรงพยาบาล|รพ\./.test(nm)?null:'clinic';
  if(p['class']==='doctors'||p['class']==='dentist') return 'clinic';
  return null; }
function lmHarvest(){ var P=map.querySourceFeatures('openmaptiles',{sourceLayer:'poi'}),add=0;
  P.forEach(function(f){ var c=lmCat(f.properties); if(!c||f.geometry.type!=='Point') return; var ll=f.geometry.coordinates,la=ll[1],lo=ll[0],dup=false;
    for(var id in LM.db){ var o=LM.db[id]; if(o.c!==c) continue; if(Math.abs(o.la-la)<.0007&&Math.abs(o.lo-lo)<.0007){dup=true;break} if(o.n===f.properties.name&&Math.abs(o.la-la)<.004&&Math.abs(o.lo-lo)<.004){dup=true;break} }
    if(dup) return; LM.db[la.toFixed(5)+','+lo.toFixed(5)]={c:c,n:f.properties.name,la:la,lo:lo}; add++; }); return add; }
function lmModel(F,o,s){ var la=o.la,lo=o.lo,P=function(poly,b,h,col){part(F,la,lo,0,s,poly,b,h,col)}, R=rect;
  if(o.c==='mall'){ P(R(-62,62,-38,38),0,9,'#f5f3ff'); P(R(-60,60,-36,36),9,20,'#38bdf8'); P(R(-62,62,-38,38),20,23,'#a78bfa'); P(R(-16,16,-37,-30),23,36,'#f43f5e'); P(R(-16,16,38,48),0,5,'#fbbf24'); P(R(-50,-30,-20,0),23,27,'#c4b5fd'); }
  else if(o.c==='market'){ P(R(-46,46,-24,24),0,6,'#fde68a'); for(var i=0;i<6;i++) P(R(-46+i*15.4,-46+(i+1)*15.4,-26,26),6,10+(i%2)*1.5,i%2?'#fff7ed':'#ef4444'); P(R(-8,8,24,30),0,4,'#22c55e'); }
  else if(o.c==='hosp'){ P(R(-42,-20,-11,11),0,20,'#e2e8f0'); P(R(20,42,-11,11),0,20,'#e2e8f0'); P(R(-20,20,-15,15),0,46,'#f8fafc'); P(R(-20.6,20.6,-15.6,15.6),26,30,'#38bdf8'); P(R(-3,3,-10,10),46,49,'#ef4444'); P(R(-10,10,-3,3),46,49,'#ef4444'); P(R(-8,8,15,22),0,5,'#fde68a'); }
  else { P(R(-10,10,-8,8),0,9,'#f1f5f9'); P(R(-11,11,-9,9),9,11,'#14b8a6'); P(R(-1.4,1.4,-5,5),11,13,'#22c55e'); P(R(-5,5,-1.4,1.4),11,13,'#22c55e'); } }

    if(z>=13.6){ var e=document.createElement('div'),i=document.createElement('div'); i.className='lmk'; i.style.borderColor=LMC[o.c].c; i.innerHTML='<span>'+LMC[o.c].ic+'</span><em>'+E(o.n.length>22?o.n.slice(0,21)+'…':o.n)+'</em>'; e.appendChild(i);
      LM.mk.push(new maplibregl.Marker({element:e,anchor:'bottom',offset:[0,-Math.min(120,28*s+26)]}).setLngLat([o.lo,o.la]).addTo(map)); } });
  map.getSource('lm3d').setData({type:'FeatureCollection',features:F}); }
