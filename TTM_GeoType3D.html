<style>
:root{--ink:#0f2a24;--ink2:#41554e;--muted:#74867f;--line:#e2ebe7;--bg:#f4f8f6;--card:#fff;--brand:#0f6b4f;--brand2:#14a37f;--ok:#16a34a;--near:#eab308;--bad:#dc2626;--nil:#94a3b8;--blue:#2563eb}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"IBM Plex Sans Thai",Tahoma,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,.mitr{font-family:Mitr,"IBM Plex Sans Thai",sans-serif;font-weight:500;margin:0}
/* header */
header{background:#fff;display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#0ea5e9,#14a37f,#eab308) 1;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo i{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#14a37f,#0ea5e9);display:grid;place-items:center;color:#fff;font:600 22px Mitr,sans-serif;font-style:normal;box-shadow:0 4px 12px rgba(20,163,127,.35)}
.logo b{display:block;font:600 19px Mitr,sans-serif;letter-spacing:1.5px;line-height:1.1}
.logo small{display:block;font-size:10.5px;letter-spacing:1.2px;color:var(--muted)}
.sep{width:1px;align-self:stretch;background:var(--line)}
.seg{display:flex;align-items:center;gap:4px;background:#f1f5f3;padding:3px 4px;border-radius:12px}
.seg span.l{font-size:11.5px;color:var(--muted);padding:0 6px}
.seg button{border:0;background:transparent;font:500 12.5px inherit;font-family:inherit;padding:6px 11px;border-radius:9px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{border:0;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;color:#fff;background:#0f1f1b;padding:7px 14px;border-radius:99px;transition:.15s;border:2px solid transparent}
.pill:hover{transform:translateY(-1px)}
.pill.on{background:linear-gradient(135deg,#0f6b4f,#14a37f);box-shadow:0 4px 14px rgba(20,163,127,.45);border-color:#a7f3d0}
.asof{margin-left:auto;text-align:right;font-size:11.5px;color:var(--muted);line-height:1.35}
.asof b{color:var(--ink);font-weight:600}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
.kpi{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;min-width:0}
.kpi .t{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .n{font:500 24px Mitr,sans-serif;line-height:1.25}
.kpi .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.kpi.hl{background:linear-gradient(180deg,#fff,#f0fdf7);border-color:#bbf7d0}
/* body */
.main{flex:1;display:flex;min-height:0;position:relative}
aside{width:310px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:margin .2s}
aside.hide{margin-left:-310px}
.ah{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 4px}
.ah h2{font-size:18px}
.ah button{border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;width:30px;height:28px}
.fs{padding:6px 14px 10px;border-bottom:1px solid var(--line)}
.fs label{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin:8px 0 4px}
.fs select,.fs input[type=search]{width:100%;font:inherit;padding:8px 10px;border:1px solid #cfdad5;border-radius:10px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid #cfdad5;background:#fff;border-radius:99px;padding:4px 10px;font:500 12px inherit;font-family:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink2)}
.chip.on{border-color:var(--brand2);background:#ecfdf5;color:#065f46;font-weight:600}
.list{flex:1;overflow:auto;padding:4px 8px 10px}
.row{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.row:hover{background:#f1f8f5;border-color:#d5e8df}
.row .v{min-width:46px;text-align:center;font:600 12.5px Mitr,sans-serif;color:#fff;border-radius:8px;padding:3px 0}
.row b{display:block;font-size:12.5px;font-weight:600;line-height:1.25}
.row small{color:var(--muted);font-size:11px}
.lh{padding:8px 14px 2px;font-size:11.5px;color:var(--muted)}
#map{flex:1;min-width:0;position:relative}
.reopen{position:absolute;left:10px;top:10px;z-index:5;border:0;background:#fff;border-radius:10px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;font:600 12.5px inherit;font-family:inherit;display:none}
.main.closed .reopen{display:block}
.banner{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:4;background:rgba(255,255,255,.96);border-radius:99px;padding:6px 16px;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.15);max-width:70%;text-align:center}
.nowebgl{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:30px;background:#eef3f1;z-index:6}
/* legend */
footer{background:#fff;border-top:1px solid var(--line);padding:7px 14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
footer b{font-weight:600;color:var(--ink)}
footer span.i{display:inline-flex;align-items:center;gap:5px}
footer .ramp{width:90px;height:9px;border-radius:5px;background:linear-gradient(90deg,#bfdbfe,#2563eb,#1e3a8a)}
.tools{position:absolute;right:10px;bottom:34px;z-index:4;display:flex;flex-direction:column;gap:6px}
.tools button{border:0;background:#fff;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.2);padding:7px 10px;cursor:pointer;font:500 12px inherit;font-family:inherit}
.tools button.on{background:#0f6b4f;color:#fff}
/* popup */
.maplibregl-popup-content{border-radius:14px;padding:12px 14px;font-family:"IBM Plex Sans Thai",sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.mp h4{font:500 15px Mitr,sans-serif;margin:0 0 2px;padding-right:14px}
.mp small{color:var(--muted);font-size:11.5px}
.mp .sc{display:flex;gap:10px;align-items:center;margin:8px 0}
.mp .sc i{font:500 17px Mitr,sans-serif;font-style:normal;color:#fff;width:46px;height:46px;border-radius:12px;display:grid;place-items:center}
.mp table{width:100%;border-collapse:collapse;font-size:12.5px}
.mp td{padding:4px 0;border-top:1px solid #edf2ef;vertical-align:top}.mp td:last-child{text-align:right;white-space:nowrap;padding-left:8px}
.mp .need{margin-top:6px;font-size:11.5px;color:#b91c1c}
.tip{pointer-events:none}.tip .maplibregl-popup-content{padding:6px 10px;font-size:12px;border-radius:9px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}aside{position:absolute;z-index:6;height:100%}.asof{display:none}}
</style>
</head>

    if(k!=='ALL'){withData.forEach(function(u){sa+=u.e[k].a;sb+=u.e[k].b});}
    var avg=k==='ALL'?(withData.length?withData.reduce(function(a,u){return a+u.score},0)/withData.length:null):(sb?sa/sb*100:null);
    h+=card(k==='ALL'?'คะแนนรวมเฉลี่ย':'ผลรวมทุกหน่วย (ที่แสดง)',k==='ALL'?(avg==null?'–':avg.toFixed(1)):P(avg,2),k==='ALL'?'จาก '+N(withData.length)+' หน่วยที่มีข้อมูล':(k==='PP'?'เกณฑ์ภายใน ≥50% (ไม่ใช่เกณฑ์ทางการ)':'ตัวตั้ง '+N(sa)+' / ตัวหาร '+N(sb)),'#14a37f',true);
    h+=card('ผ่านเกณฑ์',N(cn.g),k==='ALL'?'ผ่านทุกตัวชี้วัดที่มีข้อมูล':'ถึงเกณฑ์',COL.g);
    h+=card('ใกล้เกณฑ์',N(cn.y),k==='ALL'?'ผ่านบางตัว':'≥80% ของเกณฑ์',COL.y);
    h+=card('ต่ำกว่าเกณฑ์',N(cn.r),k==='ALL'?'คะแนนรวม <50':'<80% ของเกณฑ์',COL.r);
    h+=card('ไม่มีข้อมูล',N(cn.x),'ไม่มีผู้รับบริการ/ไม่เข้าเกณฑ์',COL.x);
  }
  document.getElementById('kpis').innerHTML=h;
  /* list */
  var L=F.slice().sort(function(a,b){var x=val(a,k),y=val(b,k);if(k==='ONTOP')return (y.v||-1)-(x.v||-1);return (x.v==null?999:(k==='ALL'?x.v:x.v/(I.crit?I.crit(a):1)))-(y.v==null?999:(k==='ALL'?y.v:y.v/(I.crit?I.crit(b):1)))});
  document.getElementById('lh').textContent='รายชื่อหน่วย '+L.length+' แห่ง · '+(k==='ONTOP'?'เรียงจากเงินมากไปน้อย':'เรียงจากต่ำกว่าเกณฑ์ก่อน');
  document.getElementById('list').innerHTML=L.map(function(u){var v=val(u,k);var txt=v.v==null?'–':(k==='ALL'?v.v:(k==='ONTOP'?(u.amt>=1000?(u.amt/1000).toFixed(1)+'k':N(u.amt)):v.v.toFixed(1)+'%'));
    return '<div class="row" data-c="'+u.code+'"><span class="v" style="background:'+colorOf(u,v)+'">'+txt+'</span><span><b>'+E(u.n)+'</b><small>'+E(DNAME[u.dist]||u.dist)+' · '+TLAB[u.t]+(u.ll?'':' · ยังไม่มีพิกัด')+'</small></span></div>'}).join('')||'<div class="lh">ไม่มีหน่วยตามเงื่อนไข</div>';
  /* legend */
  var lg='<b>'+E(I.name)+'</b>';
  if(k==='ONTOP') lg+='<span class="i"><span class="ramp"></span> น้อย → มาก (ความสูง/สี = เงินชดเชย)</span>';
  else lg+=['g','y','r','x'].map(function(s){return '<span class="i"><span class="dot" style="background:'+COL[s]+'"></span>'+STN[s]+'</span>'}).join('')+'<span class="i">ความสูงแท่ง = '+(k==='ALL'?'คะแนนรวม':'ผลงาน ÷ เกณฑ์')+'</span>';
  lg+='<span class="i" style="margin-left:auto;color:#74867f">ตชว.14 ≥50% · PA OPD รพ. ≥15% / สสอ.(รพ.สต.) ≥50% · IMC ≥25% · กัญชาเป็นการติดตาม ไม่รวมคะแนน</span>';
  document.getElementById('legend').innerHTML=lg;
  document.getElementById('banner').textContent=(S.dist?(DNAME[S.dist]||S.dist):'จ.สมุทรปราการ')+' · '+I.name+' · '+F.length+' หน่วย';
  pushMap(F);
}
/* ---- popup ---- */
function popHTML(u){
  var rows=['PRIM','OPD','IMC','PP'].map(function(k){var e=u.e[k];var nm=IMAP[k].name;
    if(!e) return '<tr><td>'+E(nm)+'</td><td style="color:#94a3b8">ไม่มีข้อมูล</td></tr>';
    return '<tr><td>'+E(nm)+' <small>(เกณฑ์ ≥'+e.c+'%)</small></td><td><b>'+P(e.v)+'</b> '+(e.s==='g'?'✅':e.s==='y'?'⚠️':'❌')+'<br><small>'+N(e.a)+' / '+N(e.b)+'</small></td></tr>'}).join('');
  rows+='<tr><td>💰 เงินชดเชย On-top</td><td>'+(u.amt!=null?'<b>'+N(u.amt)+'</b> บาท<br><small>'+N(u.items)+' รายการ</small>':'<span style="color:#94a3b8">ไม่พบรายการ</span>')+'</td></tr>';
  rows+='<tr><td>💊 มูลค่ายาสมุนไพร UC</td><td>'+(u.UC?'<b>'+N(u.UC[0])+'</b> บาท'+(u.UC[1]?'<br><small>'+N(u.UC[1])+' คอร์ส</small>':''):'<span style="color:#94a3b8">รอข้อมูล</span>')+'</td></tr>';
  var need=['PRIM','OPD','IMC','PP'].filter(function(k){return u.e[k]&&u.e[k].s!=='g'}).map(function(k){var e=u.e[k];return E(k)+' ขาดอีก '+N(Math.max(0,Math.ceil(e.b*e.c/100-e.a)))+' ครั้ง/ราย'});
  return '<div class="mp"><h4>'+E(u.n)+'</h4><small>'+E(DNAME[u.dist]||u.dist)+' · '+TLAB[u.t]+' · รหัส '+u.code+'</small>'
   +'<div class="sc"><i style="background:'+COL[u.os]+'">'+(u.score==null?'–':u.score)+'</i><div><b>'+(u.cnt?('ผ่าน '+u.pass+'/'+u.cnt+' ตัวชี้วัด'):'ไม่มีข้อมูลตัวชี้วัด')+'</b><br><small>'+STN[u.os]+'</small></div></div>'
   +'<table>'+rows+'</table>'+(need.length?'<div class="need">'+need.join('<br>')+'</div>':'')+'</div>';
}
function openUnit(u,fly){ if(!map||!u||!u.ll) return; var c=[u.ll[1],u.ll[0]];
  if(fly) map.flyTo({center:c,zoom:15,pitch:S.d3?60:0,duration:1100});
  if(popup) popup.remove(); popup=new maplibregl.Popup({maxWidth:'340px',offset:12}).setLngLat(c).setHTML(popHTML(u)).addTo(map); }
/* ---- map ---- */
function sq(u,h,col,s){var la=u.ll[0],lo=u.ll[1],d=0.0014;return{type:'Feature',properties:{code:u.code,n:u.n,h:h,c:col,s:s},geometry:{type:'Polygon',coordinates:[[[lo-d,la-d],[lo+d,la-d],[lo+d,la+d],[lo-d,la+d],[lo-d,la-d]]]}}}
function pt(u,col,sz,lab){return{type:'Feature',properties:{code:u.code,n:u.n,c:col,sz:sz,lab:lab},geometry:{type:'Point',coordinates:[u.ll[1],u.ll[0]]}}}
function pushMap(F){ if(!ready) return; var bars=[],dots=[],k=S.ind; var maxb=1;F.forEach(function(u){var v=val(u,k);maxb=Math.max(maxb,(k==='ALL'||k==='ONTOP')?1:(u.e[k]?u.e[k].b:1))});
  F.forEach(function(u){ if(!u.ll) return; var v=val(u,k),col=colorOf(u,v);
    bars.push(sq(u,v.s==='x'?30:60+v.h*1100,col,v.s));
    var sz=(k==='ALL'||k==='ONTOP')?(v.s==='x'?.5:.6+v.h*.9):(u.e[k]?.5+Math.sqrt(u.e[k].b/maxb)*1.1:.5); dots.push(pt(u,col,sz,v.label||'ไม่มีข้อมูล')); });
  map.getSource('bars').setData({type:'FeatureCollection',features:bars});
  map.getSource('dots').setData({type:'FeatureCollection',features:dots});
  map.setLayoutProperty('bars','visibility',S.mode==='bar'?'visible':'none');
  map.setLayoutProperty('dots','visibility',S.mode==='dot'?'visible':'none');
}
function fit(F){ var pts=(F||DATA).filter(function(u){return u.ll}); if(!pts.length||!map) return; var b=new maplibregl.LngLatBounds();pts.forEach(function(u){b.extend([u.ll[1],u.ll[0]])});
  map.fitBounds(b,{padding:{top:60,bottom:50,left:50,right:50},maxZoom:14,pitch:S.d3?55:0,bearing:S.d3?-12:0,duration:900}); }
function glOK(){try{var c=document.createElement('canvas');return !!(window.maplibregl&&(c.getContext('webgl2')||c.getContext('webgl')))}catch(e){return false}}
var STYLE_VEC='https://tiles.openfreemap.org/styles/positron';
var STYLE_SAT={version:8,sources:{sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19,attribution:'Imagery © Esri'},lab:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19}},layers:[{id:'sat',type:'raster',source:'sat'},{id:'lab',type:'raster',source:'lab'}]};
function addLayers(){
  map.addSource('bars',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addSource('dots',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'bars',type:'fill-extrusion',source:'bars',paint:{'fill-extrusion-color':['get','c'],'fill-extrusion-height':['get','h'],'fill-extrusion-base':0,'fill-extrusion-opacity':.92,'fill-extrusion-vertical-gradient':true}});
  map.addLayer({id:'dots',type:'circle',source:'dots',paint:{'circle-color':['get','c'],'circle-opacity':.78,'circle-stroke-color':'#fff','circle-stroke-width':1.5,'circle-radius':['interpolate',['linear'],['zoom'],9,['*',['get','sz'],5],14,['*',['get','sz'],20]]}});
  ['bars','dots'].forEach(function(l){
    map.on('click',l,function(e){var f=e.features&&e.features[0]; if(!f) return; var u=DATA.filter(function(x){return x.code===f.properties.code})[0]; openUnit(u,false)});
    map.on('mouseenter',l,function(){map.getCanvas().style.cursor='pointer'});
    map.on('mouseleave',l,function(){map.getCanvas().style.cursor='';if(tip){tip.remove();tip=null}});
    map.on('mousemove',l,function(e){var f=e.features&&e.features[0]; if(!f) return; if(!tip) tip=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:12,className:'tip'}); tip.setLngLat(e.lngLat).setHTML('<b>'+E(f.properties.n)+'</b>').addTo(map)});
  });
  ready=true; updateUI();
}
function initMap(){
  if(!glOK()){document.getElementById('nogl').style.display='grid';updateUI();return}
  map=new maplibregl.Map({container:'map',style:STYLE_VEC,center:[100.6,13.6],zoom:10,pitch:55,bearing:-12,maxPitch:75,preserveDrawingBuffer:true,attributionControl:{compact:true}});
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right'); map.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-left');
  map.on('load',function(){addLayers();fit(DATA)});
}
function setStyle(){ ready=false; map.setStyle(S.sat?STYLE_SAT:STYLE_VEC); map.once('style.load',function(){addLayers()}); }
/* ---- events ---- */
document.getElementById('pills').addEventListener('click',function(e){var b=e.target.closest('.pill');if(!b)return;S.ind=b.dataset.k;updateUI()});
document.querySelector('.seg').addEventListener('click',function(e){var b=e.target.closest('[data-m]');if(!b)return;S.mode=b.dataset.m;updateUI()});
document.getElementById('fDist').addEventListener('change',function(e){S.dist=e.target.value;updateUI();fit(filtered())});
document.getElementById('fType').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(!b)return;var t=b.dataset.t;S.types[t]=S.types[t]?0:1;b.classList.toggle('on',!!S.types[t]);updateUI()});
document.getElementById('fSt').addEventListener('click',function(e){var b=e.target.closest('[data-s]');if(!b)return;var s=b.dataset.s;S.st[s]=S.st[s]?0:1;b.classList.toggle('on',!!S.st[s]);updateUI()});
document.getElementById('fQ').addEventListener('input',function(e){S.q=e.target.value;updateUI()});
document.getElementById('list').addEventListener('click',function(e){var r=e.target.closest('.row');if(!r)return;var u=DATA.filter(function(x){return x.code===r.dataset.c})[0];if(u&&u.ll)openUnit(u,true)});
function side(open){document.getElementById('aside').classList.toggle('hide',!open);document.getElementById('main').classList.toggle('closed',!open);if(map)setTimeout(function(){map.resize()},250)}
document.getElementById('hideA').onclick=function(){side(false)};document.getElementById('showA').onclick=function(){side(true)};
document.getElementById('b3d').onclick=function(){S.d3=!S.d3;this.classList.toggle('on',S.d3);this.textContent=S.d3?'🏙️ 3 มิติ':'🗺️ 2 มิติ';if(map)map.easeTo({pitch:S.d3?55:0,bearing:S.d3?-12:0,duration:700})};
document.getElementById('bsat').onclick=function(){S.sat=!S.sat;this.classList.toggle('on',S.sat);if(map)setStyle()};
document.getElementById('bpng').onclick=function(){if(!map)return;map.once('idle',function(){map.getCanvas().toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='TTM_GeoType3D_พย70.png';a.click()})});map.triggerRepaint()};
buildUI();initMap();if(!map)updateUI();
</script>
</body>
