document.getElementById('elist').addEventListener('change',function(e){ var m={elt:'ft',eld:'fd',els:'fs'}[e.target.id]; if(m){ ES_SO[m]=e.target.value; esList(); } });
document.getElementById('esum').addEventListener('click',function(e){ var m=e.target.closest('[data-esm]'); if(!m) return; if(m.dataset.esm==='close'){ES_SO.sumOpen=false;esSum()} else if(m.dataset.esm==='list') esListOpen(); });
document.getElementById('estp').addEventListener('change',function(e){ var t=e.target; if(t.dataset.esl){ ES.ls[t.dataset.esl]=t.checked?1:0; esRender(); } else if(t.dataset.es==='can'){ CS.on=t.checked; document.getElementById('bcan').classList.toggle('on',CS.on); canChips(); canRender(); if(CS.on) ES_SO.sumOpen=true; esSum(); } else if(t.dataset.es){ ES.on[t.dataset.es]=t.checked?1:0; esSave(); if(t.checked) ES_SO.sumOpen=true; esRender(); } else if(t.name==='esfl'){ ES.fl=t.value; esRender(); } });
document.getElementById('estp').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; var a=b.dataset.esa; if(a==='csv'){esCSV();return} if(a==='sum'){ES_SO.sumOpen=true;esSum();return} if(a==='lst'){ES_SO.sumOpen=true;esSum();esListOpen();return} if(a==='imp'){document.getElementById('estf').click();return} if(a==='tpl'){esTpl();return} if(a==='clr'){esClearUser();return} Object.keys(ESTC).forEach(function(k){ES.on[k]=a==='all'?1:0}); CS.on=a==='all'; document.getElementById('bcan').classList.toggle('on',CS.on); canChips(); canRender(); ES_SO.sumOpen=(a==='all'); esSave(); esPanel(); });
document.getElementById('best').onclick=function(ev){ ev.stopPropagation(); var p=document.getElementById('estp'); p.classList.toggle('open'); if(p.classList.contains('open')) esPanel(); };
document.getElementById('estp').addEventListener('change',function(e){ if(e.target.id==='estf'&&e.target.files[0]){ var fr=new FileReader(); fr.onload=function(){esImport(String(fr.result))}; fr.readAsText(e.target.files[0],'utf-8'); e.target.value=''; } });
/* ---- events ---- */
document.getElementById('pills').addEventListener('click',function(e){var b=e.target.closest('.pill');if(!b)return;S.ind=b.dataset.k;updateUI()});
document.getElementById('seg').addEventListener('click',function(e){var b=e.target.closest('[data-m]');if(!b)return;S.mode=b.dataset.m;updateUI()});
document.getElementById('fDist').addEventListener('change',function(e){S.dist=e.target.value;updateUI();fit(filtered())});
document.getElementById('fType').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(!b)return;var t=b.dataset.t;S.types[t]=S.types[t]?0:1;b.classList.toggle('on',!!S.types[t]);updateUI()});
document.getElementById('fCan').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; if(b.dataset.can==='on'){CS.on=!CS.on;} else if(b.dataset.can==='csv'){canCSV();return} else if(b.dataset.cst){CS.st[b.dataset.cst]=CS.st[b.dataset.cst]?0:1} else if(b.dataset.cyr){var y=b.dataset.cyr; CS.yr[y]=CS.yr[y]===0?1:0} canChips(); canRender(); document.getElementById('bcan').classList.toggle('on',CS.on); });
document.getElementById('bcan').onclick=function(){CS.on=!CS.on;this.classList.toggle('on',CS.on);if(CS.on)document.getElementById('canBox').open=true;canChips();canRender()};
document.getElementById('fSt').addEventListener('click',function(e){var xb=e.target.closest('[data-x]'); if(xb){S.exc=S.exc?0:1;xb.classList.toggle('on',!!S.exc);updateUI();return;} var b=e.target.closest('[data-s]');if(!b)return;var s=b.dataset.s;S.st[s]=S.st[s]?0:1;b.classList.toggle('on',!!S.st[s]);updateUI()});
document.getElementById('fQ').addEventListener('input',function(e){S.q=e.target.value;updateUI()});
document.getElementById('list').addEventListener('click',function(e){var r=e.target.closest('.row');if(!r)return;var u=DATA.filter(function(x){return x.code===r.dataset.c})[0];if(u&&u.ll)openUnit(u,true)});
function side(open){document.getElementById('aside').classList.toggle('hide',!open);document.getElementById('main').classList.toggle('closed',!open);if(map)setTimeout(function(){map.resize()},250)}
document.getElementById('hideA').onclick=function(){side(false)};document.getElementById('showA').onclick=function(){side(true)};
document.getElementById('b3d').onclick=function(){S.d3=!S.d3;this.classList.toggle('on',S.d3);this.textContent=S.d3?'🏙️ 3 มิติ':'🗺️ 2 มิติ';if(map)map.easeTo({pitch:S.d3?55:0,bearing:S.d3?-12:0,duration:700})};
document.getElementById('bsat').onclick=function(){S.sat=!S.sat;this.classList.toggle('on',S.sat);if(map)setStyle()};
document.getElementById('bpng').onclick=exportPNG;
document.getElementById('blm').onclick=function(){this.classList.toggle('on');LM.on=this.classList.contains('on');lmRender();if(LM.on)lmScan()};
document.getElementById('bveh').onclick=function(){this.classList.toggle('on');vehShow(this.classList.contains('on'))};
document.getElementById('borb').onclick=function(){if(tour.on)stopTour();orbit(!orbitOn)};
document.getElementById('btord').onclick=function(){TOUR_BEST=!TOUR_BEST;this.textContent=TOUR_BEST?'🏆 ดีสุดก่อน':'⚠️ แย่สุดก่อน';if(tour.on){stopTour();startTour()}};
document.getElementById('btour').onclick=function(){tour.on?stopTour():startTour()};
document.getElementById('bbld').onclick=function(){S.bld=!S.bld;this.classList.toggle('on',S.bld);if(map&&map.getLayer('bld3d'))map.setLayoutProperty('bld3d','visibility',S.bld?'visible':'none')};
buildUI();initMap();if(!map)updateUI();
</script>
</body>
</html>
